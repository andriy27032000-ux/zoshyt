<style>
/* Зошит боржників — стилі. Мотив: зошит у клітинку, чорнильна ручка, червоне поле. */
:root {
  --paper: #f5f7fb; --grid: #e3e8f2; --surface: #ffffff; --surface-2: #eef2f9;
  --text: #18203a; --muted: #5a6582; --line: #d5dcea;
  --ink: #2140a8; --ink-soft: #e4eafc; --on-ink: #ffffff;
  --bad: #c2362b; --bad-soft: #fbe7e4; --ok: #1c7a4a; --ok-soft: #e1f3e9;
  --warn: #8f5b00; --warn-soft: #fdf0d3; --info-soft: #e7eefc; --margin: #e79a92;
  --on-solid: #ffffff;
  --shadow: 0 1px 2px rgba(24,32,58,.06), 0 6px 20px rgba(24,32,58,.06);
  --r: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131b; --grid: #171c28; --surface: #181d28; --surface-2: #212838;
    --text: #e7eaf3; --muted: #9aa4bc; --line: #2d3549;
    --ink: #8ea5ff; --ink-soft: #232c4a; --on-ink: #0e1320;
    --bad: #ff8478; --bad-soft: #3a1d1c; --ok: #62d49c; --ok-soft: #15301f;
    --warn: #f2bd55; --warn-soft: #352a12; --info-soft: #1c2640; --margin: #7a3a36;
    --on-solid: #10131b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
    --paper: #10131b; --grid: #171c28; --surface: #181d28; --surface-2: #212838;
    --text: #e7eaf3; --muted: #9aa4bc; --line: #2d3549;
    --ink: #8ea5ff; --ink-soft: #232c4a; --on-ink: #0e1320;
    --bad: #ff8478; --bad-soft: #3a1d1c; --ok: #62d49c; --ok-soft: #15301f;
    --warn: #f2bd55; --warn-soft: #352a12; --info-soft: #1c2640; --margin: #7a3a36;
    --on-solid: #10131b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
}

/* розмір шрифту: звичайний і великий (для налаштування «великий шрифт») */
html { font-size: 1rem; }
:root[data-size="big"] { font-size: 1.1875rem; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font: 1rem/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  padding: 0 16px calc(90px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.125rem; }
h3 { font-size: 0.7812rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
p { margin: 0; }
.wrap { max-width: 1000px; margin: 0 auto; }
.muted { color: var(--muted); } .small { font-size: 0.8125rem; } .center { text-align: center; }
.txt-bad { color: var(--bad); } .txt-ok { color: var(--ok); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.stack { display: grid; gap: 12px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- верхня панель ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; border-bottom: 3px double var(--margin); }
.top-row { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand-name { font-weight: 800; font-size: 1.1875rem; letter-spacing: -.01em; }
.shop-switch { min-width: 0; flex: 1 1 auto; }
.shop-switch select { width: 100%; max-width: 320px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-weight: 600; min-height: 38px; }
.shop-name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.sync { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 0.7812rem; color: var(--muted); min-height: 32px; white-space: nowrap; }
.sync.ok { color: var(--ok); } .sync.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; } .sync.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.tabs { display: flex; gap: 4px; max-width: 1000px; margin: 0 auto; }
.tab { padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); font-weight: 550; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.tab svg { width: 1.15em; height: 1.15em; flex: none; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
@media (max-width: 430px) {
  .sync span { display: none; }
  .sync { padding: 5px 8px; }
  .admin-label { display: none; }
}
@media (max-width: 720px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; max-width: none; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; z-index: 6; }
  .tab { border-radius: 10px; flex: 1; text-align: center; font-size: 0.75rem; padding: 7px 2px 6px; display: grid; justify-items: center; gap: 2px; line-height: 1.15; }
  .tab svg { width: 1.45em; height: 1.45em; }
  .tab[aria-current="page"] { background: var(--ink-soft); box-shadow: none; }
  .brand-name { display: none; }
  .sync span { max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
  .top-right .btn.sm { padding: 0.35em 0.55em; }
}

/* ---------- кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.7em 1em; font-weight: 550; min-height: 3em; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--ink); }
.btn.sm { min-height: 2.4em; padding: 0.35em 0.8em; font-size: 0.8125rem; border-radius: 8px; }
.btn.big { min-height: 3.4em; font-size: 1rem; }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--on-solid); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.btn.bad-outline { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn[disabled] { opacity: .5; cursor: progress; }

/* ---------- блоки ---------- */
main { padding-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px; } .pb0 { padding-bottom: 6px; } .pt0 { padding-top: 0; }
.banner { border-radius: 10px; padding: 10px 14px; font-size: 0.8438rem; background: var(--info-soft); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.info { background: var(--info-soft); color: var(--text); }
.banner a { color: inherit; font-weight: 650; }
.note-box { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.8438rem; margin-top: 8px; white-space: pre-wrap; }

.summary { display: grid; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.summary.three { grid-template-columns: repeat(3, 1fr); }
.summary.four { grid-template-columns: repeat(4, 1fr); }
.summary > div { background: var(--surface); padding: 12px 16px; min-width: 0; }
.summary .k { font-size: 0.75rem; color: var(--muted); }
.summary .v { font-size: 1.375rem; font-weight: 750; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v.bad { color: var(--bad); } .v.ok { color: var(--ok); } .v.warn { color: var(--warn); }
@media (max-width: 720px) {
  .summary > div { padding: 10px 10px; }
  .summary .v { font-size: 1.125rem; }
  .summary.four { grid-template-columns: repeat(2, 1fr); }
  .summary.three { grid-template-columns: repeat(2, 1fr); }
  .summary.three > div:first-child { grid-column: 1 / -1; }
  .summary.three > div:first-child .v { font-size: 1.5rem; }
}

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar.between { justify-content: space-between; }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.7em 1em; min-height: 3em; font-size: 1rem; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 0.8125rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
label.inline { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
label.inline select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 36px; }

/* ---------- список (рядки зошита з полем перед сумою) ---------- */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--line); cursor: pointer; }
@media (max-width: 480px) { .row .sum { padding: 12px 12px; } .row .amt { font-size: 1rem; } }
.rows > .row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .who { padding: 12px 14px 12px 16px; min-width: 0; }
.row .name { font-weight: 650; overflow-wrap: anywhere; }
.row .meta { font-size: 0.7812rem; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .sum { padding: 12px 16px; text-align: right; align-items: flex-end; display: flex; flex-direction: column; justify-content: center; }
.amt { font-weight: 750; font-size: 1.0625rem; white-space: nowrap; }
.amt.sm { font-size: 0.9375rem; }
.amt.bad { color: var(--bad); } .amt.ok { color: var(--ok); } .amt.zero { color: var(--muted); font-weight: 500; }
.meter { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); }
.meter i.over { background: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7188rem; font-weight: 650; border-radius: 999px; padding: 2px 8px; white-space: nowrap; background: var(--surface-2); color: var(--muted); vertical-align: middle; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ink { background: var(--ink-soft); color: var(--ink); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- картка клієнта ---------- */
.client-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.client-name { overflow-wrap: anywhere; }
.balance-box { text-align: right; display: grid; gap: 3px; min-width: 180px; }
.big { font-size: 2.125rem; font-weight: 800; line-height: 1.1; }
.big.bad { color: var(--bad); } .big.ok { color: var(--ok); } .big.zero { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8438rem; color: var(--muted); margin-top: 6px; }
.facts a { display: inline-flex; align-items: center; gap: 4px; }
.sheet .actions { margin-top: 16px; }
@media (max-width: 560px) { .client-head { grid-template-columns: 1fr; } .balance-box { text-align: left; } .sheet .actions .btn { flex: 1 1 45%; } }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; }
.hist .d { font-size: 0.7812rem; color: var(--muted); }
.hist .t { min-width: 0; overflow-wrap: anywhere; }
.hist .t b { font-weight: 650; }
.hist .by { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.hist .x { text-align: right; }
.hist li.cancel .amt, .hist li.cancel .t > b { text-decoration: line-through; opacity: .55; }
.hist li.failed { background: var(--bad-soft); }
.hist.log li { grid-template-columns: 82px minmax(0, 1fr); }
.hist li.click, tr.click { cursor: pointer; }
.hist li.click:hover, tr.click:hover { background: var(--surface-2); }
@media (max-width: 480px) { .hist li { grid-template-columns: minmax(0, 1fr) auto; } .hist .d { grid-column: 1 / -1; } .hist.log li { grid-template-columns: 1fr; } }

/* ---------- таблиці, звіти ---------- */
.tbl-wrap { overflow-x: auto; margin: 8px -16px -16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; color: var(--muted); font-weight: 650; border-top: 0; }
td.n, th.n { text-align: right; }
.sheet > .tbl-wrap { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.buckets { margin-top: 8px; display: grid; gap: 4px; }
.bucket { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.875rem; }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; }
.t-ok { background: var(--ok); } .t-ink { background: var(--ink); } .t-warn { background: var(--warn); } .t-bad { background: var(--bad); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 0.875rem; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 550; }
@media (max-width: 520px) { dl.kv { grid-template-columns: 1fr; } dl.kv dd { margin-bottom: 6px; } }
ul.plain { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }

/* ---------- вхід / перший запуск ---------- */
.auth { min-height: 88vh; display: grid; place-items: center; padding-block: 28px; }
.auth-card { width: 100%; max-width: 420px; display: grid; gap: 16px; }
.auth-card.wide { max-width: 820px; }
.auth-card > form, .auth-card > .banner { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.auth-brand { display: flex; gap: 14px; align-items: center; }
.auth-brand h1 { color: var(--ink); font-size: 1.625rem; font-weight: 800; }
.legal { font-size: 0.75rem; }
.loading { color: var(--ink); font-size: 1.125rem; font-weight: 600; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.h-start { color: var(--ink); font-size: 1.75rem; }
.code-in { text-transform: uppercase; letter-spacing: .15em; font-family: ui-monospace, Consolas, monospace; font-size: 1.25rem !important; }
.invite-code { font-family: ui-monospace, Consolas, monospace; font-size: 2.375rem; font-weight: 800; letter-spacing: .18em; text-align: center; color: var(--ink); background: var(--ink-soft); border-radius: 12px; padding: 14px; }

/* ---------- вікна ---------- */
.overlay.opaque { background: var(--paper); }
.overlay { position: fixed; inset: 0; background: rgba(10,14,25,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: calc(100% - 12px); overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); margin-bottom: env(safe-area-inset-bottom, 0px); }
.modal.wide { max-width: 720px; }
.modal h2 { font-size: 1.25rem; }
label.f { display: grid; gap: 5px; font-size: 0.8125rem; color: var(--muted); }

    const msg = (data && (data.hint ? data.message : (data.msg || data.error_description || data.message))) || 'Помилка запиту.';
    throw new ApiError(msg, { code: String(code), status: res.status, auth: res.status === 401 });
  }
  return data;
}

// ---------- Auth ----------
const AUTH_ERRORS = {
  invalid_credentials: 'Невірний email або пароль.',
  invalid_grant: 'Невірний email або пароль.',
  email_not_confirmed: 'Email ще не підтверджено. Відкрийте лист від нас і натисніть посилання.',
  user_already_exists: 'Такий email уже зареєстровано. Увійдіть або відновіть пароль.',
  weak_password: 'Пароль закороткий — мінімум 6 символів.',
  validation_failed: 'Перевірте правильність email.',
  over_email_send_rate_limit: 'Забагато листів за короткий час. Спробуйте пізніше.',
  over_request_rate_limit: 'Забагато спроб. Спробуйте за кілька хвилин.',
  same_password: 'Новий пароль має відрізнятися від старого.',
};
function authErr(e) {
  if (e instanceof ApiError && AUTH_ERRORS[e.code]) e.message = AUTH_ERRORS[e.code];
  return e;
}

async function signUp(email, password, name) {
  try {
    const r = await request('/auth/v1/signup', { body: { email: email.trim(), password, data: { name } } });
    if (r && r.access_token) return { session: saveSession(r) };
    return { needsConfirm: true };   // у Supabase увімкнено підтвердження email
  } catch (e) { throw authErr(e); }
}

async function signIn(email, password) {
  try {
    const r = await request('/auth/v1/token?grant_type=password', { body: { email: email.trim(), password } });
    return saveSession(r);
  } catch (e) { throw authErr(e); }
}

async function signOut() {
  const s = getSession();
  clearSession();
  if (s) { try { await request('/auth/v1/logout', { token: s.access_token }); } catch { /* офлайн — не страшно */ } }
}

async function recoverPassword(email) {
  const back = location.origin + location.pathname;
  try { await request('/auth/v1/recover?redirect_to=' + encodeURIComponent(back), { body: { email: email.trim() } }); }
  catch (e) { throw authErr(e); }
}

/** Перехід до входу через Google (повертає на цю саму сторінку) */
function googleSignInUrl() {
  const back = location.origin + location.pathname;
  return `${BASE}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(back)}`;
}

/** Повернення з листа або від Google приходить у вигляді #access_token=...&type=... */
function takeSessionFromUrl() {
  const h = location.hash.replace(/^#/, '');
  if (!h.includes('access_token=')) return false;
  const p = new URLSearchParams(h);
  if (p.get('error_description')) return { error: p.get('error_description') };
  saveSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, user: null });
  history.replaceState(null, '', location.pathname + location.search);
  return { type: p.get('type') || 'magiclink' };
}

async function updatePassword(password) {
  const token = await accessToken();
  try { return await request('/auth/v1/user', { method: 'PUT', body: { password }, token }); }
  catch (e) { throw authErr(e); }
}

async function fetchUser() {
  const token = await accessToken();
  const u = await request('/auth/v1/user', { method: 'GET', token });
  const s = getSession();
  if (s) { s.user = u; lsSet(SESSION_KEY, JSON.stringify(s)); }
  return u;
}

let refreshing = null;
async function doRefresh() {
  const run = async () => {
    const s = getSession();            // читаємо заново: інша вкладка могла вже оновити
    if (!s) throw new ApiError('Потрібно увійти.', { code: 'not_authenticated', auth: true });
    if (s.expires_at - Date.now() / 1000 > 60) return s;
    try {
      const r = await request('/auth/v1/token?grant_type=refresh_token', { body: { refresh_token: s.refresh_token } });
      return saveSession({ ...r, user: r.user || s.user });
    } catch (e) {
      if (e.network) throw e;
      // сервер відмовив в оновленні сесії (400/401) — треба увійти знову; черга записів зберігається
      clearSession(); emitExpired();
      throw new ApiError('Сесія закінчилась — увійдіть знову.', { code: 'not_authenticated', auth: true, status: e.status });
    }
  };
  if (navigator.locks && navigator.locks.request) return navigator.locks.request('zoshyt-auth-refresh', run);
  return run();
}

/** Дійсний токен доступу (оновлює, якщо скоро спливає). Офлайн повертає старий. */
async function accessToken() {
  const s = getSession();
  if (!s) throw new ApiError('Потрібно увійти.', { code: 'not_authenticated', auth: true });
  if (s.expires_at - Date.now() / 1000 > 60) return s.access_token;
  if (!refreshing) refreshing = doRefresh().finally(() => { refreshing = null; });
  try { return (await refreshing).access_token; }
  catch (e) { if (e.network) return s.access_token; throw e; }
}

// ---------- RPC ----------
async function rpc(fn, args = {}) {
  let token = await accessToken();
  try {
    return await request('/rest/v1/rpc/' + fn, { body: args, token });
  } catch (e) {
    if (e.status === 401 && !e.network) {
      // токен прострочено — одна спроба з оновленим
      const s = getSession(); if (s) { s.expires_at = 0; lsSet(SESSION_KEY, JSON.stringify(s)); }
      token = await accessToken();
      return await request('/rest/v1/rpc/' + fn, { body: args, token });
    }
    throw e;
  }
}

// ---------- двофакторний вхід (TOTP, Google Authenticator) ----------
/** Рівень входу поточної сесії: 'aal1' — лише пароль, 'aal2' — пароль + код */
function currentAal() {
  const s = getSession();
  try { return JSON.parse(atob(s.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).aal || 'aal1'; }
  catch { return 'aal1'; }
}
async function mfaFactors() {
  const u = await fetchUser();
  return (u && u.factors) || [];
}
async function mfaEnroll() {
  const token = await accessToken();
  return request('/auth/v1/factors', { body: { factor_type: 'totp', friendly_name: 'Зошит адмін ' + new Date().toISOString().slice(0, 16), issuer: 'Зошит боржників' }, token });
}
async function mfaUnenroll(id) {
  const token = await accessToken();
  return request('/auth/v1/factors/' + id, { method: 'DELETE', token });
}
/** Перевірити код: при успіху сесія стає aal2 */
async function mfaVerify(factorId, code) {
  const token = await accessToken();
  const ch = await request(`/auth/v1/factors/${factorId}/challenge`, { body: {}, token });
  try {
    const r = await request(`/auth/v1/factors/${factorId}/verify`, { body: { challenge_id: ch.id, code: String(code).replace(/\D/g, '') }, token });
    return saveSession({ ...r, user: r.user || (getSession() || {}).user });
  } catch (e) {
    if (e.status === 422 || e.status === 400) e.message = 'Невірний код. Перевірте, що час на телефоні правильний, і введіть новий код.';
    throw e;
  }
}

return { configured, ApiError, getSession, clearSession, onAuthExpired, signUp, signIn, signOut, recoverPassword, googleSignInUrl, takeSessionFromUrl, updatePassword, fetchUser, accessToken, rpc, currentAal, mfaFactors, mfaEnroll, mfaUnenroll, mfaVerify };
})();

  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
}

function confirmBox({ title, text, ok = 'Так', cancel = 'Скасувати', danger = false }) {
  return new Promise(resolve => {
    openModal(`<div class="stack">
      <h2>${esc(title)}</h2>
      ${text ? `<p class="muted">${text}</p>` : ''}
      <div class="m-actions">
        <button type="button" class="btn ghost" data-act="confirm-no">${esc(cancel)}</button>
        <button type="button" class="btn ${danger ? 'bad' : 'ink'}" data-act="confirm-yes">${esc(ok)}</button>
      </div></div>`, { onClose: () => resolve(false) });
    actions['confirm-yes'] = () => { modalClose = null; closeModal(); resolve(true); };
    actions['confirm-no'] = () => { closeModal(); };
  });
}

M.store = (function () {
const api = M.api;
const idb = M.idb;
const { uuid, lsGet, lsSet } = M.util;
const { applyPlatform } = M.cfg;
// Дані застосунку: локальна копія (IndexedDB) + черга відправки + синхронізація з сервером.
// Усі записи спершу зберігаються на пристрої, тому програма працює і без інтернету.




const S = {
  user: null,          // {id, email}
  boot: null,          // {is_admin, shops: [...]} — останні відомі з сервера
  shopId: null,
  shop: null,          // інформація про поточний магазин (роль, підписка, налаштування)
  members: [],
  clients: new Map(),
  ops: new Map(),
  outbox: 0,           // скільки дій чекає відправки
  sync: { state: 'idle', lastOk: +(lsGet('zoshyt.lastSync') || 0), error: null },
  notices: [],         // повідомлення про дії, які сервер не прийняв
  authExpired: false,
  version: 0,
};

// ---------- підписка на зміни ----------
const subs = new Set();
const subscribe = (fn) => { subs.add(fn); return () => subs.delete(fn); };
let scheduled = false;
function changed() {
  S.version++;
  if (scheduled) return;
  scheduled = true;
  queueMicrotask(() => { scheduled = false; subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); });
}

const isOwner = () => S.shop && S.shop.role === 'owner';
const writable = () => !S.shop || S.shop.writable !== false;
const memberName = (id) => { const m = S.members.find(x => x.user_id === id); return m ? m.display_name : (id === S.user?.id ? 'Я' : 'Працівник'); };
const me = () => S.members.find(m => m.user_id === S.user?.id);

// ---------- старт / вихід ----------
/** Чи є на пристрої невідправлені записи ІНШОГО користувача (напр. продавця, в якого закінчилась сесія) */
async function foreignPending(user) {
  const owner = await idb.kv.get('user_id');
  if (!owner || owner === user.id) return null;
  const failed = (await idb.all('ops')).filter(o => o._failed || o._pending).length + (await idb.all('clients')).filter(c => c._failed || c._pending).length;
  const n = Math.max((await idb.all('outbox')).length, failed);
  return n ? { count: n, email: (await idb.kv.get('user_email')) || 'інший користувач' } : null;
}

async function start(user) {
  S.user = { id: user.id, email: user.email };
  const owner = await idb.kv.get('user_id');
  if (owner && owner !== user.id) await idb.clearAll();   // на пристрої були дані іншого користувача
  await idb.kv.set('user_id', user.id);
  await idb.kv.set('user_email', user.email);
  S.boot = (await idb.kv.get('boot')) || null;
  if (S.boot) applyPlatform(S.boot.platform);
  S.notices = (await idb.kv.get('notices')) || [];
  const saved = await idb.kv.get('current_shop');
  const shops = S.boot ? S.boot.shops : [];
  const pick = shops.find(s => s.id === saved) || shops[0];
  if (pick) await loadShop(pick.id);
  await countOutbox();
  idb.persist();
  changed();
}

async function pendingForLogout() { await countOutbox(); return S.outbox; }

async function logout() {
  await api.signOut();
  await idb.clearAll();
  Object.assign(S, { user: null, boot: null, shopId: null, shop: null, members: [], clients: new Map(), ops: new Map(), outbox: 0, notices: [], authExpired: false });
  S.sync = { state: 'idle', lastOk: 0, error: null };
  changed();
}

// ---------- магазини ----------
async function loadShop(id) {
  const [clients, ops, meta] = await Promise.all([idb.byShop('clients', id), idb.byShop('ops', id), idb.kv.get('shop:' + id)]);
  S.shopId = id;
  S.clients = new Map(clients.map(c => [c.id, c]));
  S.ops = new Map(ops.map(o => [o.id, o]));
  const fromBoot = S.boot && S.boot.shops.find(s => s.id === id);
  S.shop = (meta && meta.shop) || fromBoot || null;
  S.members = (meta && meta.members) || [];
  await idb.kv.set('current_shop', id);
  changed();
}

async function selectShop(id) {
  if (id === S.shopId) return;
  await loadShop(id);
  requestSync();
}

async function refreshBoot() {
  const b = await api.rpc('app_bootstrap');
  S.boot = { is_admin: b.is_admin, shops: b.shops, email: b.email, platform: b.platform || {}, at: Date.now() };
  applyPlatform(S.boot.platform);
  await idb.kv.set('boot', S.boot);
  const ids = new Set(b.shops.map(s => s.id));
  // магазини, до яких більше немає доступу, прибираємо з пристрою
  const known = (await idb.kv.get('known_shops')) || [];
  for (const old of known) if (!ids.has(old)) await purgeShop(old);
  await idb.kv.set('known_shops', [...ids]);
  if (S.shopId && !ids.has(S.shopId)) { S.shopId = null; S.shop = null; S.clients = new Map(); S.ops = new Map(); S.members = []; }
  if (!S.shopId && b.shops.length) await loadShop(b.shops[0].id);
  else if (S.shopId) {
    const fresh = b.shops.find(s => s.id === S.shopId);
    if (fresh) S.shop = { ...(S.shop || {}), ...fresh };
  }
  changed();
  return S.boot;
}

async function purgeShop(id) {
  const [clients, ops] = await Promise.all([idb.byShop('clients', id), idb.byShop('ops', id)]);
  for (const c of clients) await idb.del('clients', c.id);
  for (const o of ops) await idb.del('ops', o.id);
  await idb.kv.del('shop:' + id);
  const box = await idb.all('outbox');
  for (const e of box) if (e.shop_id === id) await idb.del('outbox', e.seq);
}

// ---------- локальні записи (працюють і офлайн) ----------
async function enqueue(entry) {
  await idb.put('outbox', { ...entry, user_id: S.user.id, at: Date.now() });
  await countOutbox();
}
async function countOutbox() {
  const box = await idb.all('outbox');
  S.outbox = box.filter(e => e.user_id === S.user?.id).length;
}
function assertWritable() {
  if (!writable()) throw new Error('Підписка магазину закінчилась — нові записи недоступні. Зверніться до продавця програми.');
}

async function addOp({ client_id, type, amount, note, over_limit }) {
  assertWritable();
  const op = {
    id: uuid(), shop_id: S.shopId, client_id, type, amount, note: note || '',
    created_by: S.user.id, client_at: new Date().toISOString(), created_at: null,
    cancelled_at: null, cancelled_by: null, cancel_reason: null,
    over_limit: !!over_limit, _pending: true,
  };
  await idb.put('ops', op);
  S.ops.set(op.id, op);
  await enqueue({ kind: 'op', shop_id: S.shopId, id: op.id });
  changed(); requestSync();
  return op;
}

async function cancelOp(id, reason) {
  assertWritable();
  const op = S.ops.get(id);
  if (!op || op.cancelled_at) return;
  const upd = { ...op, cancelled_at: new Date().toISOString(), cancelled_by: S.user.id, cancel_reason: reason, _pendingCancel: true };
  await idb.put('ops', upd);
  S.ops.set(id, upd);
  await enqueue({ kind: 'cancel', shop_id: S.shopId, id, reason });
  changed(); requestSync();
}

/** Позначити, що клієнту нагадали про борг */
async function markReminded(id) {
  const c = S.clients.get(id);
  if (!c) return;
  const upd = { ...c, last_reminded_at: new Date().toISOString(), last_reminded_by: S.user.id, _pendingRemind: true };
  await idb.put('clients', upd);
  S.clients.set(id, upd);
  await enqueue({ kind: 'remind', shop_id: S.shopId, id });
  changed(); requestSync();
}

async function createClient(data) {
  assertWritable();
  const c = {
    id: uuid(), shop_id: S.shopId, name: data.name, phone: data.phone || '', address: data.address || '', note: data.note || '',
    limit_kop: isOwner() ? data.limit_kop : (S.shop?.default_limit ?? 0), archived: false,
    created_by: S.user.id, created_at: new Date().toISOString(), updated_at: new Date().toISOString(), _pending: true,
  };
  await idb.put('clients', c);
  S.clients.set(c.id, c);
  await enqueue({ kind: 'client_create', shop_id: S.shopId, id: c.id });
  changed(); requestSync();
  return c;
}

async function updateClient(id, data) {
  assertWritable();
  const cur = S.clients.get(id);
  if (!cur) return;
  const snapshot = cur._pendingUpdate ? cur._server : stripLocal(cur);
  const upd = { ...cur, ...data, _pendingUpdate: true, _server: snapshot };
  await idb.put('clients', upd);
  S.clients.set(id, upd);
  await enqueue({ kind: 'client_update', shop_id: S.shopId, id });
  changed(); requestSync();
}

function stripLocal(o) {
  const r = {};
  for (const k in o) if (!k.startsWith('_')) r[k] = o[k];
  return r;
}

// невдалі записи: повторити або прибрати з пристрою
async function retryFailed(kind, id) {
  if (kind === 'op') {
    const op = S.ops.get(id); if (!op) return;
    const upd = { ...op, _failed: undefined, _pending: true };
    delete upd._failed;
    await idb.put('ops', upd); S.ops.set(id, upd);
    await enqueue({ kind: 'op', shop_id: op.shop_id, id });
  } else {
    const c = S.clients.get(id); if (!c) return;
    const upd = { ...c, _pending: true }; delete upd._failed;
    await idb.put('clients', upd); S.clients.set(id, upd);
    await enqueue({ kind: 'client_create', shop_id: c.shop_id, id });
  }
  changed(); requestSync();
}
async function discardFailed(kind, id) {
  if (kind === 'op') { await idb.del('ops', id); S.ops.delete(id); }
  else {
    const c = S.clients.get(id);
    const removed = new Set([id]);
    await idb.del('clients', id); S.clients.delete(id);
    for (const o of [...S.ops.values()]) if (o.client_id === id && (o._pending || o._failed)) { removed.add(o.id); await idb.del('ops', o.id); S.ops.delete(o.id); }
    const box = await idb.all('outbox');
    for (const e of box) if ((!c || e.shop_id === c.shop_id) && removed.has(e.id)) await idb.del('outbox', e.seq);
    await countOutbox();
  }
  changed();
}

async function notice(text) {
  S.notices = [{ id: uuid(), at: Date.now(), text }, ...S.notices].slice(0, 50);
  await idb.kv.set('notices', S.notices);
}
async function clearNotices() { S.notices = []; await idb.kv.set('notices', []); changed(); }

// ---------- синхронізація ----------
// Лише ці відповіді сервера означають "запис остаточно не прийнято". Усе інше (немає зв'язку,
// сесія закінчилась, збій сервера, невідома помилка) — запис лишається в черзі й відправиться пізніше.
const BUSINESS = new Set(['invalid', 'not_found', 'forbidden', 'too_late', 'archived', 'limit_exceeded', 'disabled', 'not_member', 'owner_only', 'too_many', 'conflict']);
const PER_SHOP_STOP = new Set(['subscription_expired']);
const isTransient = (e) => !(e.status === 400 && BUSINESS.has(e.code));

/** Відправити чергу. Повертає магазини, де підписка закінчилась (їхні записи чекають). */
async function push() {
  const box = (await idb.all('outbox')).filter(e => e.user_id === S.user.id).sort((a, b) => a.seq - b.seq);
  const stopped = new Set();
  let i = 0;
  while (i < box.length) {
    const e = box[i];
    if (stopped.has(e.shop_id)) { i++; continue; }
    try {
      if (e.kind === 'op') {
        const batch = [];
        while (i < box.length && box[i].kind === 'op' && box[i].shop_id === e.shop_id && batch.length < 100) batch.push(box[i++]);
        await pushOps(e.shop_id, batch);
        continue;
      }
      i++;
      try {
        if (e.kind === 'remind') await pushRemind(e);
      else if (e.kind === 'cancel') await pushCancel(e);
        else if (e.kind === 'client_create') await pushClientCreate(e);
        else if (e.kind === 'client_update') await pushClientUpdate(e);
        await idb.del('outbox', e.seq);
      } catch (err) {
        if (isTransient(err)) throw err;
        await idb.del('outbox', e.seq);
        await failEntry(e, err);
      }
    } catch (err) {
      if (PER_SHOP_STOP.has(err.code)) { stopped.add(e.shop_id); continue; }   // інші магазини синхронізуємо далі
      throw err;
    }
  }
  return stopped;
}

async function getOp(id) { return S.ops.get(id) || await idb.get('ops', id); }
async function saveOp(op) { await idb.put('ops', op); if (op.shop_id === S.shopId) S.ops.set(op.id, op); }
async function getClient(id) { return S.clients.get(id) || await idb.get('clients', id); }
async function saveClient(c) { await idb.put('clients', c); if (c.shop_id === S.shopId) S.clients.set(c.id, c); }

async function pushOps(shopId, entries) {
  const payload = [], map = new Map();
  for (const e of entries) {
    const op = await getOp(e.id);
    if (!op || !op._pending) { await idb.del('outbox', e.seq); continue; }
    map.set(op.id, e);
    payload.push({ id: op.id, client_id: op.client_id, type: op.type, amount: op.amount, note: op.note, client_at: op.client_at, over_limit: !!op.over_limit });
  }
  if (!payload.length) return;
  let res;
  try { res = await api.rpc('add_ops', { p_shop: shopId, p_ops: payload }); }
  catch (err) {
    if (isTransient(err)) throw err;
    res = payload.map(p => ({ id: p.id, ok: false, code: err.code, message: err.message }));
  }
  for (const r of res) {
    const e = map.get(r.id); if (!e) continue;
    const op = await getOp(r.id);
    if (op) {
      const upd = { ...op };
      delete upd._pending;
      if (!r.ok) {
        upd._failed = { code: r.code, message: r.message };
        const c = await getClient(op.client_id);
        await notice(`Не збережено ${op.type === 'debt' ? 'борг' : 'оплату'} ${(op.amount / 100).toLocaleString('uk-UA')} грн${c ? ' (' + c.name + ')' : ''}: ${r.message}`);
      }
      await saveOp(upd);
    }
    await idb.del('outbox', e.seq);
  }
}

async function pushRemind(e) {
  const c = await getClient(e.id);
  if (!c || !c._pendingRemind) return;
  await api.rpc('mark_reminded', { p_shop: e.shop_id, p_client: e.id });
  const upd = { ...c }; delete upd._pendingRemind; await saveClient(upd);
}

async function pushCancel(e) {
  try { await api.rpc('cancel_op', { p_shop: e.shop_id, p_id: e.id, p_reason: e.reason }); }
  catch (err) { err.entry = e; throw err; }
  const op = await getOp(e.id);
  if (op) { const upd = { ...op }; delete upd._pendingCancel; await saveOp(upd); }
}

async function pushClientCreate(e) {
  const c = await getClient(e.id);
  if (!c || !c._pending) return;
  await api.rpc('create_client', { p_shop: e.shop_id, p_id: c.id, p_name: c.name, p_phone: c.phone, p_address: c.address, p_note: c.note, p_limit: c.limit_kop, p_client_at: c.created_at });
  const upd = { ...c }; delete upd._pending; await saveClient(upd);
}

async function pushClientUpdate(e) {
  const c = await getClient(e.id);
  if (!c || !c._pendingUpdate) return;
  await api.rpc('update_client', { p_shop: e.shop_id, p_id: c.id, p_name: c.name, p_phone: c.phone, p_address: c.address, p_note: c.note, p_limit: c.limit_kop, p_archived: !!c.archived, p_expected: (c._server && c._server.updated_at) || null });
  const upd = { ...c }; delete upd._pendingUpdate; delete upd._server; await saveClient(upd);
}

async function failEntry(e, err) {
  if (e.kind === 'cancel') {
    const op = await getOp(e.id);
    if (op) { const upd = { ...op, cancelled_at: null, cancelled_by: null, cancel_reason: null }; delete upd._pendingCancel; await saveOp(upd); }
    await notice(`Не вдалося скасувати запис: ${err.message}`);
  } else if (e.kind === 'client_create') {
    const c = await getClient(e.id);
    if (c) { const upd = { ...c, _failed: { code: err.code, message: err.message } }; delete upd._pending; await saveClient(upd); }
    await notice(`Не збережено нового клієнта${c ? ' ' + c.name : ''}: ${err.message}`);
  } else if (e.kind === 'remind') {
    const c = await getClient(e.id);
    if (c) { const upd = { ...c }; delete upd._pendingRemind; await saveClient(upd); }
  } else if (e.kind === 'client_update') {
    const c = await getClient(e.id);
    if (c && c._server) await saveClient(c._server);
    await notice(`Не збережено зміни клієнта${c ? ' ' + c.name : ''}: ${err.message}`);
  }
}

async function pull(shopId) {
  let meta = (await idb.kv.get('shop:' + shopId)) || {};
  let cursor = meta.cursor || null;
  for (let round = 0; round < 100; round++) {
    const r = await api.rpc('sync_pull', { p_shop: shopId, p_cursor: cursor });
    await applyPull(shopId, r);
    cursor = r.cursor;
    if (!r.more) break;
  }
}

async function applyPull(shopId, r) {
  const current = shopId === S.shopId;
  const clients = [], ops = [];
  for (const sc of r.clients) {
    const local = current ? S.clients.get(sc.id) : await idb.get('clients', sc.id);
    let merged = local && local._pendingUpdate ? { ...local, _server: sc } : sc;
    if (local && local._pendingRemind && !sc.last_reminded_at) merged = { ...merged, last_reminded_at: local.last_reminded_at, last_reminded_by: local.last_reminded_by, _pendingRemind: true };
    clients.push(merged);
    if (current) S.clients.set(sc.id, merged);
  }
  for (const so of r.ops) {
    const local = current ? S.ops.get(so.id) : await idb.get('ops', so.id);
    const merged = local && local._pendingCancel && !so.cancelled_at ? local : so;
    ops.push(merged);
    if (current) S.ops.set(so.id, merged);
  }
  await idb.putMany('clients', clients);
  await idb.putMany('ops', ops);
  await idb.kv.set('shop:' + shopId, { shop: r.shop, members: r.members, cursor: r.cursor, at: Date.now() });
  if (current) { S.shop = r.shop; S.members = r.members; }
  changed();
}

let running = null, again = false, lastBoot = 0;
let timer = null;
function requestSync(delay = 300) {
  clearTimeout(timer);
  timer = setTimeout(() => { runSync(); }, delay);
}

async function runSync({ forceBoot = false } = {}) {
  if (!S.user) return;
  if (running) { again = true; return running; }
  running = (async () => {
    if (!navigator.onLine) { S.sync.state = 'offline'; changed(); return; }
    S.sync.state = 'syncing'; changed();
    try {
      const stopped = await push();
      if (forceBoot || stopped.size || !S.boot || Date.now() - lastBoot > 60000) { await refreshBoot(); lastBoot = Date.now(); }
      if (S.shopId) await pull(S.shopId);
      S.sync = { state: 'ok', lastOk: Date.now(), error: null };
      lsSet('zoshyt.lastSync', String(S.sync.lastOk));
      if (stopped.size) {
        const names = [...stopped].map(id => (S.boot?.shops.find(s => s.id === id) || {}).name || 'магазин').join(', ');
        S.sync = { state: 'error', lastOk: Date.now(), error: `Підписка закінчилась (${names}) — записи чекають і відправляться після продовження.` };
      }
    } catch (e) {
      if (e.code === 'not_member') { await refreshBoot().catch(() => {}); S.sync = { state: 'ok', lastOk: Date.now(), error: null }; }
      else if (e.network || e.status >= 500) S.sync = { ...S.sync, state: 'offline', error: null };
      else if (e.auth || e.code === 'not_authenticated') { S.sync = { ...S.sync, state: 'error', error: 'Потрібно увійти знову.' }; S.authExpired = true; }
      else S.sync = { ...S.sync, state: 'error', error: e.message };
    } finally {
      await countOutbox();
      changed();
    }
  })();
  try { await running; } finally {
    running = null;
    if (again) { again = false; requestSync(50); }
  }
}

api.onAuthExpired(() => { S.authExpired = true; changed(); });

/** Онлайн-дія (налаштування, працівники тощо): виконати й одразу підтягнути зміни */
async function online(fn, args) {
  if (!navigator.onLine) throw new Error('Для цієї дії потрібен інтернет.');
  const r = await api.rpc(fn, args);
  requestSync(50);
  return r;
}

return { S, subscribe, changed, isOwner, writable, memberName, me, foreignPending, start, pendingForLogout, logout, loadShop, selectShop, refreshBoot, addOp, cancelOp, markReminded, createClient, updateClient, retryFailed, discardFailed, clearNotices, requestSync, runSync, online };
})();

M.calc = (function () {
const { DAY, ts, startOfDay } = M.util;
const { S } = M.store;
// Розрахунки: баланси клієнтів, прострочення, звіти


const counts = (o) => !o.cancelled_at && !o._failed;
let cache = { v: -1, st: null };

/** Баланс і "давність" для кожного клієнта поточного магазину */
function stats() {
  if (cache.v === S.version) return cache.st;
  const per = new Map();
  for (const c of S.clients.values()) per.set(c.id, { bal: 0, lastPay: 0, firstDebt: 0, lastAt: 0, days: 0, pending: 0 });
  const ops = [...S.ops.values()].sort((a, b) => ts(a.client_at) - ts(b.client_at));
  for (const o of ops) {
    const p = per.get(o.client_id); if (!p) continue;
    if (o._pending || o._pendingCancel) p.pending++;
    if (!counts(o)) continue;
    const t = ts(o.client_at);
    if (o.type === 'debt') { if (p.bal <= 0) p.firstDebt = t; p.bal += o.amount; }
    else { p.bal -= o.amount; p.lastPay = t; }
    p.lastAt = t;
  }
  const now = Date.now();
  for (const p of per.values()) p.days = p.bal > 0 ? Math.max(0, Math.floor((now - Math.max(p.lastPay, p.firstDebt)) / DAY)) : 0;
  cache = { v: S.version, st: per };
  return per;
}

function balanceOf(clientId) { const p = stats().get(clientId); return p ? p.bal : 0; }

function summary() {
  const st = stats();
  let total = 0, debtors = 0, overdue = 0, overdueSum = 0;
  for (const c of S.clients.values()) {
    const p = st.get(c.id);
    if (p.bal > 0) { total += p.bal; debtors++; if (p.days >= 30) { overdue++; overdueSum += p.bal; } }
  }
  return { total, debtors, overdue, overdueSum };
}

function periodStart(period) {
  const now = Date.now();
  if (period === 'today') return startOfDay(now);
  if (period === 'week') return startOfDay(now - 6 * DAY);
  return startOfDay(now - 29 * DAY);
}

function report(period) {
  const st = stats();
  const from = periodStart(period);
  const all = [...S.ops.values()];
  const inP = all.filter(o => counts(o) && ts(o.client_at) >= from);
  const given = inP.filter(o => o.type === 'debt').reduce((s, o) => s + o.amount, 0);
  const taken = inP.filter(o => o.type === 'pay').reduce((s, o) => s + o.amount, 0);
  const cancelled = all.filter(o => o.cancelled_at && ts(o.cancelled_at) >= from).length;
  const debtors = [...S.clients.values()].filter(c => st.get(c.id).bal > 0);
  const buckets = [
    { label: 'до 7 днів', a: 0, b: 7, tone: 'ok' },
    { label: '8–30 днів', a: 8, b: 30, tone: 'ink' },
    { label: '31–60 днів', a: 31, b: 60, tone: 'warn' },
    { label: 'понад 60 днів', a: 61, b: Infinity, tone: 'bad' },
  ].map(b => {
    const cs = debtors.filter(c => st.get(c.id).days >= b.a && st.get(c.id).days <= b.b);
    return { ...b, n: cs.length, sum: cs.reduce((s, c) => s + st.get(c.id).bal, 0) };
  });
  const byStaff = new Map();
  for (const o of inP) {
    const r = byStaff.get(o.created_by) || { id: o.created_by, debt: 0, pay: 0, n: 0 };
    r[o.type] += o.amount; r.n++;
    byStaff.set(o.created_by, r);
  }
  const top = [...debtors].sort((a, b) => st.get(b.id).bal - st.get(a.id).bal).slice(0, 10);
  const longest = debtors.filter(c => st.get(c.id).days > 7).sort((a, b) => st.get(b.id).days - st.get(a.id).days || st.get(b.id).bal - st.get(a.id).bal).slice(0, 10);
  const newDebtors = new Set(inP.filter(o => o.type === 'debt').map(o => o.client_id)).size;
  const payers = new Set(inP.filter(o => o.type === 'pay').map(o => o.client_id)).size;
  const daily = [];
  for (let i = 0; i < 7; i++) {
    const d0 = startOfDay(Date.now() - i * DAY), d1 = d0 + DAY;
    const os = all.filter(o => counts(o) && ts(o.client_at) >= d0 && ts(o.client_at) < d1);
    daily.push({ d: d0, debt: os.filter(o => o.type === 'debt').reduce((s, o) => s + o.amount, 0), pay: os.filter(o => o.type === 'pay').reduce((s, o) => s + o.amount, 0) });
  }
  const sm = summary();
  return { ...sm, given, taken, cancelled, buckets, byStaff: [...byStaff.values()], top, longest, newDebtors, payers, daily };
}

return { stats, balanceOf, summary, periodStart, report };
})();

M.views_auth = (function () {
const api = M.api;
const { esc } = M.util;
const { register, formError, busy, toast, openModal, closeModal, icon } = M.ui;
const { S, changed, runSync } = M.store;
// Вхід, реєстрація, відновлення пароля




const CFG = window.ZOSHYT_CONFIG || {};
let onSignedIn = () => {};
const setOnSignedIn = (fn) => { onSignedIn = fn; };

const val = (id) => document.getElementById(id).value;

register({
  google: () => { location.href = api.googleSignInUrl(); },
}, {
  async login(form) {
    const email = val('l-email'), pass = val('l-pass');
    if (!email || !pass) return formError(form, 'Введіть email і пароль.');
    await busy(form, async () => {
      try { const s = await api.signIn(email, pass); formError(form, ''); await onSignedIn(s.user); }
      catch (e) { formError(form, e.message); }
    });
  },
  async signup(form) {
    const name = val('s-name').trim(), email = val('s-email').trim(), pass = val('s-pass');
    if (!name) return formError(form, 'Вкажіть ваше ім’я.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return formError(form, 'Перевірте email.');
    if (pass.length < 6) return formError(form, 'Пароль закороткий — мінімум 6 символів.');
    await busy(form, async () => {
      try {
        const r = await api.signUp(email, pass, name);
        if (r.needsConfirm) {
          form.innerHTML = `<h2>Перевірте пошту</h2><p>Ми надіслали лист на <b>${esc(email)}</b>. Натисніть посилання в листі, а потім <a href="#/login">увійдіть</a>.</p><p class="small muted">Листа немає? Перевірте папку «Спам».</p>`;
          return;
        }
        sessionStorage.setItem('zoshyt.name', name);
        await onSignedIn(r.session.user);
      } catch (e) { formError(form, e.message); }
    });
  },
  async forgot(form) {
    const email = val('f-email').trim();
    if (!email) return formError(form, 'Введіть email.');
    await busy(form, async () => {
      try {
        await api.recoverPassword(email);
        form.innerHTML = `<h2>Лист надіслано</h2><p>Якщо акаунт з email <b>${esc(email)}</b> існує, ви отримаєте посилання для нового пароля. Відкрийте його на цьому пристрої.</p><a class="btn" href="#/login">До входу</a>`;
      } catch (e) { formError(form, e.message); }
    });
  },
  async reset(form) {
    const p1 = val('r-pass'), p2 = val('r-pass2');
    if (p1.length < 6) return formError(form, 'Мінімум 6 символів.');
    if (p1 !== p2) return formError(form, 'Паролі не збігаються.');
    await busy(form, async () => {
      try {
        await api.updatePassword(p1);
        const u = await api.fetchUser();
        toast('Пароль змінено');
        sessionStorage.removeItem('zoshyt.recovery');
        await onSignedIn(u);
      } catch (e) { formError(form, e.message); }
    });
  },
  async relogin(form) {
    const pass = val('rl-pass');
    await busy(form, async () => {
      try {
        const s = await api.signIn(S.user.email, pass);
        if (s.user.id !== S.user.id) throw new Error('Це інший акаунт.');
        S.authExpired = false; closeModal(); changed(); runSync({ forceBoot: true });
      } catch (e) { formError(form, e.message); }
    });
  },
});


return { setOnSignedIn, loginView, signupView, forgotView, resetView, setupView, reloginModal, CFG };
})();

M.views_shop = (function () {

const { register, openModal, closeModal, toast, formError, busy, icon } = M.ui;

// Список боржників, картка клієнта, запис боргу/оплати, скасування, нагадування





const DEFAULT_NOTES = ['Продукти', 'Хліб, молоко', 'Цигарки', 'Алкоголь', 'Побутове', 'Інше'];
const quickNotes = () => { const q = (S.shop?.quick_notes || '').split('\n').map(x => x.trim()).filter(Boolean); return q.length ? q : DEFAULT_NOTES; };
const confirmOver = () => S.shop?.confirm_amount ?? 500000;   // «Точно така сума?» — понад 5 000 грн за замовчуванням

const listState = { q: '', filter: 'debtors', sort: 'debt', byPhone: false };
const pick = { type: 'debt', q: '', byPhone: false };

// ---------------- список ----------------
function listView() {
  const st = stats();
  const sm = summary();
  const q = listState.q.trim();
  let list = [...S.clients.values()].filter(c => listState.filter === 'archived' ? c.archived : (!c.archived || q));
  if (q) list = list.filter(c => matchClient(c, q));
  else if (listState.filter === 'debtors') list = list.filter(c => st.get(c.id).bal > 0 || c._failed);
  else if (listState.filter === 'overdue') list = list.filter(c => st.get(c.id).bal > 0 && st.get(c.id).days >= 30);
  const sorters = {
    name: (a, b) => a.name.localeCompare(b.name, 'uk'),
    days: (a, b) => st.get(b.id).days - st.get(a.id).days || st.get(b.id).bal - st.get(a.id).bal,
    debt: (a, b) => st.get(b.id).bal - st.get(a.id).bal || a.name.localeCompare(b.name, 'uk'),
  };
  list.sort(sorters[listState.sort]);
  const shown = list.slice(0, 300);
  const total = S.clients.size;

  return `
  <section class="summary three" aria-label="Підсумок">
    <div><div class="k">Загалом винні</div><div class="v bad">${money(sm.total)}</div></div>
    <div><div class="k">Боржників</div><div class="v">${sm.debtors}</div></div>

    <button class="btn bad" data-act="pick" data-type="debt">+ Новий борг</button>

  </div>` : ''}

    ${searchBox('q', listState.q, listState.byPhone, 'list-phone')}
    ${writable() ? '<button class="btn" data-act="new-client">+ Клієнт</button>' : ''}
  </div>
  ${q ? '' : `<div class="toolbar">
    <div class="seg" role="group" aria-label="Фільтр">${[['debtors', 'Винні'], ['overdue', 'Прострочені'], ['all', 'Усі'], ['archived', 'Архів']].map(([k, l]) => `<button data-act="list-filter" data-v="${k}" aria-pressed="${listState.filter === k}">${l}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Сортування">${[['debt', 'Більший борг'], ['days', 'Довше не платять'], ['name', 'За ім’ям']].map(([k, l]) => `<button data-act="list-sort" data-v="${k}" aria-pressed="${listState.sort === k}">${l}</button>`).join('')}</div>
  </div>`}
  <section class="sheet">
    ${shown.length ? `<ul class="rows">${shown.map(c => clientRow(c, st.get(c.id))).join('')}</ul>${list.length > shown.length ? `<div class="empty small">Показано 300 з ${list.length}. Уточніть пошук.</div>` : ''}`
      : `<div class="empty">${q ? `Нікого не знайдено.${writable() ? `<br><button class="btn sm" data-act="new-client" style="margin-top:10px">Додати «${esc(listState.q)}»</button>` : ''}`
        : total === 0 ? `Клієнтів ще немає.${writable() ? '<br><button class="btn ink" data-act="new-client" style="margin-top:10px">+ Додати першого клієнта</button>' : ''}`
        : listState.filter === 'archived' ? 'В архіві нікого немає. Сюди потрапляють клієнти, яких ви сховали — з усією історією.' : listState.filter === 'all' ? 'Клієнтів немає.' : 'Ніхто не винен. Гарний день!'}</div>`}
  </section>`;
}

function clientRow(c, p) {
  const lim = c.limit_kop || 0;
  const pct = lim ? Math.min(100, Math.round(p.bal / lim * 100)) : 0;
  return `<li class="row" data-act="open-client" data-id="${esc(c.id)}" tabindex="0">
    <div class="who"><div class="name">${esc(c.name)}${c.archived ? ' <span class="chip">архів</span>' : ''}</div>
      <div class="meta">${c.phone ? `<span>${esc(fmtPhone(c.phone))}</span>` : ''}${c.address ? `<span>${esc(c.address)}</span>` : ''}
      ${p.bal > 0 && p.days > 7 ? `<span class="age ${ageTone(p.days)}">${sinceText(p.days)}</span>` : ''}
      ${lim && p.bal > lim ? '<span class="chip bad">понад ліміт</span>' : ''}
      ${p.pending ? `<span class="chip ink" title="Чекає відправки на сервер">${icon.cloud} не відправлено</span>` : ''}
      ${c._failed ? '<span class="chip bad">не збережено</span>' : ''}</div></div>
    <div class="sum">${balHtml(p.bal)}${p.bal > 0 && lim ? `<div class="meter" title="${pct}% ліміту"><i class="${p.bal > lim ? 'over' : ''}" style="width:${pct}%"></i></div>` : ''}</div>
  </li>`;
}
function balHtml(b) {
  return b > 0 ? `<span class="amt bad">${money(b)}</span>`
    : b < 0 ? `<span class="amt ok">+${money(-b)}</span><span class="small muted">переплата</span>`
    : '<span class="amt zero">0 грн</span>';
}

      <div class="m-actions start"><button class="btn sm" data-act="retry-client" data-id="${esc(c.id)}">Спробувати ще раз</button><button class="btn sm ghost" data-act="discard-client" data-id="${esc(c.id)}">Прибрати з пристрою</button></div></div>` : ''}
  <section class="sheet pad">
    <div class="client-head">
      <div>
        <h1 class="client-name">${esc(c.name)} ${c.archived ? '<span class="chip">в архіві</span>' : ''}</h1>

      <div class="balance-box">

        ${p.bal > 0 ? `<div><span class="age ${ageTone(p.days)}">${p.days > 1 ? sinceText(p.days) : 'борг ' + sinceText(p.days)}</span></div>` : ''}

function canCancel(o) {
  if (o.cancelled_at || o._failed || !writable()) return false;
  if (isOwner()) return true;
  if (o.created_by !== S.user.id) return false;
  if (o._pending) return true;
  const mins = S.shop?.cancel_minutes ?? 15;
  return Date.now() - new Date(o.created_at || o.client_at).getTime() < mins * 60000;
}

function opRow(o) {
  const debt = o.type === 'debt';
  const cls = o.cancelled_at ? 'cancel' : o._failed ? 'failed' : '';
  return `<li class="${cls}">
    <div class="d">${fmtDT(o.client_at)}</div>
    <div class="t"><b>${debt ? 'Взяв у борг' : 'Оплатив'}</b>${o.note ? ' · ' + esc(o.note) : ''}

        ${o._failed ? ` · <span class="txt-bad">не збережено: ${esc(o._failed.message)}</span>` : ''}

    <div class="x"><span class="amt ${debt ? 'bad' : 'ok'}">${debt ? '+' : '−'}${money(o.amount)}</span>

}

      : (p.bal > 0 ? `<div class="quick"><button type="button" data-act="fill-amount" data-v="${p.bal}">Весь борг: ${money(p.bal)}</button>${p.bal >= 200 ? `<button type="button" data-act="fill-amount" data-v="${Math.round(p.bal / 2)}">Половина</button>` : ''}${[10000, 20000, 50000].filter(v => v < p.bal).map(v => `<button type="button" data-act="fill-amount" data-v="${v}">${money(v)}</button>`).join('')}</div>` : '')}
    <label class="f">${debt ? 'Що взяв' : 'Коментар'}<input id="op-note" autocomplete="off" maxlength="200" placeholder="необов’язково"></label>
    ${debt && c.limit_kop ? `<div class="small muted">Ліміт ${money(c.limit_kop)} · можна ще ${money(Math.max(0, c.limit_kop - p.bal))}</div>` : ''}
    <div id="op-extra"></div>
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ${debt ? 'bad' : 'ok'}" type="submit">${debt ? 'Записати борг' : 'Прийняти'}</button></div>
  </form>`);
}

function clientModal(c, { then = '', q: seed = null } = {}) {
  const edit = !!c;
  const q = (seed ?? listState.q).trim();
  const phoneLike = /^\+?[\d\s()-]{3,}$/.test(q);
  c = c || { name: phoneLike ? '' : q, phone: phoneLike ? q : '', address: '', note: '', limit_kop: S.shop?.default_limit ?? 200000 };
  let ph = localPhone(c.phone);
  if (!ph && !edit) { ph = digits(c.phone); if (ph.startsWith('380')) ph = ph.slice(2); if (ph && ph[0] !== '0') ph = '0' + ph; ph = ph.slice(0, 10); }
  const odd = edit && c.phone && !localPhone(c.phone);   // старий запис у незвичному форматі
  openModal(`<form data-form="client" data-id="${edit ? esc(c.id) : ''}" data-then="${esc(then)}" class="stack" novalidate>
    <h2>${edit ? 'Редагувати клієнта' : 'Новий клієнт'}</h2>
    <label class="f">Ім’я та прізвище *<input id="c-name" required value="${esc(c.name)}" autofocus autocomplete="off" maxlength="100"></label>
    <label class="f">Телефон <span class="muted small">(необов’язково)</span>
      <span class="phone-in"><span class="pfx" aria-hidden="true">+38</span><input id="c-phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="0XX XXX XX XX" value="${esc(phoneMask(ph))}" aria-label="Номер телефону після +38"></span></label>
    ${odd ? `<div class="small muted">Було записано: ${esc(c.phone)}</div>` : ''}
    <label class="f">Адреса <span class="muted small">(необов’язково)</span><input id="c-address" value="${esc(c.address)}" placeholder="вулиця, будинок або орієнтир (напр. біля школи)" autocomplete="off" maxlength="150"></label>
    ${isOwner() ? `<label class="f">Ліміт боргу, грн (0 — без ліміту)<input id="c-limit" inputmode="decimal" value="${moneyInput(c.limit_kop || 0)}"></label>` : `<div class="small muted">Ліміт боргу: ${money(c.limit_kop || 0)} (змінює власник)</div>`}
    <label class="f">Примітка<textarea id="c-note" rows="2" maxlength="300" placeholder="Напр.: платить з пенсії 5-го числа">${esc(c.note)}</textarea></label>
    ${edit ? `<label class="check"><input type="checkbox" id="c-archived" ${c.archived ? 'checked' : ''}> Сховати в архів (історія зберігається, нові борги не записуються)</label>` : ''}
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ink" type="submit">${edit ? 'Зберегти' : 'Додати клієнта'}</button></div>
  </form>`);
}

function cancelModal(o) {
  openModal(`<form data-form="cancel" data-id="${esc(o.id)}" class="stack" novalidate>
    <h2>Скасувати запис?</h2>
    <div class="note-box">${o.type === 'debt' ? 'Борг' : 'Оплата'} ${money(o.amount)} від ${fmtDT(o.client_at)}${o.note ? ' · ' + esc(o.note) : ''}</div>
    <p class="small muted">Запис не зникне: він лишиться закресленим в історії та журналі з вашим ім’ям і причиною.</p>
    <label class="f">Причина *<input id="cancel-reason" required autofocus maxlength="200" placeholder="Помилилась у сумі" autocomplete="off"></label>
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Назад</button><button class="btn bad" type="submit">Скасувати запис</button></div>
  </form>`);
}

const DEFAULT_REMIND = 'Добрий день, {ім’я}! Нагадуємо про борг у магазині «{магазин}»: {сума}. Дякуємо!';

/** Підставляє ім’я, назву магазину й суму в шаблон нагадування */
function fillTemplate(tpl, client, bal) {
  const first = (client.name || '').trim().split(/\s+/)[0];
  return String(tpl || DEFAULT_REMIND)
    .replace(/\{(ім['’]?я|имя|name)\}/gi, first)
    .replace(/\{(магазин|shop)\}/gi, S.shop?.name || '')
    .replace(/\{(сума|борг|sum)\}/gi, money(bal));
}

function remindModal() {
  const c = S.clients.get(view.clientId); if (!c) return;
  const bal = stats().get(c.id).bal;
  const text = fillTemplate(S.shop?.remind_template, c, bal);
  const phone = cleanPhone(c.phone);
  const intl = phone.startsWith('+') ? phone : phone.startsWith('0') ? '+38' + phone : phone;
  openModal(`<div class="stack">
    <h2>Нагадування</h2>
    <label class="f">Текст повідомлення<textarea id="r-text" rows="4">${esc(text)}</textarea></label>
    <div class="m-actions start">
      <button class="btn ink" data-act="copy-remind">Копіювати</button>
      ${phone ? `<a class="btn" href="sms:${esc(intl)}?body=${encodeURIComponent(text)}">SMS</a>
        <a class="btn" href="viber://chat?number=${encodeURIComponent(intl)}">Viber</a>
        <a class="btn" href="https://t.me/${esc(intl)}" target="_blank" rel="noopener">Telegram</a>` : '<span class="small muted">Додайте телефон клієнта, щоб надіслати SMS чи Viber.</span>'}
    </div>
    <p class="small muted">У Viber і Telegram спершу скопіюйте текст, потім вставте в чат. ${isOwner() ? 'Текст можна змінити в Налаштуваннях.' : ''}</p>
    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button><button class="btn ok" data-act="remind-done" data-id="${esc(c.id)}">Нагадав(ла) — позначити</button></div>
  </div>`);
}

/** Поле пошуку з перемикачем «за номером» — тоді відкривається цифрова клавіатура */
function searchBox(id, value, byPhone, act) {
  return `<span class="search-box">
    <input id="${id}" class="search" type="search" value="${esc(value)}" autocomplete="off"
      ${byPhone ? 'inputmode="tel" placeholder="Номер телефону"' : 'inputmode="search" placeholder="Ім’я або номер"'} aria-label="Пошук клієнта">
    <button type="button" class="icon-btn phone-toggle" data-act="${act}" aria-pressed="${byPhone}" aria-label="${byPhone ? 'Шукати за ім’ям (літери)' : 'Шукати за номером (цифрова клавіатура)'}" title="${byPhone ? 'Шукати за ім’ям' : 'Шукати за номером'}">${byPhone ? 'АБВ' : '123'}</button>
  </span>`;
}

function pickList() {
  const st = stats();
  const q = pick.q.trim();
  let cs = [...S.clients.values()].filter(c => !c.archived || pick.type === 'pay');
  if (q) cs = cs.filter(c => matchClient(c, q));
  else if (pick.type === 'pay') cs = cs.filter(c => st.get(c.id).bal > 0);
  // без пошуку — спершу ті, з ким працювали нещодавно
  cs.sort(q ? (a, b) => a.name.localeCompare(b.name, 'uk') : (a, b) => (st.get(b.id).lastAt || 0) - (st.get(a.id).lastAt || 0));
  const rows = cs.slice(0, 30).map(c => { const b = st.get(c.id).bal; return `<li class="row" data-act="pick-client" data-id="${esc(c.id)}" tabindex="0">
      <div class="who"><div class="name">${esc(c.name)}</div><div class="meta">${c.phone ? `<span>${esc(fmtPhone(c.phone))}</span>` : ''}${c.address ? `<span>${esc(c.address)}</span>` : ''}</div></div>
      <div class="sum">${b > 0 ? `<span class="amt bad">${money(b)}</span>` : '<span class="small muted">не винен</span>'}</div></li>`; }).join('');
  const add = pick.type === 'debt' && writable()
    ? `<button type="button" class="btn wide-btn" data-act="pick-new">+ Новий клієнт${q && !/^\+?[\d\s()-]+$/.test(q) ? ` «${esc(q)}»` : q ? ` з номером ${esc(q)}` : ''}</button>` : '';
  return `${!q && cs.length ? `<h3>${pick.type === 'pay' ? 'Хто винен' : 'Нещодавні'}</h3>` : ''}
    ${rows ? `<ul class="rows pick-rows">${rows}</ul>` : `<div class="empty small">${q ? 'Нікого не знайдено.' : pick.type === 'pay' ? 'Ніхто не винен.' : 'Клієнтів ще немає.'}</div>`}
    ${add}`;
}

function pickModal(type) {
  pick.type = type; pick.q = '';
  openModal(`<div class="stack pick">
    <h2>${type === 'debt' ? 'Новий борг — хто бере?' : 'Прийняти оплату — від кого?'}</h2>
    ${searchBox('pick-q', '', pick.byPhone, 'pick-phone')}
    <div id="pick-list">${pickList()}</div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button></div>
  </div>`);
}

/** Відкрити картку клієнта і одразу вікно боргу чи оплати */
function openClientOp(id, type) {
  const target = '#/client/' + id;
  if (location.hash === target) { opModal(type); return; }
  window.addEventListener('hashchange', () => setTimeout(() => opModal(type), 0), { once: true });
  go(target);
}

function togglePhone(state, inputId) {
  state.byPhone = !state.byPhone;
  const inp = document.getElementById(inputId);
  if (inp) {
    inp.setAttribute('inputmode', state.byPhone ? 'tel' : 'search');
    inp.placeholder = state.byPhone ? 'Номер телефону' : 'Ім’я або номер';
    inp.blur(); inp.focus();   // клавіатура перемикається лише після нового фокуса
  }
  const b = inp && inp.parentElement.querySelector('.phone-toggle');
  if (b) { b.textContent = state.byPhone ? 'АБВ' : '123'; b.setAttribute('aria-pressed', state.byPhone); b.setAttribute('aria-label', state.byPhone ? 'Шукати за ім’ям (літери)' : 'Шукати за номером (цифрова клавіатура)'); }
}

/** Підсвітити чіпи, які вже є в описі */
function syncChips() {
  const n = document.getElementById('op-note'); if (!n) return;
  const have = n.value.split(',').map(x => x.trim().toLowerCase());
  document.querySelectorAll('[data-act=quick-note]').forEach(b => b.setAttribute('aria-pressed', have.includes(b.dataset.v.toLowerCase())));
}

/** Показати крок підтвердження у вікні запису */
function ask(form, html) {
  document.getElementById('op-extra').innerHTML = html;
  const b = form.querySelector('#op-extra button');
  if (b) b.focus(); else form.querySelector('#op-extra').scrollIntoView({ block: 'nearest' });
}
function submitForm(form) {
  if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}
/** Чи можна одразу відкликати щойно зроблений запис (кнопка «Скасувати» в повідомленні) */
function undoAllowed(op) {
  if (isOwner()) return true;
  if ((S.shop?.cancel_minutes ?? 15) <= 0) return false;
  const c = S.clients.get(op.client_id);
  if (op.type === 'pay' && c && c.limit_kop && stats().get(c.id).bal + op.amount > c.limit_kop) return false;
  return true;
}
async function undo(id) {
  try { await cancelOp(id, 'Скасовано одразу після запису'); toast('Запис скасовано — він лишиться закресленим в історії'); }
  catch (e) { toast(e.message, 'bad'); }
}
// пошук у вікні вибору клієнта — оновлюємо лише список, щоб не збивати клавіатуру
document.addEventListener('input', (e) => {
  if (e.target.id === 'pick-q') { pick.q = e.target.value; const l = document.getElementById('pick-list'); if (l) l.innerHTML = pickList(); }
  if (e.target.id === 'c-phone') {   // лише цифри, не більше 10, пробіли самі
    let d = digits(e.target.value);
    if (d.startsWith('380')) d = d.slice(2);   // набрали чи вставили номер разом з «+38» — він уже стоїть зліва
    e.target.value = phoneMask(d.slice(0, 10));
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'op-note') syncChips(); });
document.addEventListener('keydown', (e) => {   // Enter у пошуку — вибрати, якщо знайшовся один
  if (e.key !== 'Enter' || e.target.id !== 'pick-q') return;
  const rows = document.querySelectorAll('#pick-list [data-act=pick-client]');
  if (rows.length === 1) { e.preventDefault(); rows[0].click(); }
});
// номер без нуля на початку (67 123 45 67) — доставляємо 0, коли людина закінчила вводити
document.addEventListener('focusout', (e) => {
  if (e.target.id !== 'c-phone') return;
  const d = digits(e.target.value);
  if (d.length === 9 && d[0] !== '0') e.target.value = phoneMask('0' + d);
});
// будь-яка зміна суми скидає підтвердження
document.addEventListener('input', (e) => {
  if (e.target.id !== 'op-amount') return;
  const x = document.getElementById('op-extra'); if (x) x.innerHTML = '';
  const f = e.target.closest('form'); if (f) { delete f.dataset.bigOk; delete f.dataset.overOk; delete f.dataset.advOk; }
});

// ---------------- дії ----------------
register({
  'list-filter': (el) => { listState.filter = el.dataset.v; view.rerender(); },
  'list-sort': (el) => { listState.sort = el.dataset.v; view.rerender(); },
  'open-client': (el) => go('#/client/' + el.dataset.id),
  'new-client': () => clientModal(null),
  pick: (el) => pickModal(el.dataset.type),
  'pick-client': (el) => { closeModal(); openClientOp(el.dataset.id, pick.type); },
  'pick-new': () => { const q = pick.q; closeModal(); clientModal(null, { then: 'debt', q }); },
  'pick-phone': () => togglePhone(pick, 'pick-q'),
  'list-phone': () => togglePhone(listState, 'q'),
  'edit-client': () => clientModal(S.clients.get(view.clientId)),
  op: (el) => opModal(el.dataset.type),
  remind: () => remindModal(),
  'copy-remind': async () => { toast(await copyText(document.getElementById('r-text').value) ? 'Скопійовано' : 'Виділіть текст і скопіюйте вручну'); },
  'remind-done': async (el) => { await markReminded(el.dataset.id); closeModal(); toast('Позначено: нагадали сьогодні', 'ok'); },
  'cancel-op': (el) => { const o = S.ops.get(el.dataset.id); if (o) cancelModal(o); },
  'quick-note': (el) => {
    const n = document.getElementById('op-note');
    if (/^інше$/i.test(el.dataset.v)) { n.focus(); return; }   // «Інше» — одразу писати своє
    const parts = n.value.split(',').map(x => x.trim()).filter(Boolean);
    const i = parts.findIndex(x => x.toLowerCase() === el.dataset.v.toLowerCase());
    if (i >= 0) parts.splice(i, 1); else parts.push(parts.length ? el.dataset.v.toLowerCase() : el.dataset.v);
    if (parts.length && parts[0] === parts[0].toLowerCase()) parts[0] = parts[0][0].toUpperCase() + parts[0].slice(1);
    n.value = parts.join(', ');
    syncChips();
  },
  'op-confirm': (el) => {
    const form = el.closest('form'); if (!form) return;
    if (el.dataset.set) document.getElementById('op-amount').value = el.dataset.set;
    form.dataset[el.dataset.key] = document.getElementById('op-amount').value.trim();
    submitForm(form);
  },
  unarchive: async () => {
    const c = S.clients.get(view.clientId); if (!c) return;
    try { await updateClient(c.id, { name: c.name, phone: c.phone, address: c.address, note: c.note, limit_kop: c.limit_kop, archived: false }); toast('Клієнта повернуто з архіву', 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'fill-amount': (el) => { document.getElementById('op-amount').value = moneyInput(+el.dataset.v); },
  'retry-op': (el) => retryFailed('op', el.dataset.id),
  'discard-op': (el) => discardFailed('op', el.dataset.id),
  'retry-client': (el) => retryFailed('client', el.dataset.id),
  'discard-client': async (el) => { await discardFailed('client', el.dataset.id); go('#/list'); },
}, {
  async op(form) {
    const type = form.dataset.type;
    const c = S.clients.get(view.clientId); if (!c) return closeModal();
    const bal = stats().get(c.id).bal;
    const raw = document.getElementById('op-amount').value.trim();
    const amount = parseMoney(raw);
    const note = document.getElementById('op-note').value.trim();
    if (!(amount > 0)) return formError(form, 'Введіть суму більше нуля (напр. 85 або 85,50).');
    if (amount > 10000000) return formError(form, 'Завелика сума — перевірте, чи немає зайвих нулів.');
    formError(form, '');
    // 1) велика сума — захист від зайвого нуля
    const big = confirmOver();
    if (big > 0 && amount > big && form.dataset.bigOk !== raw) {
      return ask(form, `<div class="confirm-box warn"><b>Точно ${money(amount)}?</b> Перевірте, чи немає зайвого нуля.
        <div class="m-actions start"><button type="button" class="btn sm ${type === 'debt' ? 'bad' : 'ok'}" data-act="op-confirm" data-key="bigOk">Так, ${money(amount)}</button></div></div>`);
    }
    // 2) ліміт клієнта
    let over = false;
    if (type === 'debt' && c.limit_kop && bal + amount > c.limit_kop) {
      const excess = bal + amount - c.limit_kop;
      if (!isOwner()) {
        return ask(form, `<div class="confirm-box warn">Перевищено ліміт ${money(c.limit_kop)} на <b>${money(excess)}</b>. Можна ще ${money(Math.max(0, c.limit_kop - bal))}. Більше — лише з дозволу власника.</div>`);
      }
      if (form.dataset.overOk !== raw) {
        return ask(form, `<div class="confirm-box warn">Борг стане <b>${money(bal + amount)}</b> — на <b>${money(excess)}</b> більше ліміту ${money(c.limit_kop)}.
          <div class="m-actions start"><button type="button" class="btn sm bad" data-act="op-confirm" data-key="overOk">Все одно записати</button></div></div>`);
      }
      over = true;
    }
    // 3) оплата більша за борг — аванс або лише борг
    if (type === 'pay' && bal > 0 && amount > bal && form.dataset.advOk !== raw) {
      return ask(form, `<div class="confirm-box info">Оплата більша за борг на <b>${money(amount - bal)}</b>.
        <div class="m-actions start">
          <button type="button" class="btn sm ok" data-act="op-confirm" data-key="advOk">Записати ${money(amount)} (${money(amount - bal)} — аванс)</button>
          <button type="button" class="btn sm" data-act="op-confirm" data-key="advOk" data-set="${moneyInput(bal)}">Лише борг: ${money(bal)}</button>
        </div></div>`);
    }
    await busy(form, async () => {
      try {
        const op = await addOp({ client_id: c.id, type, amount, note, over_limit: over });
        closeModal();
        if (navigator.vibrate) try { navigator.vibrate(30); } catch { /* */ }
        const first = c.name.split(/\s+/)[0];
        toast(type === 'debt' ? `Записано борг ${money(amount)} — ${first}` : `Прийнято ${money(amount)} — ${first}`, 'ok',
          undoAllowed(op) ? { action: { label: 'Скасувати', fn: () => undo(op.id) }, ms: 5000 } : {});
      } catch (e) { formError(form, e.message); }
    });
  },
  async client(form) {
    const id = form.dataset.id;
    const name = document.getElementById('c-name').value.trim().replace(/\s+/g, ' ');
    if (!name) return formError(form, 'Вкажіть ім’я.');
    let typed = digits(document.getElementById('c-phone').value);
    if (typed.length === 9 && typed[0] !== '0') typed = '0' + typed;
    if (typed && !/^0\d{9}$/.test(typed)) return formError(form, 'Номер телефону — 10 цифр після +38, напр. 067 123 45 67. Або залиште поле порожнім.');
    const phone = storePhone(typed);
    const address = document.getElementById('c-address').value.trim().replace(/\s+/g, ' ');
    if (address) {
      const bare = address.toLowerCase().replace(/[\s.,-]/g, '');
      if (address.length < 2) return formError(form, 'Адреса закоротка. Вкажіть вулицю, будинок або орієнтир — або залиште порожнім.');
      if (/^(.)\1+$/u.test(bare) || !/[\p{L}\d]/u.test(bare)) return formError(form, 'Схоже на випадковий текст. Вкажіть вулицю, будинок або орієнтир (напр. біля школи) — або залиште порожнім.');
    }
    let limit = id ? S.clients.get(id).limit_kop : (S.shop?.default_limit ?? 0);
    if (isOwner()) {
      limit = parseMoney(document.getElementById('c-limit').value || '0');
      if (!(limit >= 0)) return formError(form, 'Ліміт має бути числом, напр. 2000.');
    }
    if (!id && !form.dataset.dupOk) {
      const dup = [...S.clients.values()].find(c => c.name.toLowerCase() === name.toLowerCase() || (phone && digits(c.phone).length >= 9 && digits(c.phone).slice(-9) === digits(phone).slice(-9)));
      if (dup) { form.dataset.dupOk = '1'; return formError(form, `Схожий клієнт уже є: ${dup.name}${dup.phone ? ', ' + fmtPhone(dup.phone) : ''}. Натисніть ще раз, якщо це інша людина.`); }
    }
    const data = { name, phone, address, note: document.getElementById('c-note').value.trim(), limit_kop: limit };
    await busy(form, async () => {
      try {
        if (id) {
          data.archived = document.getElementById('c-archived').checked;
          await updateClient(id, data); closeModal(); toast('Збережено', 'ok');
        } else {
          const c = await createClient(data); closeModal(); listState.q = ''; pick.q = '';
          toast('Клієнта додано', 'ok');
          if (form.dataset.then) openClientOp(c.id, form.dataset.then); else go('#/client/' + c.id);
        }
      } catch (e) { formError(form, e.message); }
    });
  },
  async cancel(form) {
    const reason = document.getElementById('cancel-reason').value.trim();
    if (!reason) return formError(form, 'Вкажіть причину.');
    const o = S.ops.get(form.dataset.id);
    const c = o && S.clients.get(o.client_id);
    if (o && c && !isOwner() && o.type === 'pay' && c.limit_kop && stats().get(c.id).bal + o.amount > c.limit_kop) {
      return formError(form, 'Після скасування цієї оплати борг перевищить ліміт клієнта. Попросіть власника скасувати запис.');
    }
    await busy(form, async () => {
      try { await cancelOp(form.dataset.id, reason); closeModal(); toast('Запис скасовано'); }
      catch (e) { formError(form, e.message); }
    });
  },
});

return { DEFAULT_NOTES, listState, listView, balHtml, clientView, DEFAULT_REMIND, fillTemplate };
})();

const csvCell = (v) => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const num = (k) => (k / 100).toFixed(2).replace('.', ',');
const dt = (t) => t ? new Date(t).toLocaleString('uk-UA') : '';
const csv = (rows) => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
const shopSlug = () => (S.shop?.name || 'magazyn').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 30);

function exportClients() {
