  },
  'adm-claim-no': (el) => openModal(`<form data-form="adm-claim-no" data-id="${esc(el.dataset.id)}" class="stack" novalidate>
      <h2>Оплату не знайдено</h2>
      <p class="small muted">Власник побачить причину у своїй програмі й зможе повідомити ще раз.</p>
      <label class="f">Причина *<input id="claim-reason" maxlength="200" placeholder="напр. оплату не знайдено"></label>
      <div class="quick">${['Оплату не знайдено', 'Сума менша, ніж потрібно', 'Немає номера магазину в коментарі'].map(t => `<button type="button" data-act="adm-fill" data-t="claim-reason" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <div class="err" role="alert"></div>
      <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn bad" type="submit">Відхилити</button></div></form>`),
  'adm-copy': async (el) => toast(await copyText(el.dataset.v) ? 'Скопійовано' : 'Не вдалося скопіювати'),
  'adm-label': async (el) => {
    const cur = new Set(sp.data.shop.labels || []);
    cur.has(el.dataset.v) ? cur.delete(el.dataset.v) : cur.add(el.dataset.v);
    try { await api.rpc('admin_set_labels', { p_shop: sp.id, p_labels: [...cur] }); sp.data.shop.labels = [...cur]; as.shops = null; view.rerender(); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'adm-cancel-disc': async (el) => {
    try { await api.rpc('admin_cancel_discount', { p_id: +el.dataset.id }); await after('Знижку скасовано'); } catch (e) { toast(e.message, 'bad'); }
  },
  'admin-remind': () => {
    const s = sp.data.shop, owner = sp.data.members.find(m => m.role === 'owner') || {};
    const body = remindText();
    openModal(`<div class="stack">
      <h2>Нагадування про оплату</h2><div class="small muted">${esc(owner.email || '')}</div>
      <label class="f">Текст<textarea id="rem-text" rows="8">${esc(body)}</textarea></label>
      <div class="m-actions start"><button class="btn ink" data-act="copy-remind-admin">Копіювати</button>
        ${owner.email ? `<a class="btn" href="mailto:${esc(owner.email)}?subject=${encodeURIComponent('Підписка «Зошит боржників» — ' + s.name)}&body=${encodeURIComponent(body)}">Написати листа</a>` : ''}</div>
      <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div></div>`);
  },
  'copy-remind-admin': async () => { toast(await copyText(document.getElementById('rem-text').value) ? 'Скопійовано' : 'Виділіть текст і скопіюйте'); },
  'admin-export': async () => {
    try {
      const data = await api.rpc('admin_export_shop', { p_shop: sp.id });
      const slug = (data.shop?.name || 'magazyn').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 30);
      downloadFile(`kopiya-${slug}-${isoDate()}.json`, JSON.stringify(data, null, 1), 'application/json');
      toast('Копію збережено', 'ok');
      const inp = document.getElementById('ax-del-name');
      if (inp) { inp.disabled = false; inp.placeholder = ''; document.querySelector('[data-act=admin-delete]').disabled = false; }
    } catch (e) { toast(e.message, 'bad'); }
  },
  'admin-delete': async () => {
    try { const r = await api.rpc('admin_delete_shop', { p_shop: sp.id, p_confirm_name: document.getElementById('ax-del-name').value }); await after(`Магазин сховано. Відновити можна до ${fmtD(r.purge_after)}`); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'admin-restore': async () => { try { await api.rpc('admin_restore_shop', { p_shop: sp.id }); await after('Магазин відновлено'); } catch (e) { toast(e.message, 'bad'); } },
  'admin-purge': async () => {
    try { await api.rpc('admin_purge_shop', { p_shop: sp.id, p_confirm_name: document.getElementById('ax-purge-name').value }); toast('Магазин видалено остаточно'); refreshAll(); go('#/admin/shops'); }
    catch (e) { toast(e.message, 'bad'); }
  },
}, {
  async 'adm-claim-ok'(form) {
    const amount = parseMoney(document.getElementById('claim-ok-amount').value);
    if (!(amount > 0)) return formError(form, 'Вкажіть отриману суму.');
    await busy(form, async () => {
      try {
        const r = await api.rpc('admin_confirm_claim', { p_claim: form.dataset.id, p_amount_kop: amount, p_method: document.getElementById('claim-ok-method').value });
        await claimDone(`Оплату зараховано. Доступ до ${fmtD(r.paid_until)}`);
      } catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-claim-no'(form) {
    const reason = document.getElementById('claim-reason').value.trim();
    if (!reason) return formError(form, 'Вкажіть причину — її побачить власник.');
    await busy(form, async () => {
      try { await api.rpc('admin_reject_claim', { p_claim: form.dataset.id, p_reason: reason }); await claimDone('Повідомлення відхилено'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-pay'(form) {
    const period = form.querySelector('[name=pay-period]:checked').value;
    const amount = parseMoney(document.getElementById('pay-amount').value);
    const dd = parseInt(document.getElementById('pay-days').value, 10);
    if (!(amount > 0)) return formError(form, 'Сума має бути більше нуля. Безкоштовні дні — це «Дати бонус».');
    if (period === 'custom' && !(dd > 0)) return formError(form, 'Вкажіть кількість днів.');
    await busy(form, async () => {
      try {
        const r = await api.rpc('admin_add_payment', { p_shop: sp.id, p_amount_kop: amount, p_method: document.getElementById('pay-method').value, p_period: period, p_days: period === 'custom' ? dd : null, p_note: document.getElementById('pay-note').value });
        await after(`Оплату зараховано. Доступ до ${fmtD(r.paid_until)}`);
      } catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-bonus'(form) {
    const n = parseInt(document.getElementById('bonus-days').value, 10), reason = document.getElementById('bonus-reason').value.trim();
    if (!(n > 0)) return formError(form, 'Вкажіть кількість днів.');
    if (!reason) return formError(form, 'Вкажіть причину бонусу.');
    await busy(form, async () => {
      try { const r = await api.rpc('admin_add_bonus', { p_shop: sp.id, p_days: n, p_reason: reason }); await after(`Бонус +${n} дн. Доступ до ${fmtD(r.paid_until)}`); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-discount'(form) {
    const p = readDiscount();
    if (!p.reason) return formError(form, 'Вкажіть причину знижки.');
    await busy(form, async () => {
      try { await api.rpc('admin_add_discount', { p_shop: sp.id, p }); await after('Знижку додано'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-trial'(form) {
    const n = parseInt(document.getElementById('trial-days').value, 10), reason = document.getElementById('trial-reason').value.trim();
    if (!(n > 0)) return formError(form, 'Вкажіть кількість днів.');
    if (!reason) return formError(form, 'Вкажіть причину.');
    await busy(form, async () => {
      try { const r = await api.rpc('admin_extend_trial', { p_shop: sp.id, p_days: n, p_reason: reason }); await after(`Пробний до ${fmtD(r.trial_until)}`); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-free'(form) {
    const mode = form.querySelector('[name=free-mode]:checked').value, reason = document.getElementById('free-reason').value.trim();
    const date = document.getElementById('free-until').value;
    if (!reason) return formError(form, 'Вкажіть причину.');
    if (mode === 'until' && !date) return formError(form, 'Оберіть дату.');
    const until = mode === 'forever' ? '2099-12-31T00:00:00Z' : mode === 'until' ? new Date(date + 'T23:59:59').toISOString() : null;
    await busy(form, async () => {
      try { await api.rpc('admin_set_free', { p_shop: sp.id, p_until: until, p_reason: reason }); await after(mode === 'off' ? 'Безкоштовний режим вимкнено' : 'Магазин безкоштовний'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-suspend'(form) {
    const on = !sp.data.shop.suspended_at;
    const reason = on ? document.getElementById('susp-reason').value.trim() : '';
    if (on && !reason) return formError(form, 'Вкажіть причину.');
    await busy(form, async () => {
      try { await api.rpc('admin_suspend', { p_shop: sp.id, p_on: on, p_reason: reason }); await after(on ? 'Доступ призупинено' : 'Доступ відновлено'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-note'(form) {
    const t = document.getElementById('adm-note').value.trim();
    if (!t) return;
    try { await api.rpc('admin_add_note', { p_shop: sp.id, p_text: t }); sp.data = null; await loadShop(sp.id); }
    catch (e) { toast(e.message, 'bad'); }
  },
});

    if (v !== 'custom') a.value = (+a.dataset[v] / 100).toString().replace('.', ',');

  if (e.target.id === 'adm-plan') {
    try { await api.rpc('admin_set_plan', { p_shop: sp.id, p_plan: e.target.value }); await after('Тариф змінено'); } catch (err) { toast(err.message, 'bad'); }
  }
});

return { as, load, ensureShops, ensureClaims, claimRow, refreshAll, STATUS, statusChip, METHOD, adminView, shopPage, srcName, discText, discountForm, readDiscount, payRow, discRow };

M.views_admin_app = (function () {

// Адмін-платформа: окремий застосунок за адресою #/admin (не залежить від жодного магазину).

// Автовихід з адмінки після N хвилин без дій — налаштовується (Налаштування → Безпека), за замовчуванням 60
const IDLE_CHOICES = [30, 60, 120, 480];

const fmtIdle = (m) => m >= 60 ? `${m / 60} год` : `${m} хв`;
const ad = { factors: null, enroll: null, loading: false, error: null, pays: null, log: null, platform: null, admins: [], locked: false,
  disc: null, promos: null, plans: null, mass: null, promoForm: false, planEdit: null, visits: null, visitDays: 30,
  live: null, devices: null, deviceOk: null, deviceTry: null, deviceTries: 0 };

// ---------------- довірений пристрій (код 2FA — раз на 30 днів) ----------------
const DEV_KEY = 'zoshyt.adminDevice';   // {id, token, until} — ключ лише на цьому пристрої, на сервері — його відбиток
function getDev() {
  try { const d = JSON.parse(lsGet(DEV_KEY) || 'null'); return d && d.id && d.token && new Date(d.until) > new Date() ? d : null; } catch { return null; }
}
const forgetDev = () => lsSet(DEV_KEY, null);
/** Другий фактор пройдено: щойно введено код (aal2) або цю сесію звільнив довірений пристрій */
const mfaOk = () => api.currentAal() === 'aal2' || (!!ad.deviceOk && ad.deviceOk === api.sessionId());
async function tryDevice(dev) {
  ad.deviceTry = api.sessionId(); ad.deviceTries++;
  try {
    const r = await api.rpc('trusted_device_unlock', { p_device: dev.id, p_token: dev.token });
    if (r && r.ok) { ad.deviceOk = api.sessionId(); touch(true); runSync({ forceBoot: true }); }
    else forgetDev();
  } catch { /* немає зв'язку — попросимо код */ }
  view.rerender();
}
const deviceLabel = () => {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'пристрій';
  const br = /Edg\//.test(ua) ? 'Edge' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  return `${os}${br ? ' · ' + br : ''}`;
};
api.onMfaRequired(() => {
  // сервер більше не приймає довірений пристрій (відкликали / минуло 30 днів) — покажемо екран коду
  if (ad.deviceOk) { ad.deviceOk = null; if (ad.deviceTries < 3) ad.deviceTry = null; }
  view.rerender();
});

// ---------------- вхід і перевірка ----------------
async function loadFactors() {
  if (ad.loading) return;
  const sid = api.sessionId();
  ad.loading = true; ad.error = null; ad.factorsSid = sid;
  let f = null, err = null;
  try { f = (await api.mfaFactors()).filter(x => x.factor_type === 'totp'); } catch (e) { err = e.message; }
  ad.loading = false;
  // за цей час вийшли або увійшли іншим входом — відповідь уже не про поточну сесію
  if (sid === api.sessionId()) { ad.factors = f; ad.error = err; }
  view.rerender();
}

/** Що показати за адресою #/admin: «немає доступу», підключення коду, введення коду або саму адмінку */
function adminScreen(section) {
  if (!S.boot) return gate('<div class="loading">Завантаження…</div>');
  if (!S.boot.is_admin) return gate(`<h2>Немає доступу</h2>
    <div class="actions"><a class="btn" href="#/list">До застосунку</a><button class="btn ghost" data-act="adm-logout">Вийти</button></div>`);
  if (ad.locked || !mfaOk()) {
    // довірений пристрій: спершу пробуємо без коду (один раз на сесію входу)
    const dev = !ad.locked && getDev();
    if (dev && ad.deviceTry !== api.sessionId() && ad.deviceTries < 3) { tryDevice(dev); return gate('<div class="loading">Перевірка пристрою…</div>'); }
    // вихід з акаунта ще триває (сесію вже стерто) — нічого не запитуємо
    if (!api.getSession()) return gate('<div class="loading">Вихід…</div>');
    if (ad.factorsSid && ad.factorsSid !== api.sessionId()) { ad.factors = null; ad.error = null; ad.factorsSid = null; }
    // помилку показуємо з кнопкою, а не перепитуємо сервер у циклі
    if (!ad.factors) { if (!ad.error) loadFactors(); return gate(ad.error ? `<div class="banner bad">${esc(ad.error)}</div><button class="btn" data-act="adm-retry">Спробувати ще</button>` : '<div class="loading">Перевірка…</div>'); }
    const verified = ad.factors.find(f => f.status === 'verified');
    return verified ? codeScreen(verified) : enrollScreen();
  }
  const parts = location.hash.replace(/^#\/?admin\/?/, '').split('/');
  const sec = parts[0] || '';
  // відкрили розділ заново — показуємо свіжі дані, а не збережені з минулого разу
  if (sec !== ad.lastSec) {
    ad.lastSec = sec;
    if (sec === 'log') ad.log = null;
    if (sec === 'payments' || sec === '') ad.pays = null;
    if (sec === 'discounts') ad.disc = null;
    if (sec === 'promos') ad.promos = null;
    if (sec === 'plans') ad.plans = null;
    if (sec === 'visits') ad.visits = null;
    if (sec === '') ad.live = null;
    if (sec === 'settings') ad.devices = null;
    if (sec === 'errors' || sec === '') ad.errs = null;
    if (sec === 'shops' || sec === '') as.shops = null;
    as.claims = null;   // повідомлення про оплату — свіжі при кожному переході між розділами
  }
  as.onClaim = () => { ad.pays = null; };
  ensureClaims();   // лічильник «Я оплатив(ла)» біля «Оплати» — видно з будь-якого розділу
  if (sec === 'shop' && parts[1]) return shell('shops', shopPage(parts[1], parts[2] || 'general'));
  return shell(sec, sectionView(sec));
}

function sectionView(section) {
  switch (section) {
    case 'shops': return shopsSection();
    case 'payments': return paymentsView();
    case 'discounts': return discountsView();
    case 'promos': return promosView();
    case 'plans': return plansView();
    case 'visits': return visitsView();
    case 'errors': return errorsView();
    case 'log': return logView();
    case 'settings': return settingsView();

}

async function ensureLive(force = false) {
  if ((ad.live && !force) || ad.liveLoading) return;
  ad.liveLoading = true;
  try { ad.live = await api.rpc('admin_live'); ad.liveAt = Date.now(); } catch { ad.live = ad.live || { error: true }; }
  finally { ad.liveLoading = false; view.rerender(); }
}
// на «Огляді» онлайн оновлюється сам раз на хвилину (лише коли вкладка на екрані)
setInterval(() => {
  if (document.visibilityState === 'visible' && /^#\/admin\/?$/.test(location.hash) && mfaOk() && !ad.locked && Date.now() - (ad.liveAt || 0) > 55000) ensureLive(true);
}, 10000);
const fmtDur = (sec) => sec == null ? '—' : sec < 60 ? `${Math.round(sec)} с` : sec < 3600 ? `${Math.round(sec / 60)} хв` : `${Math.floor(sec / 3600)} год ${Math.round(sec % 3600 / 60)} хв`;

  return `<section class="kpis live-kpis">
    ${card('Онлайн зараз', l.online, l.online ? 'ok' : '', `власників ${l.online_owners} · продавців ${l.online_sellers}`)}

    ${card('Відкривають програму', l.sessions_per_shop_day != null ? String(l.sessions_per_shop_day).replace('.', ',') : '—', '', `разів на день у магазині · ${l.minutes_per_shop_day ?? 0} хв`)}

function overviewView() {
  ensureShops(); ensurePays(); ensureErrs(); ensureLive();
  if (as.error) return `<div class="banner bad">${esc(as.error)}</div>`;
  if (!as.shops) return '<div class="empty">Завантаження…</div>';
  const now = Date.now();
  const alive = as.shops.filter(s => !s.deleted_at);
  const by = (st) => alive.filter(s => s.status === st);
  const left = (s) => Math.ceil((new Date(s.access_until) - now) / DAY);
  const paying = by('paid'), trial = by('trial');
  const new30 = alive.filter(s => now - new Date(s.created_at) < 30 * DAY).length;
  const real30 = (ad.pays || []).filter(p => p.kind === 'payment' && now - new Date(p.created_at) < 30 * DAY);
  const paid30 = real30.reduce((x, p) => x + (+p.amount_kop || 0), 0);
  const mrr = alive.reduce((x, s) => x + (+s.mrr_kop || 0), 0);
  const everPaid = alive.filter(s => s.paid_ever).length;
  const conv = alive.length ? Math.round(everPaid / alive.length * 100) : 0;
  const soonTrial = trial.filter(s => left(s) <= 3).sort((a, b) => left(a) - left(b));
  const idleTrial = trial.filter(s => !s.last_activity ? now - new Date(s.created_at) > 5 * DAY : now - new Date(s.last_activity) > 5 * DAY);
  const card = (k, v, cls = '', hint = '') => `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${hint ? `<div class="small muted">${hint}</div>` : ''}</div>`;
  const shopRow = (s, note) => `<li class="row" data-act="admin-open" data-id="${esc(s.id)}" tabindex="0">
      <div class="who"><div class="name">${esc(s.name)}</div><div class="meta"><span>${esc(s.owner_name || '')}</span><span>${esc(s.owner_email || '')}</span></div></div>
      <div class="sum"><span class="small">${note}</span>${s.owner_email ? `<a class="btn sm" href="mailto:${esc(s.owner_email)}" data-stop>Написати</a>` : ''}</div></li>`;
  const calm = !soonTrial.length && !idleTrial.length;
  const noPay = !CFG.payCard && !CFG.payIban && !CFG.payLink;
  return `<div class="row-between page-head"><h1>Огляд</h1><button class="icon-btn" data-act="adm-reload" aria-label="Оновити">${icon.refresh}</button></div>
  ${ad.errs && ad.errs.last24 > 0 ? `<div class="banner warn"><b>Помилки програми за добу: ${ad.errs.last24}.</b> <a href="#/admin/errors">Переглянути →</a></div>` : ''}
  ${noPay ? `<div class="banner warn no-pay"><b>Не вказано, куди платити.</b> Власники магазинів не бачать реквізитів, номера для коментаря і кнопки «Я оплатив(ла)». <a href="#/admin/settings">Додати картку чи IBAN →</a></div>` : ''}
  ${claimsSection()}
  ${liveSection()}
  <section class="kpis">
    ${card('Платних магазинів', paying.length, 'ok', 'остання дія — реальна оплата')}
    ${card('На пробному', trial.length)}
    ${card('З бонусом', by('bonus').length, '', 'безкоштовні дні')}
    ${card('Безкоштовні', by('free').length)}
    ${card('Прострочені', by('expired').length, by('expired').length ? 'bad' : '')}
    ${card('Нових за 30 днів', new30)}
    ${card('Отримано за 30 днів', money(paid30), 'ok', `${real30.length} ${plural(real30.length, 'оплата', 'оплати', 'оплат')}`)}
    ${card('Дохід на місяць', money(mrr), '', 'річні оплати ÷ 12')}
    ${card('Оплатили хоч раз', conv + '%', '', `${everPaid} з ${alive.length}`)}
    ${card('Середній платіж на місяць', paying.length ? money(Math.round(mrr / paying.length)) : '—')}
  </section>
  <section class="sheet"><div class="pad ${calm ? '' : 'pb0'}"><h2>Потребують уваги</h2>${calm ? '<p class="calm">Все спокійно ✓</p>' : ''}</div>
    ${soonTrial.length ? `<div class="pad pt0 small muted">Пробний закінчується за 3 дні або менше</div><ul class="rows">${soonTrial.map(s => shopRow(s, left(s) <= 0 ? 'закінчився' : 'ще ' + days(left(s)))).join('')}</ul>` : ''}
    ${idleTrial.length ? `<div class="pad pt0 small muted" style="margin-top:12px">На пробному й не заходять 5+ днів — варто подзвонити</div><ul class="rows">${idleTrial.map(s => shopRow(s, s.last_activity ? 'остання дія ' + fmtD(s.last_activity) : 'жодного запису')).join('')}</ul>` : ''}
  </section>`;

/** Список «назва — число» з тонкою смужкою (один колір, без легенди) */
function meterList(items, label, value, unit) {
  if (!items.length) return '<div class="empty small">Поки немає даних.</div>';
  const max = Math.max(1, ...items.map(value));
  return `<ul class="meters">${items.map(x => `<li><div class="row-between"><span class="m-name">${esc(label(x))}</span><b>${value(x)}</b></div>
    <span class="meter" role="img" aria-label="${esc(label(x))}: ${value(x)} ${unit}"><i style="width:${Math.max(2, Math.round(value(x) / max * 100))}%"></i></span></li>`).join('')}</ul>`;
}

function logText(a) {

  if (a.action === 'admin:bonus') return `+${d.days} дн. · ${d.reason || ''}`;

  if (['admin:device_trust', 'admin:device_revoke'].includes(a.action)) return d.label || '';

// ---------------- автовихід після N хв без дій (з попередженням за 2 хв) ----------------
// Дією вважається будь-який дотик, клавіша, прокрутка — у будь-якій вкладці адмінки на цьому пристрої.
// Фонові оновлення (онлайн, нові оплати) дією НЕ вважаються.
let last = Date.now(), lastWrite = 0, timingOut = false;
function touch(force = false) {
  last = Date.now();
  if (force || last - lastWrite > 5000) { lastWrite = last; lsSet('zoshyt.adminSeen', String(last)); }
}
const onAct = () => { if (location.hash.startsWith('#/admin')) touch(); };
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, onAct, { passive: true }));
window.addEventListener('scroll', onAct, { passive: true });
const WARN_MS = 2 * 60000;
function idleBar(left) {
  let b = document.getElementById('idle-warn');
  if (left == null) { if (b) b.remove(); return; }
  const secs = Math.max(0, Math.ceil(left / 1000));
  const txt = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  if (!b) {
    b = document.createElement('div');
    b.id = 'idle-warn'; b.className = 'idle-warn'; b.setAttribute('role', 'alertdialog'); b.setAttribute('aria-live', 'assertive');
    b.innerHTML = `<div><b>Ви ще тут?</b><div class="small">Адмінка закриється через <span id="idle-left"></span> — захист, якщо телефон залишили.</div></div>
      <div class="actions"><button type="button" class="btn sm ghost" data-act="adm-logout">Вийти</button><button type="button" class="btn sm ink" data-act="adm-stay">Продовжити</button></div>`;
    document.body.appendChild(b);
  }
  b.querySelector('#idle-left').textContent = txt;
}
async function idleCheck() {
  if (!location.hash.startsWith('#/admin') || ad.locked || !mfaOk() || timingOut) { idleBar(null); return; }
  const seen = Math.max(last, +(lsGet('zoshyt.adminSeen') || 0));
  const left = idleMin() * 60000 - (Date.now() - seen);
  if (left > WARN_MS) { idleBar(null); return; }
  if (left > 0) { idleBar(left); return; }
  idleBar(null);
  timingOut = true;
  try {
    // невідправлених записів магазину немає — виходимо повністю; інакше лише блокуємо адмінку
    if ((await pendingForLogout()) === 0) {
      const mins = idleMin();   // після виходу налаштувань платформи на пристрої вже немає
      await logout(); ad.factors = null; ad.error = null; ad.deviceOk = null; ad.deviceTry = null; ad.deviceTries = 0; location.hash = '#/admin';
      toast(`Вихід з адмінки: ${fmtIdle(mins)} без дій`);
    } else { ad.locked = true; view.rerender(); }
  } finally { timingOut = false; }
}
setInterval(idleCheck, 1000);
// телефон «спав» — перевіряємо одразу після пробудження, а не через секунду показу адмінки
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') idleCheck(); });

window.ZOSHYT_VERSION = '1.11.0';
// Захист від «клікджекінгу»: програму не можна вбудувати в чужу сторінку (GitHub Pages не дає заголовка frame-ancestors)
const framed = (() => { try { return window.top !== window.self; } catch { return true; } })();
if (framed) {
  document.documentElement.innerHTML = '';
  try { window.top.location = window.location.href; } catch { /* чужий сайт не дасть — сторінка просто лишиться порожньою */ }

}
// Помилки програми — адміністратору (Адмін → Помилки). Без особистих даних: лише текст помилки, місце й версія.
const errSent = new Set(); let errN = 0;
function reportError(msg, src) {
  msg = String(msg || '').slice(0, 300);
  if (!msg || /framed|Failed to fetch|NetworkError|Load failed|AbortError|ResizeObserver/i.test(msg)) return;   // зв'язок і шум браузера — не помилки програми
  const k = msg + '|' + src;
  if (errSent.has(k) || ++errN > 10 || !navigator.onLine) return;
  errSent.add(k);
  api.rpc('log_client_error', { p_message: msg, p_source: String(src || '').slice(0, 200), p_version: window.ZOSHYT_VERSION }).catch(() => {});
}
window.addEventListener('error', (e) => reportError(e.message, `${String(e.filename || '').split('/').pop()}:${e.lineno || 0}:${e.colno || 0}`));
window.addEventListener('unhandledrejection', (e) => reportError(e.reason && (e.reason.message || e.reason), 'promise'));
const root = $('#root');
let mode = 'loading';   // loading | setup | auth | reset | confirm | app
const AUTH_ROUTES = ['login', 'signup', 'forgot', 'code', 'admin'];
const isConfirm = () => location.hash.startsWith('#/confirm');
let reloginShown = false;

// ---------- рендер ----------
let lastHash = null;
const defaultOf = (el) => el.tagName === 'SELECT' ? ([...el.options].find(o => o.defaultSelected) || el.options[0] || {}).value
  : el.type === 'checkbox' ? el.defaultChecked : el.defaultValue;
const isDirty = (el) => el.type !== 'radio' && el.type !== 'file' && el.type !== 'password' && (el.type === 'checkbox' ? el.checked !== el.defaultChecked : el.value !== defaultOf(el));
// після відправки форми введене вважається збереженим — нова форма приходить порожньою
document.addEventListener('submit', (e) => {
  for (const el of e.target.querySelectorAll('input, textarea, select')) {
    el._orig = defaultOf(el);
    if (el.type === 'checkbox') el.defaultChecked = el.checked;
    else if (el.tagName === 'SELECT') [...el.options].forEach(o => { o.defaultSelected = o.selected; });
    else el.defaultValue = el.value;

}, true);
function render() {
  const focusId = document.activeElement && document.activeElement.id;

  const dirty = location.hash === lastHash ? [...root.querySelectorAll('input[id], textarea[id], select[id]')].filter(isDirty)
    .map(el => [el.id, defaultOf(el), el.type === 'checkbox' ? el.checked : el.value]) : [];
  lastHash = location.hash;
  root.innerHTML = screen();
  for (const [id, def, val] of dirty) {
    const el = document.getElementById(id);
    if (el && root.contains(el) && defaultOf(el) === def) { if (el.type === 'checkbox') el.checked = val; else el.value = val; }
  }
  if (focusId && !modalOpen()) {
    const el = document.getElementById(focusId);
    if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(sel, sel); } catch { /* */ } }
  }
  if (view.keepScroll) window.scrollTo(0, scroll);
  view.keepScroll = true;
  if (S.authExpired && !reloginShown && mode === 'app') { reloginShown = true; reloginModal(); }
  if (!S.authExpired) reloginShown = false;
}
view.rerender = render;

  if (mode === 'auth') return r.name === 'signup' ? signupView() : r.name === 'forgot' ? forgotView() : r.name === 'code' ? codeView() : loginView({ admin: r.name === 'admin' });

  if (!S.boot.shops.length) return startView();
  if (r.name === 'overview') return shell('overview', overviewView(), 'Усі магазини');
  if (!S.shop) return shell('overview', overviewView(), 'Усі магазини');
  view.name = r.name; view.clientId = r.name === 'client' ? r.arg : null;
  switch (r.name) {
    case 'client': return shell('list', clientView(r.arg));
    case 'reports': return isOwner() ? shell('reports', reportsView()) : shell('list', listView());
    case 'journal': return shell('journal', journalView());
    case 'settings': return shell('settings', settingsView());
    case 'billing': return shell('settings', isOwner() ? billingView() : settingsView());
    case 'install': return shell('settings', installView());
    default: return shell('list', listView());
  }
}

function syncChip() {
  const s = S.sync;
  if (!navigator.onLine || s.state === 'offline') return `<button class="sync off" data-act="sync-now" title="Немає інтернету. Записи зберігаються на пристрої.">${icon.off}<span>Офлайн${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (s.state === 'syncing') return `<button class="sync" data-act="sync-now">${icon.sync}<span>Синхронізація…</span></button>`;
  if (s.state === 'error') return `<button class="sync bad" data-act="sync-now" title="${esc(s.error || '')}">${icon.warn}<span>Помилка${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (S.outbox) return `<button class="sync" data-act="sync-now">${icon.cloud}<span>${S.outbox} чекають</span></button>`;
  return `<button class="sync ok" data-act="sync-now" title="Усе збережено на сервері">${icon.check}<span>${s.lastOk ? fmtTime(s.lastOk) : 'OK'}</span></button>`;
}

/** Понад добу без зв'язку, а записи чекають — окреме помітне попередження */
function longOffline() {
  const last = S.sync.lastOk;
  return S.outbox > 0 && last > 0 && Date.now() - last > 24 * 3600 * 1000 && S.sync.state !== 'syncing';
}

function shell(tab, content, title) {
  const shops = S.boot.shops;
  const owner = isOwner();
  const tabs = S.shop ? [['list', 'Боржники', '#/list', icon.debtors]]
    .concat(owner ? [['reports', 'Звіти', '#/reports', icon.reports]] : [])
    .concat([['journal', owner ? 'Журнал' : 'Мої записи', '#/journal', icon.journal], ['settings', 'Налаштування', '#/settings', icon.gear]]) : [];
  const showShopSwitch = shops.length > 1 || shops.some(s => s.role === 'owner');
  return `
  <header class="top"><div class="top-row">
    <a class="brand" href="#/list" aria-label="Зошит боржників — на головну"><img src="icon.svg" alt="" width="30" height="30"><span class="brand-name">Зошит</span></a>
    ${S.shop && showShopSwitch ? `<label class="shop-switch"><span class="sr">Магазин</span><select id="shop-select">
        ${shops.map(s => `<option value="${esc(s.id)}" ${s.id === S.shopId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        ${shops.length > 1 ? '<option value="__overview">— Усі магазини —</option>' : ''}
        ${shops.some(s => s.role === 'owner') ? '<option value="__add">+ Додати магазин…</option>' : ''}
        <option value="__join">Приєднатися за кодом…</option>
      </select></label>` : `<span class="shop-name">${esc(title || S.shop?.name || '')}</span>`}
    <div class="top-right">${syncChip()}</div>
  </div>
  ${tabs.length ? `<nav class="tabs" aria-label="Розділи">${tabs.map(([k, l, h, ic]) => `<a class="tab" href="${h}" ${tab === k ? 'aria-current="page"' : ''}>${ic || ''}<span>${l}</span></a>`).join('')}</nav>` : ''}
  </header>
  <main class="wrap">
    ${longOffline() ? `<div class="banner warn">Записи збережені на цьому телефоні. Підключіться до інтернету, щоб вони потрапили в хмару${S.sync.lastOk ? ` (востаннє — ${fmtDT(S.sync.lastOk)})` : ''}.</div>`
      : !navigator.onLine ? `<div class="banner info">Немає інтернету — працюємо офлайн. ${S.outbox ? `${S.outbox} ${S.outbox === 1 ? 'запис чекає' : 'записи чекають'} відправки.` : 'Нові записи збережуться на пристрої.'}</div>` : ''}
    ${S.sync.state === 'error' && S.sync.error ? `<div class="banner bad">${esc(S.sync.error)}</div>` : ''}
    ${S.notices.length ? `<div class="banner bad row-between"><span>${S.notices.length} ${S.notices.length === 1 ? 'дія не збережена' : 'дії не збережено'} на сервері.</span><button class="btn sm" data-act="notices">Переглянути</button></div>` : ''}
    ${tab !== 'admin' && tab !== 'overview' && view.name !== 'billing' ? subscriptionBanner() : ''}
    ${tab === 'list' && !view.clientId ? installBanner() : ''}
    ${isOwner() && S.shop?.quarantine > 0 && tab !== 'settings' ? `<div class="banner warn row-between"><span>${S.shop.quarantine} ${S.shop.quarantine === 1 ? 'запис' : 'записи(ів)'} від вимкненого працівника чекають вашої перевірки.</span><a class="btn sm" href="#/settings">Переглянути</a></div>` : ''}
    ${content}
  </main>`;
}

// ---------- події ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOpen() && !S.authExpired) closeModal();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-act][tabindex]')) e.target.click();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { listState.q = e.target.value; render(); } });
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'shop-select') return;
  const v = e.target.value;
  if (v === '__overview') return go('#/overview');
  if (v === '__add') { e.target.value = S.shopId; return actions['add-shop'](); }
  if (v === '__join') { e.target.value = S.shopId; return actions['join-another'](); }
  await selectShop(v); go('#/list');
});
window.addEventListener('hashchange', () => {
  if (location.hash.includes('access_token=') || isConfirm()) { boot(); return; }   // посилання з листа відкрили в уже відкритій вкладці
  if (mode === 'confirm') { mode = 'loading'; boot(); return; }
  const j = parse();
  if (j.name === 'join' && j.arg) { try { sessionStorage.setItem('zoshyt.invite', j.arg); } catch (e) {} location.hash = '#/list'; return; }
  view.keepScroll = false;
  const r = parse();
  if (mode === 'app' && ['login', 'signup', 'forgot', 'code'].includes(r.name)) { location.hash = '#/list'; return; }
  if (mode === 'auth' && !AUTH_ROUTES.includes(r.name)) { location.hash = '#/login'; return; }
  closeModal(); render(); window.scrollTo(0, 0);
});
window.addEventListener('online', () => { render(); requestSync(100); });
window.addEventListener('offline', () => { S.sync.state = 'offline'; render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { requestSync(100); beat(); } });
setInterval(() => {
  if (document.visibilityState !== 'visible' || mode !== 'app') return;
  // без магазину (напр. чекаємо, поки власник поверне доступ) — перевіряємо список магазинів
  if (!S.shop) runSync({ forceBoot: true }); else requestSync(0);
}, 30000);

// «Серцебиття» для адмінки («Онлайн зараз», активні за день): раз на хвилину, лише коли програма на екрані,
// є інтернет і відкрито магазин (не адмінку). Передається тільки номер магазину — жодних даних про покупців.
let lastBeat = 0;
function beat() {
  if (mode !== 'app' || !S.shopId || S.authExpired || !navigator.onLine || document.visibilityState !== 'visible' || location.hash.startsWith('#/admin')) return;
  if (Date.now() - lastBeat < 55000) return;
  lastBeat = Date.now();
  api.rpc('heartbeat', { p_shop: S.shopId }).catch(() => {});
}
setInterval(beat, 15000);

register({
  close: () => closeModal(),
  'sync-now': () => { runSync({ forceBoot: true }).then(() => { if (S.sync.state === 'ok') toast('Синхронізовано'); else if (S.sync.state === 'offline') toast('Немає інтернету — записи збережені на пристрої'); }); },
});

subscribe(() => {
  // вийшли з акаунта (звідки завгодно) — назад до входу
  if (mode === 'app' && !S.user) {
    mode = 'auth';
    if (!AUTH_ROUTES.includes(parse().name)) { location.hash = '#/login'; return; }
  }
  if (mode === 'app' || mode === 'auth') render();
});

// ---------- запуск ----------
async function signedIn(user) {
  const foreign = await foreignPending(user);
  if (foreign) {
    // не стираємо чужі невідправлені записи мовчки
    const ok = await confirmBox({ title: 'На пристрої є чужі невідправлені записи',
      text: `${foreign.count} записів користувача <b>${esc(foreign.email)}</b> ще не відправлено на сервер. Щоб їх зберегти, вийдіть і увійдіть як ${esc(foreign.email)}. Якщо продовжити, ці записи буде видалено з пристрою.`,
      ok: 'Видалити їх і продовжити', cancel: 'Вийти', danger: true });
    if (!ok) { await api.signOut(); mode = 'auth'; location.hash = '#/login'; return render(); }
  }
  mode = 'app';
  await start(user);
  // після повторного входу (напр. через Google — сторінка перезавантажувалась) повертаємо туди, де людина була
  let back = null; try { back = sessionStorage.getItem('zoshyt.returnTo'); sessionStorage.removeItem('zoshyt.returnTo'); } catch { /* */ }
  if (back && /^#\/[\w/-]*$/.test(back)) location.hash = back;
  else if (['login', 'signup', 'forgot', 'code', 'confirm', ''].includes(parse().name.split('?')[0]) || !location.hash) location.hash = '#/list';
  render();
  await runSync({ forceBoot: true });
  beat();
}
/** Натиснули кнопку на сторінці з посилання в листі: відновлення пароля → «Новий пароль», інше → увійшли */
async function confirmed(type) {
  if (type === 'recovery') { sessionStorage.setItem('zoshyt.recovery', '1'); mode = 'reset'; return render(); }
  let u = null; try { u = await api.fetchUser(); } catch { /* */ }
  if (u) await signedIn(u); else { mode = 'auth'; location.hash = '#/login'; render(); }
}
setOnSignedIn(signedIn, confirmed);

async function boot() {
  applyPrefs();
  const inv = parse();
  if (inv.name === 'join' && inv.arg) { try { sessionStorage.setItem('zoshyt.invite', inv.arg); } catch (e) {} location.hash = '#/list'; }
  if (!api.configured()) { mode = 'setup'; return render(); }
  if (isConfirm()) { mode = 'confirm'; return render(); }
  const back = api.takeSessionFromUrl();
  if (back && back.error) toast(back.error, 'bad');
  if (back && back.type === 'recovery') { mode = 'reset'; sessionStorage.setItem('zoshyt.recovery', '1'); return render(); }
  if (sessionStorage.getItem('zoshyt.recovery') && api.getSession()) { mode = 'reset'; return render(); }
  let session = api.getSession();
  if (session && !session.user) { try { await api.fetchUser(); session = api.getSession(); } catch { /* */ } }
  if (!session || !session.user) {
    mode = 'auth';
    if (!AUTH_ROUTES.includes(parse().name)) location.hash = '#/login';
    return render();
  }
  await signedIn(session.user);
}

// ---------- оновлення програми (service worker) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => {
      const b = document.getElementById('update-bar');
      b.hidden = false;
      b.querySelector('button').onclick = () => { w.postMessage('skip-waiting'); };
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  // перезавантажуємо лише при ОНОВЛЕННІ програми, а не при першому встановленні
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}

boot().catch((e) => { console.error(e); root.innerHTML = `<div class="auth"><div class="auth-card"><div class="banner bad">Помилка запуску: ${esc(e.message)}</div><a class="btn" href="./">Перезавантажити</a></div></div>`; });

return {  };
})();
})();
</script>
</body>
</html>
