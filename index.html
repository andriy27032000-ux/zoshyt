M.router = (function () {

// Маршрути через #адресу: #/list, #/client/<id>, #/reports ...
const view = { name: 'list', clientId: null, rerender: () => {} };

function parse() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, arg] = h.split('/');
  return { name: name || 'list', arg: arg ? decodeURIComponent(arg) : null };
}

function go(hash) {
  if (location.hash === hash) view.rerender();
  else location.hash = hash;
}

return { view, parse, go };
})();

M.store = (function () {
const api = M.api;
const idb = M.idb;
const { uuid, lsGet, lsSet } = M.util;
const { applyPlatform } = M.cfg;
// Дані застосунку: локальна копія (IndexedDB) + черга відправки + синхронізація з сервером.
// Усі записи спершу зберігаються на пристрої, тому програма працює і без інтернету.




const S = {
  user: null,          // {id, email}
  boot: null,          // {is_admin, shops: [...]} — останні відомі з сервера
  shopId: null,
  shop: null,          // інформація про поточний магазин (роль, підписка, налаштування)
  members: [],
  clients: new Map(),
  ops: new Map(),
  outbox: 0,           // скільки дій чекає відправки
  sync: { state: 'idle', lastOk: +(lsGet('zoshyt.lastSync') || 0), error: null },
  notices: [],         // повідомлення про дії, які сервер не прийняв
  authExpired: false,
  version: 0,
};

// ---------- підписка на зміни ----------
const subs = new Set();
const subscribe = (fn) => { subs.add(fn); return () => subs.delete(fn); };
let scheduled = false;
function changed() {
  S.version++;
  if (scheduled) return;
  scheduled = true;
  queueMicrotask(() => { scheduled = false; subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); });
}

const isOwner = () => S.shop && S.shop.role === 'owner';
const writable = () => !S.shop || S.shop.writable !== false;
const memberName = (id) => { const m = S.members.find(x => x.user_id === id); return m ? m.display_name : (id === S.user?.id ? 'Я' : 'Працівник'); };
const me = () => S.members.find(m => m.user_id === S.user?.id);

// ---------- старт / вихід ----------
/** Чи є на пристрої невідправлені записи ІНШОГО користувача (напр. продавця, в якого закінчилась сесія) */
async function foreignPending(user) {
  const owner = await idb.kv.get('user_id');
  if (!owner || owner === user.id) return null;
  const failed = (await idb.all('ops')).filter(o => o._failed || o._pending).length + (await idb.all('clients')).filter(c => c._failed || c._pending).length;
  const n = Math.max((await idb.all('outbox')).length, failed);
  return n ? { count: n, email: (await idb.kv.get('user_email')) || 'інший користувач' } : null;
}

async function start(user) {
  S.user = { id: user.id, email: user.email, user_metadata: user.user_metadata || {} };
  const owner = await idb.kv.get('user_id');
  if (owner && owner !== user.id) await idb.clearAll();   // на пристрої були дані іншого користувача
  await idb.kv.set('user_id', user.id);
  await idb.kv.set('user_email', user.email);
  S.boot = (await idb.kv.get('boot')) || null;
  if (S.boot) applyPlatform(S.boot.platform);
  S.notices = (await idb.kv.get('notices')) || [];
  const saved = await idb.kv.get('current_shop');
  const shops = S.boot ? S.boot.shops : [];
  const pick = shops.find(s => s.id === saved) || shops[0];
  if (pick) await loadShop(pick.id);
  await countOutbox();
  idb.persist();
  changed();
}

async function pendingForLogout() { await countOutbox(); return S.outbox; }

async function logout() {
  await api.signOut();
  await idb.clearAll();
  Object.assign(S, { user: null, boot: null, shopId: null, shop: null, members: [], clients: new Map(), ops: new Map(), outbox: 0, notices: [], authExpired: false });
  S.sync = { state: 'idle', lastOk: 0, error: null };
  changed();
}

// ---------- магазини ----------
async function loadShop(id) {
  const [clients, ops, meta] = await Promise.all([idb.byShop('clients', id), idb.byShop('ops', id), idb.kv.get('shop:' + id)]);
  S.shopId = id;
  S.clients = new Map(clients.map(c => [c.id, c]));
  S.ops = new Map(ops.map(o => [o.id, o]));
  const fromBoot = S.boot && S.boot.shops.find(s => s.id === id);
  S.shop = (meta && meta.shop) || fromBoot || null;
  S.members = (meta && meta.members) || [];
  await idb.kv.set('current_shop', id);
  changed();
}

async function selectShop(id) {
  if (id === S.shopId) return;
  await loadShop(id);
  requestSync();
}

async function refreshBoot() {
  const b = await api.rpc('app_bootstrap');
  S.boot = { is_admin: b.is_admin, shops: b.shops, email: b.email, platform: b.platform || {}, at: Date.now() };
  applyPlatform(S.boot.platform);
  await idb.kv.set('boot', S.boot);
  const ids = new Set(b.shops.map(s => s.id));
  // магазини, до яких більше немає доступу, прибираємо з пристрою
  const known = (await idb.kv.get('known_shops')) || [];
  for (const old of known) if (!ids.has(old)) await purgeShop(old);
  await idb.kv.set('known_shops', [...ids]);
  if (S.shopId && !ids.has(S.shopId)) { S.shopId = null; S.shop = null; S.clients = new Map(); S.ops = new Map(); S.members = []; }
  if (!S.shopId && b.shops.length) await loadShop(b.shops[0].id);
  else if (S.shopId) {
    const fresh = b.shops.find(s => s.id === S.shopId);
    if (fresh) S.shop = { ...(S.shop || {}), ...fresh };
  }
  changed();
  return S.boot;
}

async function purgeShop(id) {
  const [clients, ops] = await Promise.all([idb.byShop('clients', id), idb.byShop('ops', id)]);
  for (const c of clients) await idb.del('clients', c.id);
  for (const o of ops) await idb.del('ops', o.id);
  await idb.kv.del('shop:' + id);
  const box = await idb.all('outbox');
  for (const e of box) if (e.shop_id === id) await idb.del('outbox', e.seq);
}

// ---------- локальні записи (працюють і офлайн) ----------
async function enqueue(entry) {
  await idb.put('outbox', { ...entry, user_id: S.user.id, at: Date.now() });
  await countOutbox();
}
async function countOutbox() {
  const box = await idb.all('outbox');
  S.outbox = box.filter(e => e.user_id === S.user?.id).length;
}
function assertWritable() {
  if (!writable()) throw new Error('Підписка магазину закінчилась — нові записи недоступні. Зверніться до продавця програми.');
}

async function addOp({ client_id, type, amount, note, over_limit }) {
  assertWritable();
  const op = {
    id: uuid(), shop_id: S.shopId, client_id, type, amount, note: note || '',
    created_by: S.user.id, client_at: new Date().toISOString(), created_at: null,
    cancelled_at: null, cancelled_by: null, cancel_reason: null,
    over_limit: !!over_limit, _pending: true,
  };
  await idb.put('ops', op);
  S.ops.set(op.id, op);
  await enqueue({ kind: 'op', shop_id: S.shopId, id: op.id });
  changed(); requestSync();
  return op;
}

async function cancelOp(id, reason) {
  assertWritable();
  const op = S.ops.get(id);
  if (!op || op.cancelled_at) return;
  const upd = { ...op, cancelled_at: new Date().toISOString(), cancelled_by: S.user.id, cancel_reason: reason, _pendingCancel: true };
  await idb.put('ops', upd);
  S.ops.set(id, upd);
  await enqueue({ kind: 'cancel', shop_id: S.shopId, id, reason });
  changed(); requestSync();
}

/** Позначити, що клієнту нагадали про борг */
async function markReminded(id) {
  const c = S.clients.get(id);
  if (!c) return;
  const upd = { ...c, last_reminded_at: new Date().toISOString(), last_reminded_by: S.user.id, _pendingRemind: true };
  await idb.put('clients', upd);
  S.clients.set(id, upd);
  await enqueue({ kind: 'remind', shop_id: S.shopId, id });
  changed(); requestSync();
}

async function createClient(data) {
  assertWritable();
  const c = {
    id: uuid(), shop_id: S.shopId, name: data.name, phone: data.phone || '', address: data.address || '', note: data.note || '',
    limit_kop: isOwner() ? data.limit_kop : (S.shop?.default_limit ?? 0), archived: false,
    created_by: S.user.id, created_at: new Date().toISOString(), updated_at: new Date().toISOString(), _pending: true,
  };
  await idb.put('clients', c);
  S.clients.set(c.id, c);
  await enqueue({ kind: 'client_create', shop_id: S.shopId, id: c.id });
  changed(); requestSync();
  return c;
}

async function updateClient(id, data) {
  assertWritable();
  const cur = S.clients.get(id);
  if (!cur) return;
  const snapshot = cur._pendingUpdate ? cur._server : stripLocal(cur);
  const upd = { ...cur, ...data, _pendingUpdate: true, _server: snapshot };
  await idb.put('clients', upd);
  S.clients.set(id, upd);
  await enqueue({ kind: 'client_update', shop_id: S.shopId, id });
  changed(); requestSync();
}

function stripLocal(o) {
  const r = {};
  for (const k in o) if (!k.startsWith('_')) r[k] = o[k];
  return r;
}

// невдалі записи: повторити або прибрати з пристрою
async function retryFailed(kind, id) {
  if (kind === 'op') {
    const op = S.ops.get(id); if (!op) return;
    const upd = { ...op, _failed: undefined, _pending: true };
    delete upd._failed;
    await idb.put('ops', upd); S.ops.set(id, upd);
    await enqueue({ kind: 'op', shop_id: op.shop_id, id });
  } else {
    const c = S.clients.get(id); if (!c) return;
    const upd = { ...c, _pending: true }; delete upd._failed;
    await idb.put('clients', upd); S.clients.set(id, upd);
    await enqueue({ kind: 'client_create', shop_id: c.shop_id, id });
  }
  changed(); requestSync();
}
async function discardFailed(kind, id) {
  if (kind === 'op') { await idb.del('ops', id); S.ops.delete(id); }
  else {
    const c = S.clients.get(id);
    const removed = new Set([id]);
    await idb.del('clients', id); S.clients.delete(id);
    for (const o of [...S.ops.values()]) if (o.client_id === id && (o._pending || o._failed)) { removed.add(o.id); await idb.del('ops', o.id); S.ops.delete(o.id); }
    const box = await idb.all('outbox');
    for (const e of box) if ((!c || e.shop_id === c.shop_id) && removed.has(e.id)) await idb.del('outbox', e.seq);
    await countOutbox();
  }
  changed();
}

async function notice(text) {
  S.notices = [{ id: uuid(), at: Date.now(), text }, ...S.notices].slice(0, 50);
  await idb.kv.set('notices', S.notices);
}
async function clearNotices() { S.notices = []; await idb.kv.set('notices', []); changed(); }

// ---------- синхронізація ----------
// Лише ці відповіді сервера означають "запис остаточно не прийнято". Усе інше (немає зв'язку,
// сесія закінчилась, збій сервера, невідома помилка) — запис лишається в черзі й відправиться пізніше.
const BUSINESS = new Set(['invalid', 'not_found', 'forbidden', 'too_late', 'archived', 'limit_exceeded', 'disabled', 'not_member', 'owner_only', 'too_many', 'conflict']);
const PER_SHOP_STOP = new Set(['subscription_expired']);
const isTransient = (e) => !(e.status === 400 && BUSINESS.has(e.code));

/** Відправити чергу. Повертає магазини, де підписка закінчилась (їхні записи чекають). */
async function push() {
  const box = (await idb.all('outbox')).filter(e => e.user_id === S.user.id).sort((a, b) => a.seq - b.seq);
  const stopped = new Set();
  let i = 0;
  while (i < box.length) {
    const e = box[i];
    if (stopped.has(e.shop_id)) { i++; continue; }
    try {
      if (e.kind === 'op') {
        const batch = [];
        while (i < box.length && box[i].kind === 'op' && box[i].shop_id === e.shop_id && batch.length < 100) batch.push(box[i++]);
        await pushOps(e.shop_id, batch);
        continue;
      }
      i++;
      try {
        if (e.kind === 'remind') await pushRemind(e);
      else if (e.kind === 'cancel') await pushCancel(e);
        else if (e.kind === 'client_create') await pushClientCreate(e);
        else if (e.kind === 'client_update') await pushClientUpdate(e);
        await idb.del('outbox', e.seq);
      } catch (err) {
        if (isTransient(err)) throw err;
        await idb.del('outbox', e.seq);
        await failEntry(e, err);
      }
    } catch (err) {
      if (PER_SHOP_STOP.has(err.code)) { stopped.add(e.shop_id); continue; }   // інші магазини синхронізуємо далі
      throw err;
    }
  }
  return stopped;
}

async function getOp(id) { return S.ops.get(id) || await idb.get('ops', id); }
async function saveOp(op) { await idb.put('ops', op); if (op.shop_id === S.shopId) S.ops.set(op.id, op); }
async function getClient(id) { return S.clients.get(id) || await idb.get('clients', id); }
async function saveClient(c) { await idb.put('clients', c); if (c.shop_id === S.shopId) S.clients.set(c.id, c); }

async function pushOps(shopId, entries) {
  const payload = [], map = new Map();
  for (const e of entries) {
    const op = await getOp(e.id);
    if (!op || !op._pending) { await idb.del('outbox', e.seq); continue; }
    map.set(op.id, e);
    payload.push({ id: op.id, client_id: op.client_id, type: op.type, amount: op.amount, note: op.note, client_at: op.client_at, over_limit: !!op.over_limit });
  }
  if (!payload.length) return;
  let res;
  try { res = await api.rpc('add_ops', { p_shop: shopId, p_ops: payload }); }
  catch (err) {
    if (isTransient(err)) throw err;
    res = payload.map(p => ({ id: p.id, ok: false, code: err.code, message: err.message }));
  }
  for (const r of res) {
    const e = map.get(r.id); if (!e) continue;
    const op = await getOp(r.id);
    if (op) {
      const upd = { ...op };
      delete upd._pending;
      if (!r.ok) {
        upd._failed = { code: r.code, message: r.message };
        const c = await getClient(op.client_id);
        await notice(`Не збережено ${op.type === 'debt' ? 'борг' : 'оплату'} ${(op.amount / 100).toLocaleString('uk-UA')} грн${c ? ' (' + c.name + ')' : ''}: ${r.message}`);
      }
      await saveOp(upd);
    }
    await idb.del('outbox', e.seq);
  }
}

async function pushRemind(e) {
  const c = await getClient(e.id);
  if (!c || !c._pendingRemind) return;
  await api.rpc('mark_reminded', { p_shop: e.shop_id, p_client: e.id });
  const upd = { ...c }; delete upd._pendingRemind; await saveClient(upd);
}

async function pushCancel(e) {
  try { await api.rpc('cancel_op', { p_shop: e.shop_id, p_id: e.id, p_reason: e.reason }); }
  catch (err) { err.entry = e; throw err; }
  const op = await getOp(e.id);
  if (op) { const upd = { ...op }; delete upd._pendingCancel; await saveOp(upd); }
}

async function pushClientCreate(e) {
  const c = await getClient(e.id);
  if (!c || !c._pending) return;
  await api.rpc('create_client', { p_shop: e.shop_id, p_id: c.id, p_name: c.name, p_phone: c.phone, p_address: c.address, p_note: c.note, p_limit: c.limit_kop, p_client_at: c.created_at });
  const upd = { ...c }; delete upd._pending; await saveClient(upd);
}

async function pushClientUpdate(e) {
  const c = await getClient(e.id);
  if (!c || !c._pendingUpdate) return;
  await api.rpc('update_client', { p_shop: e.shop_id, p_id: c.id, p_name: c.name, p_phone: c.phone, p_address: c.address, p_note: c.note, p_limit: c.limit_kop, p_archived: !!c.archived, p_expected: (c._server && c._server.updated_at) || null });
  const upd = { ...c }; delete upd._pendingUpdate; delete upd._server; await saveClient(upd);
}

async function failEntry(e, err) {
  if (e.kind === 'cancel') {
    const op = await getOp(e.id);
    if (op) { const upd = { ...op, cancelled_at: null, cancelled_by: null, cancel_reason: null }; delete upd._pendingCancel; await saveOp(upd); }
    await notice(`Не вдалося скасувати запис: ${err.message}`);
  } else if (e.kind === 'client_create') {
    const c = await getClient(e.id);
    if (c) { const upd = { ...c, _failed: { code: err.code, message: err.message } }; delete upd._pending; await saveClient(upd); }
    await notice(`Не збережено нового клієнта${c ? ' ' + c.name : ''}: ${err.message}`);
  } else if (e.kind === 'remind') {
    const c = await getClient(e.id);
    if (c) { const upd = { ...c }; delete upd._pendingRemind; await saveClient(upd); }
  } else if (e.kind === 'client_update') {
    const c = await getClient(e.id);
    if (c && c._server) await saveClient(c._server);
    await notice(`Не збережено зміни клієнта${c ? ' ' + c.name : ''}: ${err.message}`);
  }
}

async function pull(shopId) {
  let meta = (await idb.kv.get('shop:' + shopId)) || {};
  let cursor = meta.cursor || null;
  for (let round = 0; round < 100; round++) {
    const r = await api.rpc('sync_pull', { p_shop: shopId, p_cursor: cursor });
    await applyPull(shopId, r);
    cursor = r.cursor;
    if (!r.more) break;
  }
}

async function applyPull(shopId, r) {
  const current = shopId === S.shopId;
  const clients = [], ops = [];
  for (const sc of r.clients) {
    const local = current ? S.clients.get(sc.id) : await idb.get('clients', sc.id);
    let merged = local && local._pendingUpdate ? { ...local, _server: sc } : sc;
    if (local && local._pendingRemind && !sc.last_reminded_at) merged = { ...merged, last_reminded_at: local.last_reminded_at, last_reminded_by: local.last_reminded_by, _pendingRemind: true };
    clients.push(merged);
    if (current) S.clients.set(sc.id, merged);
  }
  for (const so of r.ops) {
    const local = current ? S.ops.get(so.id) : await idb.get('ops', so.id);
    const merged = local && local._pendingCancel && !so.cancelled_at ? local : so;
    ops.push(merged);
    if (current) S.ops.set(so.id, merged);
  }
  await idb.putMany('clients', clients);
  await idb.putMany('ops', ops);
  await idb.kv.set('shop:' + shopId, { shop: r.shop, members: r.members, cursor: r.cursor, at: Date.now() });
  if (current) { S.shop = r.shop; S.members = r.members; }
  changed();
}

let running = null, again = false, lastBoot = 0;
let timer = null;
function requestSync(delay = 300) {
  clearTimeout(timer);
  timer = setTimeout(() => { runSync(); }, delay);
}

async function runSync({ forceBoot = false } = {}) {
  if (!S.user) return;
  if (running) { again = true; return running; }
  running = (async () => {
    if (!navigator.onLine) { S.sync.state = 'offline'; changed(); return; }
    S.sync.state = 'syncing'; changed();
    try {
      const stopped = await push();
      if (forceBoot || stopped.size || !S.boot || Date.now() - lastBoot > 60000) { await refreshBoot(); lastBoot = Date.now(); }
      if (S.shopId) await pull(S.shopId);
      S.sync = { state: 'ok', lastOk: Date.now(), error: null };
      lsSet('zoshyt.lastSync', String(S.sync.lastOk));
      if (stopped.size) {
        const names = [...stopped].map(id => (S.boot?.shops.find(s => s.id === id) || {}).name || 'магазин').join(', ');
        const susp = [...stopped].some(id => (S.boot?.shops.find(s => s.id === id) || {}).suspended);
        S.sync = { state: 'error', lastOk: Date.now(), error: susp ? `Доступ призупинено (${names}) — записи чекають і відправляться після відновлення.` : `Підписка закінчилась (${names}) — записи чекають і відправляться після продовження.` };
      }
    } catch (e) {
      if (e.code === 'not_member') { await refreshBoot().catch(() => {}); S.sync = { state: 'ok', lastOk: Date.now(), error: null }; }
      else if (e.network || e.status >= 500) S.sync = { ...S.sync, state: 'offline', error: null };
      else if (e.auth || e.code === 'not_authenticated') { S.sync = { ...S.sync, state: 'error', error: 'Потрібно увійти знову.' }; S.authExpired = true; }
      else S.sync = { ...S.sync, state: 'error', error: e.message };
    } finally {
      await countOutbox();
      changed();
    }
  })();
  try { await running; } finally {
    running = null;
    if (again) { again = false; requestSync(50); }
  }
}

api.onAuthExpired(() => { S.authExpired = true; changed(); });

/** Онлайн-дія (налаштування, працівники тощо): виконати й одразу підтягнути зміни */
async function online(fn, args) {
  if (!navigator.onLine) throw new Error('Для цієї дії потрібен інтернет.');
  const r = await api.rpc(fn, args);
  requestSync(50);
  return r;
}

return { S, subscribe, changed, isOwner, writable, memberName, me, foreignPending, start, pendingForLogout, logout, loadShop, selectShop, refreshBoot, addOp, cancelOp, markReminded, createClient, updateClient, retryFailed, discardFailed, clearNotices, requestSync, runSync, online };
})();

M.calc = (function () {
const { DAY, ts, startOfDay } = M.util;
const { S } = M.store;
// Розрахунки: баланси клієнтів, прострочення, звіти


const counts = (o) => !o.cancelled_at && !o._failed;
let cache = { v: -1, st: null };
// клієнт, якого ще немає в підрахунку (щойно прийшов із синхронізації) — порожні цифри замість помилки
const EMPTY = Object.freeze({ bal: 0, lastPay: 0, firstDebt: 0, lastAt: 0, days: 0, pending: 0 });
class Stats extends Map { get(k) { return super.get(k) || EMPTY; } }

/** Баланс і "давність" для кожного клієнта поточного магазину */
function stats() {
  if (cache.v === S.version) return cache.st;
  const per = new Stats();
  for (const c of S.clients.values()) per.set(c.id, { bal: 0, lastPay: 0, firstDebt: 0, lastAt: 0, days: 0, pending: 0 });
  const ops = [...S.ops.values()].sort((a, b) => ts(a.client_at) - ts(b.client_at));
  for (const o of ops) {
    if (!per.has(o.client_id)) continue;
    const p = Map.prototype.get.call(per, o.client_id);
    if (o._pending || o._pendingCancel) p.pending++;
    if (!counts(o)) continue;
    const t = ts(o.client_at);
    if (o.type === 'debt') { if (p.bal <= 0) p.firstDebt = t; p.bal += o.amount; }
    else { p.bal -= o.amount; p.lastPay = t; }
    p.lastAt = t;
  }
  const now = Date.now();
  for (const p of per.values()) p.days = p.bal > 0 ? Math.max(0, Math.floor((now - Math.max(p.lastPay, p.firstDebt)) / DAY)) : 0;
  cache = { v: S.version, st: per };
  return per;
}

function balanceOf(clientId) { const p = stats().get(clientId); return p ? p.bal : 0; }

function summary() {
  const st = stats();
  let total = 0, debtors = 0, overdue = 0, overdueSum = 0;
  for (const c of S.clients.values()) {
    const p = st.get(c.id);
    if (p.bal > 0) { total += p.bal; debtors++; if (p.days >= 30) { overdue++; overdueSum += p.bal; } }
  }
  return { total, debtors, overdue, overdueSum };
}

function periodStart(period) {
  const now = Date.now();
  if (period === 'today') return startOfDay(now);
  if (period === 'week') return startOfDay(now - 6 * DAY);
  return startOfDay(now - 29 * DAY);
}

function report(period) {
  const st = stats();
  const from = periodStart(period);
  const all = [...S.ops.values()];
  const inP = all.filter(o => counts(o) && ts(o.client_at) >= from);
  const given = inP.filter(o => o.type === 'debt').reduce((s, o) => s + o.amount, 0);
  const taken = inP.filter(o => o.type === 'pay').reduce((s, o) => s + o.amount, 0);
  const cancelled = all.filter(o => o.cancelled_at && ts(o.cancelled_at) >= from).length;
  const debtors = [...S.clients.values()].filter(c => st.get(c.id).bal > 0);
  const buckets = [
    { label: 'до 7 днів', a: 0, b: 7, tone: 'ok' },
    { label: '8–30 днів', a: 8, b: 30, tone: 'ink' },
    { label: '31–60 днів', a: 31, b: 60, tone: 'warn' },
    { label: 'понад 60 днів', a: 61, b: Infinity, tone: 'bad' },
  ].map(b => {
    const cs = debtors.filter(c => st.get(c.id).days >= b.a && st.get(c.id).days <= b.b);
    return { ...b, n: cs.length, sum: cs.reduce((s, c) => s + st.get(c.id).bal, 0) };
  });
  const byStaff = new Map();
  for (const o of inP) {
    const r = byStaff.get(o.created_by) || { id: o.created_by, debt: 0, pay: 0, n: 0 };
    r[o.type] += o.amount; r.n++;
    byStaff.set(o.created_by, r);
  }
  const top = [...debtors].sort((a, b) => st.get(b.id).bal - st.get(a.id).bal).slice(0, 10);
  const longest = debtors.filter(c => st.get(c.id).days > 7).sort((a, b) => st.get(b.id).days - st.get(a.id).days || st.get(b.id).bal - st.get(a.id).bal).slice(0, 10);
  const newDebtors = new Set(inP.filter(o => o.type === 'debt').map(o => o.client_id)).size;
  const payers = new Set(inP.filter(o => o.type === 'pay').map(o => o.client_id)).size;
  const daily = [];
  for (let i = 0; i < 7; i++) {
    const d0 = startOfDay(Date.now() - i * DAY), d1 = d0 + DAY;
    const os = all.filter(o => counts(o) && ts(o.client_at) >= d0 && ts(o.client_at) < d1);
    daily.push({ d: d0, debt: os.filter(o => o.type === 'debt').reduce((s, o) => s + o.amount, 0), pay: os.filter(o => o.type === 'pay').reduce((s, o) => s + o.amount, 0) });
  }
  const sm = summary();
  return { ...sm, given, taken, cancelled, buckets, byStaff: [...byStaff.values()], top, longest, newDebtors, payers, daily };
}

return { stats, balanceOf, summary, periodStart, report };
})();

M.views_statement = (function () {
const { esc, money, fmtD, fmtPhone, copyText, downloadFile, isoDate, DAY } = M.util;
const { openModal, toast } = M.ui;
const { S } = M.store;
// Виписка боргу одного клієнта: показати, надіслати картинкою чи текстом, роздрукувати / зберегти в PDF.
// У виписці немає імен продавців і службових позначок — лише те, що стосується покупця.



const MAX_ROWS = 60;           // довша історія — «на початок» переноситься в залишок
const st = { period: 'open', clientId: null };

const PERIODS = [['open', 'Поточний борг'], ['30', '30 днів'], ['90', '3 місяці'], ['all', 'Уся історія']];

/** Записи клієнта для виписки: залишок на початок, рядки з поточним залишком, підсумок */
function buildStatement(clientId, period = 'open', now = Date.now()) {
  const c = S.clients.get(clientId);
  const ops = [...S.ops.values()]
    .filter(o => o.client_id === clientId && !o.cancelled_at && !o._failed)
    .sort((a, b) => new Date(a.client_at) - new Date(b.client_at) || String(a.id).localeCompare(String(b.id)));
  let run = 0;
  const all = ops.map(o => { run += o.type === 'debt' ? o.amount : -o.amount; return { o, after: run }; });
  const total = run;
  let start = 0;
  if (period === 'open') {
    // від моменту, коли борг востаннє був нульовим (або переплатою)
    for (let i = all.length - 1; i >= 0; i--) if (all[i].after <= 0) { start = i + 1; break; }
    if (total <= 0) start = all.findIndex(x => now - new Date(x.o.client_at) < 30 * DAY);
  } else if (period !== 'all') {
    const from = now - (+period) * DAY;
    start = all.findIndex(x => new Date(x.o.client_at).getTime() >= from);
  }
  if (start < 0) start = all.length;
  if (all.length - start > MAX_ROWS) start = all.length - MAX_ROWS;
  const rows = all.slice(start);
  const opening = start > 0 ? all[start - 1].after : 0;
  const debts = rows.filter(r => r.o.type === 'debt').reduce((s, r) => s + r.o.amount, 0);
  const pays = rows.filter(r => r.o.type === 'pay').reduce((s, r) => s + r.o.amount, 0);
  return {
    shop: S.shop?.name || '', client: c?.name || '', phone: c?.phone ? fmtPhone(c.phone) : '',
    date: now, from: rows.length ? rows[0].o.client_at : null, opening, rows, debts, pays, total, period,
  };
}

const balText = (b) => b > 0 ? money(b) : b < 0 ? 'переплата ' + money(-b) : '0 грн';
const totalLine = (s) => s.total > 0 ? `Разом винен: ${money(s.total)}` : s.total < 0 ? `Переплата: ${money(-s.total)}` : 'Боргу немає';
const opText = (o) => o.type === 'debt' ? (o.note || 'Борг') : 'Оплата' + (o.note ? ' · ' + o.note : '');

/** Текст для Viber/SMS */
function statementText(s) {
  const lines = [`Виписка${s.shop ? ' · магазин «' + s.shop + '»' : ''}`, `${s.client} · станом на ${fmtD(s.date)}`, ''];
  if (s.opening) lines.push(`Залишок на початок: ${balText(s.opening)}`);
  for (const { o } of s.rows) lines.push(`${fmtD(o.client_at).slice(0, 5)}  ${o.type === 'debt' ? '+' : '−'}${money(o.amount)}${o.note ? '  ' + o.note : o.type === 'pay' ? '  оплата' : ''}`);
  if (!s.rows.length) lines.push('За цей період записів немає.');
  lines.push('', totalLine(s));
  return lines.join('\n');
}

/** Виписка як сторінка (для перегляду і друку) */
function statementHtml(s) {
  return `<article class="stmt">
    <header><div class="stmt-shop">${esc(s.shop)}</div><h2>Виписка боргу</h2>
      <div class="stmt-who"><b>${esc(s.client)}</b>${s.phone ? ` · ${esc(s.phone)}` : ''}</div>
      <div class="small muted">станом на ${fmtD(s.date)}</div></header>
    <table><thead><tr><th>Дата</th><th>Що</th><th class="n">Сума</th><th class="n">Залишок</th></tr></thead><tbody>
      ${s.opening ? `<tr class="open"><td>${s.from ? fmtD(s.from).slice(0, 5) : ''}</td><td>Залишок на початок</td><td class="n"></td><td class="n">${esc(balText(s.opening))}</td></tr>` : ''}
      ${s.rows.map(({ o, after }) => `<tr><td>${fmtD(o.client_at).slice(0, 5)}</td><td>${esc(opText(o))}</td>
        <td class="n ${o.type === 'debt' ? 'bad' : 'ok'}">${o.type === 'debt' ? '+' : '−'}${money(o.amount)}</td><td class="n">${esc(balText(after))}</td></tr>`).join('')}
      ${s.rows.length ? '' : '<tr><td colspan="4" class="muted">За цей період записів немає.</td></tr>'}
    </tbody></table>
    <div class="stmt-total ${s.total > 0 ? 'bad' : 'ok'}">${esc(totalLine(s))}</div>
    ${s.rows.length ? `<div class="small muted">За період: взяв ${money(s.debts)}, оплатив ${money(s.pays)}</div>` : ''}
  </article>`;
}

/** Виписка картинкою (PNG): добре читається у Viber/Telegram */
async function statementPng(s) {
  const W = 720, P = 36, scale = 2, rowH = 46;
  const font = (w, px) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  const H = 230 + (s.opening ? rowH : 0) + Math.max(1, s.rows.length) * rowH + 100;
  const cv = document.createElement('canvas');
  cv.width = W * scale; cv.height = H * scale;
  const x = cv.getContext('2d'); x.scale(scale, scale);
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2140a8'; x.fillRect(0, 0, W, 8);
  const fit = (t, max) => { t = String(t); if (x.measureText(t).width <= max) return t; while (t && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; };
  let y = P + 22;
  x.fillStyle = '#5a6480'; x.font = font(600, 20); x.fillText(fit(s.shop, W - 2 * P), P, y);
  y += 40; x.fillStyle = '#17203a'; x.font = font(800, 32); x.fillText('Виписка боргу', P, y);
  y += 36; x.font = font(700, 22); x.fillText(fit(s.client + (s.phone ? ' · ' + s.phone : ''), W - 2 * P), P, y);
  y += 28; x.fillStyle = '#5a6480'; x.font = font(400, 18); x.fillText('станом на ' + fmtD(s.date), P, y);
  y += 34;
  const cols = { d: P, t: P + 80, a: W - P - 180, b: W - P };
  x.strokeStyle = '#d7deed'; x.lineWidth = 1;
  const line = (yy) => { x.beginPath(); x.moveTo(P, yy); x.lineTo(W - P, yy); x.stroke(); };
  x.font = font(700, 15); x.fillStyle = '#5a6480';
  x.fillText('ДАТА', cols.d, y); x.fillText('ЩО', cols.t, y);
  x.textAlign = 'right'; x.fillText('СУМА', cols.a, y); x.fillText('ЗАЛИШОК', cols.b, y); x.textAlign = 'left';
  y += 14; line(y);
  const row = (d, t, a, aColor, b) => {
    y += rowH - 14;
    x.font = font(400, 19); x.fillStyle = '#5a6480'; x.fillText(d, cols.d, y);
    x.fillStyle = '#17203a'; x.fillText(fit(t, cols.a - 150 - cols.t), cols.t, y);
    x.textAlign = 'right'; x.font = font(700, 19); x.fillStyle = aColor; if (a) x.fillText(a, cols.a, y);
    x.font = font(400, 19); x.fillStyle = '#17203a'; x.fillText(b, cols.b, y); x.textAlign = 'left';
    y += 14; line(y);
  };
  if (s.opening) row(s.from ? fmtD(s.from).slice(0, 5) : '', 'Залишок на початок', '', '#17203a', balText(s.opening));
  for (const { o, after } of s.rows) row(fmtD(o.client_at).slice(0, 5), opText(o), (o.type === 'debt' ? '+' : '−') + money(o.amount), o.type === 'debt' ? '#c0392b' : '#157347', balText(after));
  if (!s.rows.length) row('', 'За цей період записів немає.', '', '#17203a', '');
  y += 52; x.font = font(800, 28); x.fillStyle = s.total > 0 ? '#c0392b' : '#157347'; x.fillText(totalLine(s), P, y);
  y += 34; x.font = font(400, 16); x.fillStyle = '#8a93ab'; x.fillText('Зошит боржників', P, y);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

// латиницею: частина браузерів відкидає кириличні назви файлів
const TR = { а: 'a', б: 'b', в: 'v', г: 'h', ґ: 'g', д: 'd', е: 'e', є: 'ie', ж: 'zh', з: 'z', и: 'y', і: 'i', ї: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'shch', ь: '', ю: 'iu', я: 'ia', ы: 'y', э: 'e', ё: 'io', ъ: '' };
const latin = (t) => String(t).toLowerCase().replace(/[а-яєіїґёыэъ]/g, ch => TR[ch] ?? '');
const fileName = (s, ext) => `vyp-${latin(s.client || 'klient').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30)}-${isoDate(s.date)}.${ext}`;

/** Поділитися файлом або текстом; якщо телефон не вміє — завантажити / скопіювати */
async function shareOr(data, fallback) {
  try {
    if (navigator.share && (!data.files || (navigator.canShare && navigator.canShare(data)))) { await navigator.share(data); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  await fallback();
}

const statementActions = {
  'stmt-period': (el) => { st.period = el.dataset.v; statementModal(st.clientId); },
  'stmt-image': async () => {
    const s = buildStatement(st.clientId, st.period);
    const blob = await statementPng(s);
    if (!blob) { toast('Не вдалося створити картинку', 'bad'); return; }
    const file = new File([blob], fileName(s, 'png'), { type: 'image/png' });
    await shareOr({ files: [file], title: 'Виписка боргу' }, async () => { downloadFile(file.name, blob); toast('Картинку збережено — надішліть її у Viber'); });
  },
  'stmt-text': async () => {
    const text = statementText(buildStatement(st.clientId, st.period));
    await shareOr({ text, title: 'Виписка боргу' }, async () => { toast(await copyText(text) ? 'Текст скопійовано — вставте в чат' : 'Не вдалося скопіювати', 'ok'); });
  },
  'stmt-print': () => {
    const s = buildStatement(st.clientId, st.period);
    let area = document.getElementById('print-area');
    if (!area) { area = document.createElement('div'); area.id = 'print-area'; document.body.appendChild(area); }
    area.innerHTML = statementHtml(s) + '<div class="stmt-foot small muted">Зошит боржників</div>';
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); area.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  },
};

return { st, buildStatement, statementText, statementHtml, statementPng, statementModal, statementActions };

  if (o._pending) return true;
  const mins = S.shop?.cancel_minutes ?? 15;
  return Date.now() - new Date(o.created_at || o.client_at).getTime() < mins * 60000;
}

    ${odd ? `<div class="small muted">Було записано: ${esc(c.phone)}</div>` : ''}
    <label class="f">Адреса <span class="muted small">(необов’язково)</span><input id="c-address" value="${esc(c.address)}" placeholder="вулиця, будинок або орієнтир (напр. біля школи)" autocomplete="off" maxlength="150"></label>
    ${isOwner() ? `<label class="f">Ліміт боргу, грн (0 — без ліміту)<input id="c-limit" inputmode="decimal" value="${moneyInput(c.limit_kop || 0)}"></label>` : `<div class="small muted">Ліміт боргу: ${money(c.limit_kop || 0)} (змінює власник)</div>`}
    <label class="f">Примітка<textarea id="c-note" rows="2" maxlength="300" placeholder="Напр.: платить з пенсії 5-го числа">${esc(c.note)}</textarea></label>
    ${edit ? `<label class="check"><input type="checkbox" id="c-archived" ${c.archived ? 'checked' : ''}> Сховати в архів (історія зберігається, нові борги не записуються)</label>` : ''}
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ink" type="submit">${edit ? 'Зберегти' : 'Додати клієнта'}</button></div>
  </form>`);
}

function cancelModal(o) {
  openModal(`<form data-form="cancel" data-id="${esc(o.id)}" class="stack" novalidate>
    <h2>Скасувати запис?</h2>
    <div class="note-box">${o.type === 'debt' ? 'Борг' : 'Оплата'} ${money(o.amount)} від ${fmtDT(o.client_at)}${o.note ? ' · ' + esc(o.note) : ''}</div>
    <p class="small muted">Запис не зникне: він лишиться закресленим в історії та журналі з вашим ім’ям і причиною.</p>
    <label class="f">Причина *<input id="cancel-reason" required autofocus maxlength="200" placeholder="Помилилась у сумі" autocomplete="off"></label>
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Назад</button><button class="btn bad" type="submit">Скасувати запис</button></div>
  </form>`);
}

const DEFAULT_REMIND = 'Добрий день, {ім’я}! Нагадуємо про борг у магазині «{магазин}»: {сума}. Дякуємо!';

/** Підставляє ім’я, назву магазину й суму в шаблон нагадування */
function fillTemplate(tpl, client, bal) {
  const first = (client.name || '').trim().split(/\s+/)[0];
  return String(tpl || DEFAULT_REMIND)
    .replace(/\{(ім['’]?я|имя|name)\}/gi, first)
    .replace(/\{(магазин|shop)\}/gi, S.shop?.name || '')
    .replace(/\{(сума|борг|sum)\}/gi, money(bal));
}

function remindModal() {
  const c = S.clients.get(view.clientId); if (!c) return;
  const bal = stats().get(c.id).bal;
  const text = fillTemplate(S.shop?.remind_template, c, bal);
  const phone = cleanPhone(c.phone);
  const intl = phone.startsWith('+') ? phone : phone.startsWith('0') ? '+38' + phone : phone;
  openModal(`<div class="stack">
    <h2>Нагадування</h2>
    <label class="f">Текст повідомлення<textarea id="r-text" rows="4">${esc(text)}</textarea></label>
    <div class="m-actions start">
      <button class="btn ink" data-act="copy-remind">Копіювати</button>
      ${phone ? `<a class="btn" href="sms:${esc(intl)}?body=${encodeURIComponent(text)}">SMS</a>
        <a class="btn" href="viber://chat?number=${encodeURIComponent(intl)}">Viber</a>
        <a class="btn" href="https://t.me/${esc(intl)}" target="_blank" rel="noopener">Telegram</a>` : '<span class="small muted">Додайте телефон клієнта, щоб надіслати SMS чи Viber.</span>'}
    </div>
    <p class="small muted">У Viber і Telegram спершу скопіюйте текст, потім вставте в чат. ${isOwner() ? 'Текст можна змінити в Налаштуваннях.' : ''}</p>
    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button><button class="btn ok" data-act="remind-done" data-id="${esc(c.id)}">Нагадав(ла) — позначити</button></div>
  </div>`);
}

/** Поле пошуку з перемикачем «за номером» — тоді відкривається цифрова клавіатура */
function searchBox(id, value, byPhone, act) {
  return `<span class="search-box">
    <input id="${id}" class="search" type="${byPhone ? 'tel' : 'search'}" value="${esc(value)}" autocomplete="off"
      ${byPhone ? 'inputmode="tel" placeholder="Номер телефону"' : 'inputmode="search" placeholder="Ім’я або номер"'} aria-label="Пошук клієнта">
    <button type="button" class="icon-btn phone-toggle" data-act="${act}" aria-pressed="${byPhone}" aria-label="${byPhone ? 'Шукати за ім’ям (літери)' : 'Шукати за номером (цифрова клавіатура)'}" title="${byPhone ? 'Шукати за ім’ям' : 'Шукати за номером'}">${byPhone ? 'АБВ' : '123'}</button>
  </span>`;
}

function pickList() {
  const st = stats();
  const q = pick.q.trim();
  let cs = [...S.clients.values()].filter(c => !c.archived || pick.type === 'pay');
  if (q) cs = cs.filter(c => matchClient(c, q));
  else if (pick.type === 'pay') cs = cs.filter(c => st.get(c.id).bal > 0);
  // без пошуку — спершу ті, з ким працювали нещодавно
  cs.sort(q ? (a, b) => a.name.localeCompare(b.name, 'uk') : (a, b) => (st.get(b.id).lastAt || 0) - (st.get(a.id).lastAt || 0));
  const rows = cs.slice(0, 30).map(c => { const b = st.get(c.id).bal; return `<li class="row" data-act="pick-client" data-id="${esc(c.id)}" tabindex="0">
      <div class="who"><div class="name">${esc(c.name)}</div><div class="meta">${c.phone ? `<span>${esc(fmtPhone(c.phone))}</span>` : ''}${c.address ? `<span>${esc(c.address)}</span>` : ''}</div></div>
      <div class="sum">${b > 0 ? `<span class="amt bad">${money(b)}</span>` : '<span class="small muted">не винен</span>'}</div></li>`; }).join('');
  const add = pick.type === 'debt' && writable()
    ? `<button type="button" class="btn wide-btn" data-act="pick-new">+ Новий клієнт${q && !/^\+?[\d\s()-]+$/.test(q) ? ` «${esc(q)}»` : q ? ` з номером ${esc(q)}` : ''}</button>` : '';
  return `${!q && cs.length ? `<h3>${pick.type === 'pay' ? 'Хто винен' : 'Нещодавні'}</h3>` : ''}
    ${rows ? `<ul class="rows pick-rows">${rows}</ul>` : `<div class="empty small">${q ? 'Нікого не знайдено.' : pick.type === 'pay' ? 'Ніхто не винен.' : 'Клієнтів ще немає.'}</div>`}
    ${add}`;
}

function pickModal(type) {
  pick.type = type; pick.q = '';
  openModal(`<div class="stack pick">
    <h2>${type === 'debt' ? 'Новий борг — хто бере?' : 'Прийняти оплату — від кого?'}</h2>
    ${searchBox('pick-q', '', pick.byPhone, 'pick-phone')}
    <div id="pick-list">${pickList()}</div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button></div>
  </div>`);
}

/** Відкрити картку клієнта і одразу вікно боргу чи оплати */
function openClientOp(id, type) {
  const target = '#/client/' + id;
  if (location.hash === target) { opModal(type); return; }
  window.addEventListener('hashchange', () => setTimeout(() => opModal(type), 0), { once: true });
  go(target);
}

function togglePhone(state, inputId) {
  state.byPhone = !state.byPhone;
  const inp = document.getElementById(inputId);
  if (inp) {
    inp.setAttribute('inputmode', state.byPhone ? 'tel' : 'search');
    inp.type = state.byPhone ? 'tel' : 'search';
    inp.placeholder = state.byPhone ? 'Номер телефону' : 'Ім’я або номер';
    // iPhone міняє клавіатуру лише при новому фокусі: на мить переводимо фокус на тимчасове поле
    // з потрібним типом і одразу повертаємо — усе в межах того самого дотику, тож клавіатура не ховається
    const tmp = document.createElement('input');
    tmp.type = inp.type; tmp.setAttribute('inputmode', inp.getAttribute('inputmode'));
    tmp.setAttribute('aria-hidden', 'true'); tmp.tabIndex = -1;
    tmp.style.cssText = `position:fixed;left:0;top:${Math.max(0, inp.getBoundingClientRect().top)}px;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0`;
    document.body.appendChild(tmp);
    tmp.focus({ preventScroll: true });
    inp.focus({ preventScroll: true });
    const end = inp.value.length; try { inp.setSelectionRange(end, end); } catch { /* type=tel/search */ }
    setTimeout(() => tmp.remove(), 300);
  }
  const b = inp && inp.parentElement.querySelector('.phone-toggle');
  if (b) { b.textContent = state.byPhone ? 'АБВ' : '123'; b.setAttribute('aria-pressed', state.byPhone); b.setAttribute('aria-label', state.byPhone ? 'Шукати за ім’ям (літери)' : 'Шукати за номером (цифрова клавіатура)'); }
}

/** Підсвітити чіпи, які вже є в описі */
function syncChips() {
  const n = document.getElementById('op-note'); if (!n) return;
  const have = n.value.split(',').map(x => x.trim().toLowerCase());
  document.querySelectorAll('[data-act=quick-note]').forEach(b => b.setAttribute('aria-pressed', have.includes(b.dataset.v.toLowerCase())));
}

/** Показати крок підтвердження у вікні запису */
function ask(form, html) {
  document.getElementById('op-extra').innerHTML = html;
  const b = form.querySelector('#op-extra button');
  if (b) b.focus(); else form.querySelector('#op-extra').scrollIntoView({ block: 'nearest' });
}
function submitForm(form) {
  if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}
/** Чи можна одразу відкликати щойно зроблений запис (кнопка «Скасувати» в повідомленні) */
function undoAllowed(op) {
  if (isOwner()) return true;
  if ((S.shop?.cancel_minutes ?? 15) <= 0) return false;
  const c = S.clients.get(op.client_id);
  if (op.type === 'pay' && c && c.limit_kop && stats().get(c.id).bal + op.amount > c.limit_kop) return false;
  return true;
}
async function undo(id) {
  try { await cancelOp(id, 'Скасовано одразу після запису'); toast('Запис скасовано — він лишиться закресленим в історії'); }
  catch (e) { toast(e.message, 'bad'); }
}
// пошук у вікні вибору клієнта — оновлюємо лише список, щоб не збивати клавіатуру
document.addEventListener('input', (e) => {
  if (e.target.id === 'pick-q') { pick.q = e.target.value; const l = document.getElementById('pick-list'); if (l) l.innerHTML = pickList(); }
  if (e.target.id === 'c-phone') {   // лише цифри, не більше 10, пробіли самі
    let d = digits(e.target.value);
    if (d.startsWith('380')) d = d.slice(2);   // набрали чи вставили номер разом з «+38» — він уже стоїть зліва
    e.target.value = phoneMask(d.slice(0, 10));
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'op-note') syncChips(); });
document.addEventListener('keydown', (e) => {   // Enter у пошуку — вибрати, якщо знайшовся один
  if (e.key !== 'Enter' || e.target.id !== 'pick-q') return;
  const rows = document.querySelectorAll('#pick-list [data-act=pick-client]');
  if (rows.length === 1) { e.preventDefault(); rows[0].click(); }
});
// номер без нуля на початку (67 123 45 67) — доставляємо 0, коли людина закінчила вводити
document.addEventListener('focusout', (e) => {
  if (e.target.id !== 'c-phone') return;
  const d = digits(e.target.value);
  if (d.length === 9 && d[0] !== '0') e.target.value = phoneMask('0' + d);
});
// будь-яка зміна суми скидає підтвердження
document.addEventListener('input', (e) => {
  if (e.target.id !== 'op-amount') return;
  const x = document.getElementById('op-extra'); if (x) x.innerHTML = '';
  const f = e.target.closest('form'); if (f) { delete f.dataset.bigOk; delete f.dataset.overOk; delete f.dataset.advOk; }
});

// ---------------- дії ----------------
register({
  'list-filter': (el) => { listState.filter = el.dataset.v; view.rerender(); },
  'list-sort': (el) => { listState.sort = el.dataset.v; view.rerender(); },
  'open-client': (el) => go('#/client/' + el.dataset.id),
  'new-client': () => clientModal(null),
  pick: (el) => pickModal(el.dataset.type),
  'pick-client': (el) => { closeModal(); openClientOp(el.dataset.id, pick.type); },
  'pick-new': () => { const q = pick.q; closeModal(); clientModal(null, { then: 'debt', q }); },
  'pick-phone': () => togglePhone(pick, 'pick-q'),
  'list-phone': () => togglePhone(listState, 'q'),
  'edit-client': () => clientModal(S.clients.get(view.clientId)),
  op: (el) => opModal(el.dataset.type),
  remind: () => remindModal(),
  'copy-remind': async () => { toast(await copyText(document.getElementById('r-text').value) ? 'Скопійовано' : 'Виділіть текст і скопіюйте вручну'); },
  ...statementActions,
  statement: () => statementModal(view.clientId),
  'remind-done': async (el) => { await markReminded(el.dataset.id); closeModal(); toast('Позначено: нагадали сьогодні', 'ok'); },
  'cancel-op': (el) => { const o = S.ops.get(el.dataset.id); if (o) cancelModal(o); },
  'quick-note': (el) => {
    const n = document.getElementById('op-note');
    if (/^інше$/i.test(el.dataset.v)) { n.focus(); return; }   // «Інше» — одразу писати своє
    const parts = n.value.split(',').map(x => x.trim()).filter(Boolean);
    const i = parts.findIndex(x => x.toLowerCase() === el.dataset.v.toLowerCase());
    if (i >= 0) parts.splice(i, 1); else parts.push(parts.length ? el.dataset.v.toLowerCase() : el.dataset.v);
    if (parts.length && parts[0] === parts[0].toLowerCase()) parts[0] = parts[0][0].toUpperCase() + parts[0].slice(1);
    n.value = parts.join(', ');
    syncChips();
  },
  'op-confirm': (el) => {
    const form = el.closest('form'); if (!form) return;
    if (el.dataset.set) document.getElementById('op-amount').value = el.dataset.set;
    form.dataset[el.dataset.key] = document.getElementById('op-amount').value.trim();
    submitForm(form);
  },
  unarchive: async () => {
    const c = S.clients.get(view.clientId); if (!c) return;
    try { await updateClient(c.id, { name: c.name, phone: c.phone, address: c.address, note: c.note, limit_kop: c.limit_kop, archived: false }); toast('Клієнта повернуто з архіву', 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'fill-amount': (el) => { document.getElementById('op-amount').value = moneyInput(+el.dataset.v); },
  'retry-op': (el) => retryFailed('op', el.dataset.id),
  'discard-op': (el) => discardFailed('op', el.dataset.id),
  'retry-client': (el) => retryFailed('client', el.dataset.id),
  'discard-client': async (el) => { await discardFailed('client', el.dataset.id); go('#/list'); },
}, {
  async op(form) {
    const type = form.dataset.type;
    const c = S.clients.get(view.clientId); if (!c) return closeModal();
    const bal = stats().get(c.id).bal;
    const raw = document.getElementById('op-amount').value.trim();
    const amount = parseMoney(raw);
    const note = document.getElementById('op-note').value.trim();
    if (!(amount > 0)) return formError(form, 'Введіть суму більше нуля (напр. 85 або 85,50).');
    if (amount > 10000000) return formError(form, 'Завелика сума — перевірте, чи немає зайвих нулів.');
    formError(form, '');
    // 1) велика сума — захист від зайвого нуля
    const big = confirmOver();
    if (big > 0 && amount > big && form.dataset.bigOk !== raw) {
      return ask(form, `<div class="confirm-box warn"><span><b>Точно ${money(amount)}?</b> Перевірте, чи немає зайвого нуля.</span>
        <div class="m-actions start"><button type="button" class="btn sm ${type === 'debt' ? 'bad' : 'ok'}" data-act="op-confirm" data-key="bigOk">Так, ${money(amount)}</button></div></div>`);
    }
    // 2) ліміт клієнта
    let over = false;
    if (type === 'debt' && c.limit_kop && bal + amount > c.limit_kop) {
      const excess = bal + amount - c.limit_kop;
      if (!isOwner()) {
        return ask(form, `<div class="confirm-box warn"><span>Перевищено ліміт ${money(c.limit_kop)} на <b class="nobr">${money(excess)}.</b> Можна ще <span class="nobr">${money(Math.max(0, c.limit_kop - bal))}.</span> Більше — лише з дозволу власника.</span></div>`);
      }
      if (form.dataset.overOk !== raw) {
        return ask(form, `<div class="confirm-box warn"><span>Борг стане <b class="nobr">${money(bal + amount)}</b> — на <b class="nobr">${money(excess)}</b> більше ліміту <span class="nobr">${money(c.limit_kop)}.</span></span>
          <div class="m-actions start"><button type="button" class="btn sm bad" data-act="op-confirm" data-key="overOk">Все одно записати</button></div></div>`);
      }
      over = true;
    }
    // 3) оплата більша за борг — аванс або лише борг
    if (type === 'pay' && bal > 0 && amount > bal && form.dataset.advOk !== raw) {
      return ask(form, `<div class="confirm-box info"><span>Оплата більша за борг на <b>${money(amount - bal)}</b>.</span>
        <div class="m-actions start">
          <button type="button" class="btn sm ok" data-act="op-confirm" data-key="advOk">Записати ${money(amount)} (${money(amount - bal)} — аванс)</button>
          <button type="button" class="btn sm" data-act="op-confirm" data-key="advOk" data-set="${moneyInput(bal)}">Лише борг: ${money(bal)}</button>
        </div></div>`);
    }
    await busy(form, async () => {
      try {
        const op = await addOp({ client_id: c.id, type, amount, note, over_limit: over });
        closeModal();
        if (navigator.vibrate) try { navigator.vibrate(30); } catch { /* */ }
        const first = c.name.split(/\s+/)[0];
        toast(type === 'debt' ? `Записано борг ${money(amount)} — ${first}` : `Прийнято ${money(amount)} — ${first}`, 'ok',
          undoAllowed(op) ? { action: { label: 'Скасувати', fn: () => undo(op.id) }, ms: 5000 } : {});
      } catch (e) { formError(form, e.message); }
    });
  },
  async client(form) {
    const id = form.dataset.id;
    const name = document.getElementById('c-name').value.trim().replace(/\s+/g, ' ');
    if (!name) return formError(form, 'Вкажіть ім’я.');
    let typed = digits(document.getElementById('c-phone').value);
    if (typed.length === 9 && typed[0] !== '0') typed = '0' + typed;
    if (typed && !/^0\d{9}$/.test(typed)) return formError(form, 'Номер телефону — 10 цифр після +38, напр. 067 123 45 67. Або залиште поле порожнім.');
    const phone = storePhone(typed);
    const address = document.getElementById('c-address').value.trim().replace(/\s+/g, ' ');
    if (address) {
      const bare = address.toLowerCase().replace(/[\s.,-]/g, '');
      if (address.length < 2) return formError(form, 'Адреса закоротка. Вкажіть вулицю, будинок або орієнтир — або залиште порожнім.');
      if (/^(.)\1+$/u.test(bare) || !/[\p{L}\d]/u.test(bare)) return formError(form, 'Схоже на випадковий текст. Вкажіть вулицю, будинок або орієнтир (напр. біля школи) — або залиште порожнім.');
    }
    let limit = id ? S.clients.get(id).limit_kop : (S.shop?.default_limit ?? 0);
    if (isOwner()) {
      limit = parseMoney(document.getElementById('c-limit').value || '0');
      if (!(limit >= 0)) return formError(form, 'Ліміт має бути числом, напр. 2000.');
    }
    if (!id && !form.dataset.dupOk) {
      const dup = [...S.clients.values()].find(c => c.name.toLowerCase() === name.toLowerCase() || (phone && digits(c.phone).length >= 9 && digits(c.phone).slice(-9) === digits(phone).slice(-9)));
      if (dup) { form.dataset.dupOk = '1'; return formError(form, `Схожий клієнт уже є: ${dup.name}${dup.phone ? ', ' + fmtPhone(dup.phone) : ''}. Натисніть ще раз, якщо це інша людина.`); }
    }
    const data = { name, phone, address, note: document.getElementById('c-note').value.trim(), limit_kop: limit };
    await busy(form, async () => {
      try {
        if (id) {
          data.archived = document.getElementById('c-archived').checked;
          await updateClient(id, data); closeModal(); toast('Збережено', 'ok');
        } else {
          const c = await createClient(data); closeModal(); listState.q = ''; pick.q = '';
          toast('Клієнта додано', 'ok');
          if (form.dataset.then) openClientOp(c.id, form.dataset.then); else go('#/client/' + c.id);
        }
      } catch (e) { formError(form, e.message); }
    });
  },
  async cancel(form) {
    const reason = document.getElementById('cancel-reason').value.trim();
    if (!reason) return formError(form, 'Вкажіть причину.');
    const o = S.ops.get(form.dataset.id);
    const c = o && S.clients.get(o.client_id);
    if (o && c && !isOwner() && o.type === 'pay' && c.limit_kop && stats().get(c.id).bal + o.amount > c.limit_kop) {

const num = (k) => (k / 100).toFixed(2).replace('.', ',');

function exportOps() {

M.views_journal = (function () {
const { esc, money, fmtDT, fmtD } = M.util;
const { register, icon } = M.ui;
const { S, isOwner, memberName } = M.store;
const api = M.api;
const { view } = M.router;
// Журнал: хто, коли і що записав або змінив





const js = { who: 'all', kind: 'ops', audit: null, auditShop: null, loading: false, error: null };

async function loadAudit() {
  if (js.loading || !isOwner()) return;
  js.loading = true; js.error = null;
  try { js.audit = await api.rpc('get_audit', { p_shop: S.shopId, p_limit: 500 }); js.auditShop = S.shopId; }
  catch (e) { js.error = e.network ? 'Зміни налаштувань і клієнтів підвантажуються з інтернету — зараз зв’язку немає.' : e.message; }
  finally { js.loading = false; view.rerender(); }
}

const FIELD = { name: 'ім’я', phone: 'телефон', address: 'адреса', note: 'примітка', limit_kop: 'ліміт', archived: 'архів',
  default_limit: 'стандартний ліміт', cancel_minutes: 'час на скасування', paid_until: 'підписка до', trial_until: 'пробний період до',
  role: 'роль', active: 'доступ', display_name: 'ім’я' };
function fmtVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'limit_kop' || k === 'default_limit') return money(+v);
  if (k === 'archived') return v ? 'так' : 'ні';
  if (k === 'active') return v ? 'увімкнено' : 'вимкнено';
  if (k === 'role') return v === 'owner' ? 'власник' : 'продавець';
  if (k === 'paid_until' || k === 'trial_until') return fmtD(v);
  if (k === 'cancel_minutes') return v + ' хв';
  return String(v);
}
function changes(d) {
  return Object.entries(d).filter(([k]) => FIELD[k]).map(([k, v]) => `${FIELD[k]}: ${fmtVal(k, v.old)} → ${fmtVal(k, v.new)}`).join('; ');
}
function describe(a) {
  const d = a.details || {};
  const cname = (id) => (S.clients.get(id) || {}).name || d.name?.new || d.name || 'клієнт';
  switch (a.action) {
    case 'insert:shops': return 'Створив магазин';
    case 'update:shops': return 'Змінив налаштування магазину: ' + changes(d);
    case 'insert:members': return `Новий працівник: ${d.display_name} (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:members': return `Змінено працівника ${memberName(a.entity_id)}: ${changes(d)}`;
    case 'insert:clients': return `Додав клієнта ${d.name}${d.limit_kop ? ', ліміт ' + money(d.limit_kop) : ''}`;
    case 'update:clients': return `Змінив клієнта ${cname(a.entity_id)}: ${changes(d)}`;
    case 'insert:invites': return `Створив код запрошення ${fmtCode(a.entity_id)} (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:invites': return d.used_by ? `${memberName(d.used_by.new)} приєднується за кодом ${fmtCode(a.entity_id)}` : d.revoked_at ? `Код ${fmtCode(a.entity_id)} скасовано` : 'Змінено запрошення';
    default: return null;
  }
}

const fmtCode = (c) => (c && c.length === 8 ? c.slice(0, 4) + '-' + c.slice(4) : c || '');
// службові події (коди, налаштування) — показуємо сірим і дрібніше
const TECH = /^(insert|update):(invites|shops|members|quarantine)$/;

function events() {
  const ev = [];
  for (const o of S.ops.values()) {
    if (o._failed) continue;
    const cn = (S.clients.get(o.client_id) || {}).name || '—';
    ev.push({ at: o.client_at, by: o.created_by, kind: o.type, text: `${o.type === 'debt' ? 'Записав борг' : 'Прийняв оплату'} ${money(o.amount)} · ${cn}${o.note ? ' · ' + o.note : ''}`, cid: o.client_id, pending: o._pending });
    if (o.cancelled_at) ev.push({ at: o.cancelled_at, by: o.cancelled_by, kind: 'cancel', text: `Скасував ${o.type === 'debt' ? 'борг' : 'оплату'} ${money(o.amount)} · ${cn} · причина: ${o.cancel_reason}`, cid: o.client_id, pending: o._pendingCancel });
  }
  if (isOwner() && js.audit && js.auditShop === S.shopId) {
    for (const a of js.audit) {
      if (a.action === 'update:ops') continue;
      const text = describe(a); if (!text) continue;
      ev.push({ at: a.at, by: a.user_id, kind: 'change', text, tech: TECH.test(a.action), cid: a.action.endsWith(':clients') ? a.entity_id : null });
    }
  }
  return ev.sort((a, b) => new Date(b.at) - new Date(a.at));
}

function journalView() {
  if (isOwner() && (js.auditShop !== S.shopId || !js.audit) && !js.loading && !js.error && navigator.onLine) loadAudit();
  let ev = events();
  if (!isOwner()) ev = ev.filter(e => e.by === S.user.id);
  else if (js.who !== 'all') ev = ev.filter(e => e.by === js.who);
  if (isOwner() && js.kind !== 'all') ev = ev.filter(e => (js.kind === 'change' ? e.kind === 'change' : js.kind === 'cancel' ? e.kind === 'cancel' : e.kind === 'debt' || e.kind === 'pay' || e.kind === 'cancel'));
  const chip = (k) => k === 'debt' ? '<span class="chip bad">борг</span>' : k === 'pay' ? '<span class="chip ok">оплата</span>' : k === 'cancel' ? '<span class="chip warn">скасування</span>' : '<span class="chip ink">зміни</span>';
  return `
  ${isOwner() ? `<div class="toolbar">
      <label class="inline">Хто: <select id="j-who">${['all', ...S.members.map(m => m.user_id)].map(id => `<option value="${esc(id)}" ${js.who === id ? 'selected' : ''}>${id === 'all' ? 'Усі' : esc(memberName(id))}</option>`).join('')}</select></label>
      <label class="inline">Що: <select id="j-kind">${[['ops', 'Борги й оплати'], ['cancel', 'Скасування'], ['change', 'Зміни клієнтів і налаштувань'], ['all', 'Усе']].map(([k, l]) => `<option value="${k}" ${js.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${js.loading ? '<span class="small muted">Завантаження змін…</span>' : `<button class="icon-btn" data-act="reload-audit" aria-label="Оновити журнал" title="Оновити">${icon.refresh}</button>`}
    </div>
    ${js.error ? `<div class="banner warn">${esc(js.error)}</div>` : ''}
    <p class="small muted">Записи не видаляються: скасовані лишаються в журналі з причиною та іменем.</p>`
    : `<p class="small muted">Тут усе, що записали ви. Свій запис можна скасувати протягом ${S.shop?.cancel_minutes ?? 15} хв.</p>`}
  <section class="sheet">
    ${ev.length ? `<ul class="hist log">${ev.slice(0, 500).map(e => `<li class="${e.tech ? 'tech' : ''} ${e.cid && S.clients.has(e.cid) ? 'click' : ''}" ${e.cid && S.clients.has(e.cid) ? `data-act="open-client" data-id="${esc(e.cid)}"` : ''}><div class="d">${fmtDT(e.at)}</div><div class="t">${chip(e.kind)} ${esc(e.text)}<div class="by">${esc(memberName(e.by))}${e.pending ? ' · не відправлено' : ''}</div></div></li>`).join('')}</ul>${ev.length > 500 ? '<div class="empty small">Показано останні 500. Повний список — у вивантаженні Excel.</div>' : ''}`
      : '<div class="empty">Записів немає.</div>'}
  </section>`;
}

register({
  'reload-audit': () => { js.audit = null; js.error = null; loadAudit(); },
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'j-who') { js.who = e.target.value; view.rerender(); }
  if (e.target.id === 'j-kind') { js.kind = e.target.value; view.rerender(); }
});

return { journalView };
})();

  return { until, left, trial, writable: shop.writable !== false };
}

const grn = (n) => Math.round(n).toLocaleString('uk-UA') + ' грн';

/** Блок «Підписка»: компактно, реальні реквізити з config.js, кнопки копіювання й зв'язку */
// Дані підписки з сервера (ціна зі знижками, історія). Без інтернету — ціни з налаштувань.
const bill = { shop: null, data: null, loading: null, promoOpen: false, promoErr: '' };
async function loadBilling(force = false) {
  const id = S.shopId;                       // для якого магазину просимо — під ним і зберігаємо відповідь
  if (!navigator.onLine || !id || !isOwner() || bill.loading === id) return;
  // свіже щохвилини: власник побачить «Оплату отримали», щойно адмін підтвердить
  if (!force && bill.shop === id && Date.now() - (bill.at || 0) < 60000) return;
  if (bill.shop !== id) { bill.promoOpen = false; bill.promoErr = ''; }
  bill.loading = id;
  let data = null;
  try { data = await api.rpc('my_billing', { p_shop: id }); } catch { data = null; }
  if (bill.loading === id) bill.loading = null;
  if (S.shopId !== id) return;               // поки чекали — перемкнули магазин: ця відповідь уже не потрібна
  bill.data = data || (bill.shop === id ? bill.data : null); bill.shop = id; bill.at = Date.now();
  view.rerender();
}

  const d = c.discount; if (!d) return '';

  return `<span class="chip ok">${esc(d.message || ('Ваша знижка ' + v))}${d.ends_at ? ' до ' + fmtD(d.ends_at) : ''}</span>`;
}

function histRow(h) {
  const d = fmtD(h.at);
  const line = (chip, cls, what, right) => `<li class="row"><div class="who"><div class="name"><span class="chip ${cls}">${chip}</span> ${what}</div><div class="meta"><span>${d}</span></div></div><div class="sum"><span class="small muted">${right}</span></div></li>`;
  if (h.kind === 'payment') return line('оплата', 'ok', `<b>${money(h.amount_kop)}</b>`, 'до ' + fmtD(h.until));
  if (h.kind === 'bonus') return line('бонус', 'ok', `+${h.days} ${plural(h.days, 'день', 'дні', 'днів')}${h.reason ? ` <span class="muted">· ${esc(h.reason)}</span>` : ''}`, 'до ' + fmtD(h.until));
  if (h.kind === 'trial') return line('пробний', '', `+${h.days} ${plural(h.days, 'день', 'дні', 'днів')}`, 'до ' + fmtD(h.until));
  if (h.kind === 'free') return line('безкоштовно', 'ok', new Date(h.until).getFullYear() > 2090 ? 'назавжди' : h.days === 0 && new Date(h.until) <= new Date(h.at) ? 'завершено' : 'до ' + fmtD(h.until), '');
  return '';
}

/** Стан повідомлення «Я оплатив(ла)»: перевіряємо / підтверджено / не знайшли */
const PERIOD_TXT = { month: 'місяць', year: 'рік' };
function claimBox(c) {
  if (!c) return '';
  const what = `<b>${money(c.amount_kop)}</b> за ${PERIOD_TXT[c.period] || ''}`;
  if (c.status === 'pending') return `<div class="confirm-box info claim-box" data-claim="pending">
      <span>Ви повідомили про оплату ${what} ${fmtDT(c.created_at)}. Перевіряємо — зазвичай протягом дня, доступ продовжиться сам.</span>
      <button class="btn sm ghost" data-act="claim-cancel">Скасувати повідомлення</button></div>`;
  if (c.status === 'rejected') return `<div class="confirm-box bad claim-box" data-claim="rejected">
      <span>Оплату ${what} від ${fmtD(c.created_at)} не підтвердили: <b>${esc(c.reason || '')}</b>. Перевірте платіж і повідомте ще раз або напишіть нам.</span></div>`;
  if (c.status === 'confirmed' && Date.now() - new Date(c.decided_at) < 7 * DAY) return `<div class="confirm-box ok-box claim-box" data-claim="confirmed"><span>✓ Оплату ${what} отримали. Дякуємо!</span></div>`;
  return '';
}

function filtered() {
  const q = as.q.trim().toLowerCase();
  let list = as.shops.filter(s => as.filter === 'deleted' ? s.deleted_at : !s.deleted_at);
  // «№ 482 915», «#482915», «482915» — пошук за номером магазину (з коментаря до оплати)
  const num = /^[№#\s\d-]+$/.test(q) ? q.replace(/\D/g, '') : '';
  if (num) list = list.filter(s => String(s.code || '').startsWith(num));
  else if (q) list = list.filter(s => [s.name, s.owner_email, s.owner_name, s.id].some(v => String(v || '').toLowerCase().includes(q)));
  const f = as.filter;
  if (['trial', 'paid', 'bonus', 'expired', 'free', 'suspended'].includes(f)) list = list.filter(s => s.status === f);
  if (f === 'soon') list = list.filter(s => leftDays(s) > 0 && leftDays(s) <= 7 && s.status !== 'free');
  if (f === 'discount') list = list.filter(s => s.has_discount);
  const by = { new: (a, b) => new Date(b.created_at) - new Date(a.created_at), ending: (a, b) => new Date(a.access_until) - new Date(b.access_until),
    active: (a, b) => b.ops7 - a.ops7, revenue: (a, b) => b.revenue_kop - a.revenue_kop,
    seen: (a, b) => new Date(b.last_seen || 0) - new Date(a.last_seen || 0), staff: (a, b) => b.members - a.members };
  return list.sort(by[as.sort] || by.new);
}

/** Зрозуміла назва джерела: google.com → Google, порожньо → «Напряму» */
const SRC_NAMES = [[/google\./, 'Google'], [/facebook|^fb$/, 'Facebook'], [/instagram|^ig$/, 'Instagram'], [/t\.me|telegram|^tg$/, 'Telegram'],
  [/viber/, 'Viber'], [/youtube|youtu\.be/, 'YouTube'], [/tiktok/, 'TikTok'], [/olx/, 'OLX'], [/bing\./, 'Bing'], [/duckduckgo/, 'DuckDuckGo'], [/prom\.ua/, 'Prom'], [/^qr$/, 'QR-код']];
function srcName(v) {
  const x = String(v || '').toLowerCase();
  if (!x) return 'Напряму';
  if (x === 'сайт') return 'Сайт (без мітки)';
  for (const [re, n] of SRC_NAMES) if (re.test(x)) return n;
  return x.replace(/^www\./, '');
}
function sourceText(src) {
  if (!src) return '—';
  const parts = [];
  if (src.utm_source || src.ref) parts.push(srcName(src.utm_source || src.ref));
  if (src.utm_campaign) parts.push('кампанія «' + src.utm_campaign + '»');
  if (src.landing) parts.push('через сайт');
  return parts.length ? parts.join(' · ') : '—';
}

  const [l, c] = kinds[p.kind] || [p.kind, ''];
  const what = p.kind === 'payment' ? `<b>${money(+p.amount_kop)}</b> · ${METHOD[p.method] || 'спосіб не вказано'}${p.period === 'year' ? ' · рік' : p.period === 'month' ? ' · місяць' : ''}`
    : p.kind === 'free' ? (p.note || (new Date(p.paid_until_after).getFullYear() > 2090 ? 'назавжди' : 'до ' + fmtD(p.paid_until_after)))
    : `+${p.days} ${plural(p.days, 'день', 'дні', 'днів')}`;
  return `<li class="row"><div class="who"><div class="name"><span class="chip ${c}">${l}</span> ${what}</div>
    <div class="meta"><span>${fmtDT(p.created_at)}</span>${p.reason ? `<span>${esc(p.reason)}</span>` : ''}${p.note && p.kind !== 'free' ? `<span>${esc(p.note)}</span>` : ''}${p.shop_name ? `<span>${esc(p.shop_name)}</span>` : ''}<span>${esc(p.by_email || '')}</span></div></div>

function payments(d) {
  const real = d.payments.filter(p => p.kind === 'payment');
  return `<p>Отримано всього: <b class="txt-ok">${money(real.reduce((x, p) => x + +p.amount_kop, 0))}</b> · оплат: ${real.length}</p>
  <section class="sheet">${d.payments.length ? `<ul class="rows">${d.payments.map(payRow).join('')}</ul>` : '<div class="empty">Ще нічого не було.</div>'}</section>`;
}

function discRow(x, withShop = false) {
  const st = x.active ? '<span class="chip ok">діє</span>' : x.cancelled_at ? '<span class="chip">скасовано</span>' : '<span class="chip">закінчилась</span>';
  return `<li class="row"><div class="who"><div class="name">${discText(x)} ${st}${withShop ? ` · ${esc(x.shop_name)}` : ''}</div>
    <div class="meta"><span>${fmtD(x.created_at)}</span><span>${esc(x.reason)}</span>${x.message ? `<span>«${esc(x.message)}»</span>` : ''}<span>${x.applies_to === 'both' ? 'місяць і рік' : x.applies_to === 'month' ? 'місяць' : 'рік'}</span><span>${esc(x.by_email || (x.source === 'promo' ? 'промокод' : ''))}</span></div></div>
    <div class="sum">${x.active ? `<button class="btn sm" data-act="adm-cancel-disc" data-id="${x.id}">Скасувати</button>` : ''}</div></li>`;
}

function discounts(d) {
  const bon = d.payments.filter(p => p.kind !== 'payment');
  return `<section class="sheet"><div class="pad pb0"><h2>Знижки</h2></div>
    ${d.discounts.length ? `<ul class="rows">${d.discounts.map(x => discRow(x)).join('')}</ul>` : '<div class="empty small">Знижок не було.</div>'}</section>
  <section class="sheet"><div class="pad pb0"><h2>Бонуси й безкоштовні дні</h2></div>
    ${bon.length ? `<ul class="rows">${bon.map(payRow).join('')}</ul>` : '<div class="empty small">Бонусів не було.</div>'}</section>`;
}

function activity(d) {
  const a = d.activity, max = Math.max(1, ...a.days.map(x => x.n));
  const total = a.days.reduce((x, y) => x + y.n, 0);
  return `<section class="sheet pad stack">
    <dl class="kv"><dt>Клієнтів</dt><dd>${a.clients}</dd><dt>Записів усього</dt><dd>${a.ops}</dd><dt>Остання дія</dt><dd>${a.last ? fmtDT(a.last) : '—'}</dd><dt>Працівників</dt><dd>${d.members.filter(m => m.active).length}</dd></dl>
    <h2>Записи за 30 днів — ${total}</h2>
    <div class="spark" role="img" aria-label="Записи по днях за 30 днів, усього ${total}">
      ${a.days.map(x => `<span class="bar" style="height:${Math.max(2, Math.round(x.n / max * 100))}%" title="${fmtD(x.d)}: ${x.n} ${plural(x.n, 'запис', 'записи', 'записів')}"><i class="sr">${fmtD(x.d)}: ${x.n}</i></span>`).join('')}
    </div>
    <div class="row-between small muted"><span>${fmtD(a.days[0].d).slice(0, 5)}</span><span>сьогодні</span></div>
    <p class="small muted">Імена й борги клієнтів магазину тут не показуються.</p>
  </section>`;
}

function staff(d) {
  return `<section class="sheet"><ul class="rows">${d.members.map(m => `<li class="row"><div class="who"><div class="name">${esc(m.name)} ${m.active ? '' : '<span class="chip warn">вимкнено</span>'}</div>
    <div class="meta"><span>${m.role === 'owner' ? 'власник' : 'продавець'}</span><span>${esc(m.email || '')}</span><span>з ${fmtD(m.since)}</span></div></div>
    <div class="sum"><span class="small muted">${m.last_sign_in ? 'вхід ' + fmtD(m.last_sign_in) : ''}</span></div></li>`).join('')}</ul></section>`;
}

function danger(d) {
  const s = d.shop;
  if (s.deleted_at) {
    const from = new Date(new Date(s.deleted_at).getTime() + PURGE_DAYS * DAY), can = Date.now() >= from.getTime();
    return `<section class="sheet pad stack">
      <div class="banner warn">Видалено ${fmtD(s.deleted_at)}. Працівники магазин не бачать, але дані на місці.</div>
      <div class="actions"><button class="btn ok" data-act="admin-restore">Відновити магазин</button><button class="btn" data-act="admin-export">Вивантажити копію</button></div>
      <h3>Видалити остаточно</h3>
      <p class="small">${can ? 'Незворотно: клієнти, борги й журнал зникнуть назавжди.' : `Остаточно видалити можна з <b>${fmtD(from)}</b>. До того магазин можна відновити.`}</p>
      <label class="f">Назва магазину<input id="ax-purge-name" autocomplete="off" ${can ? '' : 'disabled'}></label>
      <button class="btn bad" data-act="admin-purge" ${can ? '' : 'disabled'}>Видалити назавжди</button></section>`;
  }
  return `<section class="sheet pad stack">
    <h2>Копія даних</h2><button class="btn" data-act="admin-export">Вивантажити копію (JSON)</button>
    <h2>Видалити магазин</h2>
    <p class="small">Лише на письмовий запит власника. Магазин зникне в усіх працівників, але <b>${PURGE_DAYS} днів його можна відновити</b>.</p>
    <p class="small"><b>Крок 1.</b> Збережіть копію кнопкою вище. <b>Крок 2.</b> Введіть точну назву.</p>
    <label class="f">Назва магазину<input id="ax-del-name" autocomplete="off" disabled placeholder="спершу крок 1"></label>
    <button class="btn bad" data-act="admin-delete" disabled>Видалити (можна відновити ${PURGE_DAYS} днів)</button></section>`;
}

function remindText() {
  const s = sp.data.shop, owner = sp.data.members.find(m => m.role === 'owner') || {};
  const l = leftDays(s);
  const lines = [`Вітаю${owner.name ? ', ' + owner.name : ''}!`,
    l > 0 ? `Підписка «Зошит боржників» для магазину «${s.name}» закінчується ${fmtD(s.access_until)} — через ${days(l)}.`
          : `Підписка «Зошит боржників» для магазину «${s.name}» закінчилась ${fmtD(s.access_until)}. Дані збережені, записувати нові можна після оплати.`,
    `Вартість: ${money(sp.data.month.final)} на місяць або ${money(sp.data.year.final)} на рік.`];
  if (CFG.payLink) lines.push(`Оплатити карткою: ${CFG.payLink}`);
  if (CFG.payCard) lines.push(`Картка: ${fmtCard(CFG.payCard)}${CFG.payRecipient ? ' (' + CFG.payRecipient + ')' : ''}`);
  if (CFG.payIban) lines.push(`IBAN: ${CFG.payIban}`);
  lines.push(s.code ? `Коментар до платежу: Зошит боржників №${s.code}` : `Коментар до платежу: Зошит боржників, магазин «${s.name}».`);
  return lines.join('\n');
}

// спершу перечитуємо дані, потім повідомлення — щоб на екрані вже були нові цифри
async function after(msg) { sp.form = null; as.shops = null; await loadShop(sp.id); toast(msg, 'ok'); }

      .concat(filtered().map(s => [s.code || '', s.name, s.owner_name, s.owner_email, (STATUS[s.status] || [s.status])[0], s.plan_name, fmtD(s.access_until),

      <h2>Підтвердити оплату</h2>

      <label class="f">Отримана сума, грн<input id="claim-ok-amount" inputmode="decimal" value="${moneyInput(+el.dataset.amount || 0)}"></label>
