  [...S.clients.values()].sort((a, b) => st.get(b.id).bal - st.get(a.id).bal)
    .forEach(c => rows.push([c.name, c.phone, c.address, num(st.get(c.id).bal), num(c.limit_kop || 0), st.get(c.id).days, c.note, c.archived ? 'так' : '']));
  downloadFile(`borzhnyky-${shopSlug()}-${isoDate()}.csv`, csv(rows), 'text/csv;charset=utf-8');
}
function exportOps() {
  const rows = [['Дата', 'Клієнт', 'Тип', 'Сума, грн', 'Що/коментар', 'Записав', 'Надійшло на сервер', 'Скасовано', 'Причина скасування', 'Хто скасував']];

    dt(o.created_at), o.cancelled_at ? dt(o.cancelled_at) : '', o.cancel_reason || '', o.cancelled_by ? memberName(o.cancelled_by) : '']));

function exportJson() {

M.views_journal = (function () {
const { esc, money, fmtDT, fmtD } = M.util;
const { register, icon } = M.ui;
const { S, isOwner, memberName } = M.store;
const api = M.api;
const { view } = M.router;
// Журнал: хто, коли і що записав або змінив





const js = { who: 'all', kind: 'ops', audit: null, auditShop: null, loading: false, error: null };

async function loadAudit() {
  if (js.loading || !isOwner()) return;
  js.loading = true; js.error = null;
  try { js.audit = await api.rpc('get_audit', { p_shop: S.shopId, p_limit: 500 }); js.auditShop = S.shopId; }
  catch (e) { js.error = e.network ? 'Зміни налаштувань і клієнтів підвантажуються з інтернету — зараз зв’язку немає.' : e.message; }
  finally { js.loading = false; view.rerender(); }
}

const FIELD = { name: 'ім’я', phone: 'телефон', address: 'адреса', note: 'примітка', limit_kop: 'ліміт', archived: 'архів',
  default_limit: 'стандартний ліміт', cancel_minutes: 'час на скасування', paid_until: 'підписка до', trial_until: 'пробний період до',
  role: 'роль', active: 'доступ', display_name: 'ім’я' };
function fmtVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'limit_kop' || k === 'default_limit') return money(+v);
  if (k === 'archived') return v ? 'так' : 'ні';
  if (k === 'active') return v ? 'увімкнено' : 'вимкнено';
  if (k === 'role') return v === 'owner' ? 'власник' : 'продавець';
  if (k === 'paid_until' || k === 'trial_until') return fmtD(v);
  if (k === 'cancel_minutes') return v + ' хв';
  return String(v);
}
function changes(d) {
  return Object.entries(d).filter(([k]) => FIELD[k]).map(([k, v]) => `${FIELD[k]}: ${fmtVal(k, v.old)} → ${fmtVal(k, v.new)}`).join('; ');
}
function describe(a) {
  const d = a.details || {};
  const cname = (id) => (S.clients.get(id) || {}).name || d.name?.new || d.name || 'клієнт';
  switch (a.action) {
    case 'insert:shops': return 'Створив магазин';
    case 'update:shops': return 'Змінив налаштування магазину: ' + changes(d);
    case 'insert:members': return `Новий працівник: ${d.display_name} (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:members': return `Змінено працівника ${memberName(a.entity_id)}: ${changes(d)}`;
    case 'insert:clients': return `Додав клієнта ${d.name}${d.limit_kop ? ', ліміт ' + money(d.limit_kop) : ''}`;
    case 'update:clients': return `Змінив клієнта ${cname(a.entity_id)}: ${changes(d)}`;
    case 'insert:invites': return `Створив код запрошення ${fmtCode(a.entity_id)} (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:invites': return d.used_by ? `${memberName(d.used_by.new)} приєднується за кодом ${fmtCode(a.entity_id)}` : d.revoked_at ? `Код ${fmtCode(a.entity_id)} скасовано` : 'Змінено запрошення';
    default: return null;
  }
}

const fmtCode = (c) => (c && c.length === 8 ? c.slice(0, 4) + '-' + c.slice(4) : c || '');
// службові події (коди, налаштування) — показуємо сірим і дрібніше
const TECH = /^(insert|update):(invites|shops|members|quarantine)$/;

function events() {
  const ev = [];
  for (const o of S.ops.values()) {
    if (o._failed) continue;
    const cn = (S.clients.get(o.client_id) || {}).name || '—';
    ev.push({ at: o.client_at, by: o.created_by, kind: o.type, text: `${o.type === 'debt' ? 'Записав борг' : 'Прийняв оплату'} ${money(o.amount)} · ${cn}${o.note ? ' · ' + o.note : ''}`, cid: o.client_id, pending: o._pending });
    if (o.cancelled_at) ev.push({ at: o.cancelled_at, by: o.cancelled_by, kind: 'cancel', text: `Скасував ${o.type === 'debt' ? 'борг' : 'оплату'} ${money(o.amount)} · ${cn} · причина: ${o.cancel_reason}`, cid: o.client_id, pending: o._pendingCancel });
  }
  if (isOwner() && js.audit && js.auditShop === S.shopId) {
    for (const a of js.audit) {
      if (a.action === 'update:ops') continue;
      const text = describe(a); if (!text) continue;
      ev.push({ at: a.at, by: a.user_id, kind: 'change', text, tech: TECH.test(a.action), cid: a.action.endsWith(':clients') ? a.entity_id : null });
    }
  }
  return ev.sort((a, b) => new Date(b.at) - new Date(a.at));
}

function journalView() {
  if (isOwner() && (js.auditShop !== S.shopId || !js.audit) && !js.loading && !js.error && navigator.onLine) loadAudit();
  let ev = events();
  if (!isOwner()) ev = ev.filter(e => e.by === S.user.id);
  else if (js.who !== 'all') ev = ev.filter(e => e.by === js.who);
  if (isOwner() && js.kind !== 'all') ev = ev.filter(e => (js.kind === 'change' ? e.kind === 'change' : js.kind === 'cancel' ? e.kind === 'cancel' : e.kind === 'debt' || e.kind === 'pay' || e.kind === 'cancel'));
  const chip = (k) => k === 'debt' ? '<span class="chip bad">борг</span>' : k === 'pay' ? '<span class="chip ok">оплата</span>' : k === 'cancel' ? '<span class="chip warn">скасування</span>' : '<span class="chip ink">зміни</span>';
  return `
  ${isOwner() ? `<div class="toolbar">
      <label class="inline">Хто: <select id="j-who">${['all', ...S.members.map(m => m.user_id)].map(id => `<option value="${esc(id)}" ${js.who === id ? 'selected' : ''}>${id === 'all' ? 'Усі' : esc(memberName(id))}</option>`).join('')}</select></label>
      <label class="inline">Що: <select id="j-kind">${[['ops', 'Борги й оплати'], ['cancel', 'Скасування'], ['change', 'Зміни клієнтів і налаштувань'], ['all', 'Усе']].map(([k, l]) => `<option value="${k}" ${js.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${js.loading ? '<span class="small muted">Завантаження змін…</span>' : `<button class="icon-btn" data-act="reload-audit" aria-label="Оновити журнал" title="Оновити">${icon.refresh}</button>`}
    </div>
    ${js.error ? `<div class="banner warn">${esc(js.error)}</div>` : ''}
    <p class="small muted">Записи не видаляються: скасовані лишаються в журналі з причиною та іменем.</p>`
    : `<p class="small muted">Тут усе, що записали ви. Свій запис можна скасувати протягом ${S.shop?.cancel_minutes ?? 15} хв.</p>`}
  <section class="sheet">
    ${ev.length ? `<ul class="hist log">${ev.slice(0, 500).map(e => `<li class="${e.tech ? 'tech' : ''} ${e.cid && S.clients.has(e.cid) ? 'click' : ''}" ${e.cid && S.clients.has(e.cid) ? `data-act="open-client" data-id="${esc(e.cid)}"` : ''}><div class="d">${fmtDT(e.at)}</div><div class="t">${chip(e.kind)} ${esc(e.text)}<div class="by">${esc(memberName(e.by))}${e.pending ? ' · не відправлено' : ''}</div></div></li>`).join('')}</ul>${ev.length > 500 ? '<div class="empty small">Показано останні 500. Повний список — у вивантаженні Excel.</div>' : ''}`
      : '<div class="empty">Записів немає.</div>'}
  </section>`;
}

register({
  'reload-audit': () => { js.audit = null; js.error = null; loadAudit(); },
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'j-who') { js.who = e.target.value; view.rerender(); }
  if (e.target.id === 'j-kind') { js.kind = e.target.value; view.rerender(); }
});

return { journalView };
})();

M.views_settings = (function () {

const { register, openModal, closeModal, toast, formError, busy, confirmBox, icon } = M.ui;

function subscriptionInfo(shop) {
  if (!shop) return null;
  const until = new Date(shop.access_until || shop.trial_until).getTime();
  const left = Math.ceil((until - Date.now()) / DAY);
  const trial = !shop.paid_until || new Date(shop.paid_until) <= new Date(shop.trial_until);
  return { until, left, trial, writable: shop.writable !== false };
}

  const i = subscriptionInfo(S.shop);
  if (!i) return '';
  if (!i.writable) return `<div class="banner bad"><b>Підписка закінчилась.</b> Дані можна переглядати й вивантажувати, але нові записи недоступні. ${isOwner() ? `<a href="#/settings">Як продовжити →</a>` : 'Зверніться до власника магазину.'}</div>`;

const payPurpose = (shop) => `Зошит боржників, магазин «${shop.name || ''}»`;
const grn = (n) => Math.round(n).toLocaleString('uk-UA') + ' грн';

/** Блок «Підписка»: компактно, реальні реквізити з config.js, кнопки копіювання й зв'язку */
function subscriptionSection(shop, i, owner) {
  const status = i ? `<span class="chip ${i.writable ? (i.left > 5 ? 'ok' : 'warn') : 'bad'}">${i.writable ? (i.trial ? 'пробний період' : 'активна') : 'закінчилась'}</span>` : '';
  const head = `<div class="row-between"><h2>Підписка</h2>${status}</div>
    ${i ? `<p>${i.trial ? 'Пробний період' : 'Оплачено'} до <b>${fmtD(i.until)}</b>${i.left > 0 ? ` · ще ${days(i.left)}` : ''}</p>` : ''}`;
  if (!owner) return `<section class="sheet pad stack">${head}</section>`;
  const save = CFG.priceMonth * 12 - CFG.priceYear;
  const copyBtn = (act, what) => `<button class="icon-btn sm copy" data-act="${act}" aria-label="Копіювати ${what}" title="Копіювати">${icon.copy}</button>`;
  const row = (label, value, act, what, sub = '', cls = '') => `<div class="pay-row"><span class="muted">${label}</span><span><b class="${cls}">${esc(value)}</b>${sub ? `<small class="muted">${esc(sub)}</small>` : ''}</span>${act ? copyBtn(act, what) : '<span></span>'}</div>`;
  const hasPay = CFG.payCard || CFG.payIban || CFG.payLink;
  const tel = intlPhone(CFG.supportPhone);
  const viber = intlPhone(CFG.supportViber || CFG.supportPhone);
  const contacts = [CFG.supportTg ? `<a class="btn sm" href="https://t.me/${esc(CFG.supportTg)}" target="_blank" rel="noopener">Telegram</a>` : '',
    viber ? `<a class="btn sm" href="viber://chat?number=${encodeURIComponent(viber)}">Viber</a>` : '',
    tel ? `<a class="btn sm" href="tel:${esc(tel)}">Подзвонити</a>` : ''].filter(Boolean);
  return `<section class="sheet pad stack sub-box">
    ${head}
    <p class="price-line"><b>${grn(CFG.priceMonth)}</b>/міс · <b>${grn(CFG.priceYear)}</b>/рік${save > 0 ? ` <span class="muted">(−${grn(save)})</span>` : ''}</p>
    ${hasPay ? `<div class="pay-rows">
      ${CFG.payCard ? row('Картка', fmtCard(CFG.payCard), 'copy-card', 'номер картки', CFG.payRecipient, 'mono') : ''}
      ${!CFG.payCard && CFG.payRecipient ? row('Отримувач', CFG.payRecipient) : ''}
      ${CFG.payIban ? row('IBAN', CFG.payIban, 'copy-iban', 'IBAN', CFG.payCard ? '' : CFG.payRecipient, 'mono iban') : ''}
      ${row('Коментар', payPurpose(shop), 'copy-purpose', 'коментар до платежу')}
    </div>` : contacts.length ? '<p class="small muted">Щоб оплатити, напишіть або зателефонуйте нам — підкажемо, як зручніше.</p>' : '<p class="small muted">Реквізити для оплати з’являться тут найближчим часом.</p>'}
    <div class="actions two">
      ${CFG.payLink ? `<a class="btn ink" href="${esc(CFG.payLink)}" target="_blank" rel="noopener">Оплатити карткою</a>` : ''}
      <button class="btn ${CFG.payLink ? '' : 'ink'}" data-act="paid-tell">Я оплатив(ла)</button>
    </div>
    ${contacts.length ? `<div class="contact-line" aria-label="Зв’язатися з нами">${contacts.join('')}</div>` : ''}
  </section>`;
}

const fmtCode = (c) => c.length === 8 ? c.slice(0, 4) + '-' + c.slice(4) : c;
function inviteModal(inv) {
  const link = `${appUrl()}#/join/${inv.code}`;
  const msg = `Запрошую вас у «Зошит боржників» магазину «${S.shop.name}».\n1) Відкрийте ${link}\n2) Зареєструйтеся (або увійдіть)\n3) Код підставиться сам. Якщо ні — введіть: ${fmtCode(inv.code)}\nКод діє ${inv.role === 'owner' ? '24 години' : '7 днів'}.`;
  let qr = '';
  try { qr = qrSvg(link, { size: 210 }); } catch (e) { qr = ''; }
  openModal(`<div class="stack">
    <h2>Код запрошення</h2>
    <div class="invite-code">${esc(fmtCode(inv.code))}</div>
    ${qr ? `<div class="qr-box">${qr}<p class="small muted">Хай продавець наведе камеру телефона на цей код — програма відкриється з уже введеним кодом.</p></div>` : ''}
    <p class="small muted">Код одноразовий і діє ${inv.role === 'owner' ? '24 години' : '7 днів'}. Роль: ${inv.role === 'owner' ? 'власник' : 'продавець'}. Або надішліть працівнику цей текст:</p>

    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button><button class="btn ink" data-act="copy-invite">Копіювати текст</button></div>

async function quarantineModal() {
  openModal('<div class="stack"><h2>Записи на перевірку</h2><div class="empty">Завантаження…</div></div>', { wide: true });
  let items;
  try { items = await api.rpc('list_quarantine', { p_shop: S.shopId }); }
  catch (e) { openModal(`<div class="stack"><h2>Записи на перевірку</h2><div class="banner bad">${esc(e.message)}</div><div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div></div>`); return; }
  const row = (q) => {
    const p = q.payload;
    const what = q.kind === 'client' ? `Новий клієнт: <b>${esc(p.name)}</b>${p.phone ? ', ' + esc(p.phone) : ''}`
      : `${p.type === 'debt' ? 'Борг' : 'Оплата'} <b>${money(+p.amount)}</b> · ${esc(q.client_name || 'клієнт')}${p.note ? ' · ' + esc(p.note) : ''}`;
    return `<li class="row-between q-item"><span>${what}<br><span class="small muted">${esc(q.member_name || '')} · записано ${fmtD(p.client_at || q.received_at)}</span></span>
      <span class="actions"><button class="btn sm ok" data-act="q-approve" data-id="${esc(q.id)}">Прийняти</button><button class="btn sm ghost" data-act="q-reject" data-id="${esc(q.id)}">Відхилити</button></span></li>`;
  };
  openModal(`<div class="stack">
    <h2>Записи на перевірку</h2>
    <p class="small muted">Прийняті записи потраплять у борги від імені працівника. Відхилені не враховуються, але залишаються в журналі. Нових клієнтів приймайте раніше за їхні записи.</p>
    ${items.length ? `<ul class="plain">${items.map(row).join('')}</ul>` : '<div class="empty">Усе розглянуто.</div>'}
    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div>
  </div>`, { wide: true });
}
async function resolveQ(id, approve) {
  try { await online('resolve_quarantine', { p_shop: S.shopId, p_id: id, p_approve: approve }); toast(approve ? 'Прийнято' : 'Відхилено', approve ? 'ok' : ''); await quarantineModal(); }
  catch (e) { toast(e.message, 'bad'); }
}

    if (!name) return formError(form, 'Вкажіть назву.');
    if (!(lim >= 0)) return formError(form, 'Ліміт має бути числом.');
    if (!(mins >= 0 && mins <= 1440)) return formError(form, 'Час на скасування: від 0 до 1440 хвилин.');
    const conf = parseMoney(document.getElementById('sh-confirm').value || '0');
    if (!(conf >= 0)) return formError(form, 'Сума для підтвердження має бути числом, напр. 5000.');
    const notes = document.getElementById('sh-notes').value;
    await busy(form, async () => {
      try {
        await online('update_shop', { p_shop: S.shopId, p_name: name, p_default_limit: lim, p_cancel_minutes: mins,
          p_remind_template: document.getElementById('sh-remind').value, p_quick_notes: notes, p_confirm_amount: conf });
        closeModal(); toast('Збережено', 'ok');
      }
      catch (e) { formError(form, e.message); }
    });
  },
  async member(form) {
    const id = form.dataset.id;
    const name = document.getElementById('m-name').value.trim();
    if (!name) return formError(form, 'Вкажіть ім’я.');
    const role = document.getElementById('m-role').value, active = document.getElementById('m-active').checked;
    if (role === 'owner' && document.getElementById('m-role').dataset.was !== 'owner' && !document.getElementById('owner-ok').checked) {
      return formError(form, 'Поставте позначку «Я розумію», щоб зробити цю людину власником.');
    }
    await busy(form, async () => {
      try { await online('set_member', { p_shop: S.shopId, p_user: id, p_display_name: name, p_role: role, p_active: active }); closeModal(); toast('Збережено', 'ok'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async invite(form) {
    const role = document.getElementById('inv-role').value;
    if (role === 'owner' && !document.getElementById('owner-ok').checked) return formError(form, 'Поставте позначку «Я розумію», щоб запросити власника.');
    await busy(form, async () => {
      try { const inv = await online('create_invite', { p_shop: S.shopId, p_role: role }); inviteModal(inv); if (inv.existing) toast('Цей код уже діє — використайте його'); loadInvites(); }
      catch (e) { formError(form, e.message); }
    });
  },
  async myname(form) {
    const name = document.getElementById('my-name').value.trim();
    if (!name) return formError(form, 'Вкажіть ім’я.');
    await busy(form, async () => {
      try { await online('update_my_name', { p_shop: S.shopId, p_display_name: name }); closeModal(); toast('Збережено', 'ok'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async password(form) {
    const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
    if (a.length < 6) return formError(form, 'Мінімум 6 символів.');
    if (a !== b) return formError(form, 'Паролі не збігаються.');
    await busy(form, async () => {
      try { await api.updatePassword(a); closeModal(); toast('Пароль змінено', 'ok'); }
      catch (e) { formError(form, e.message); }
    });
  },
});

// роль «Власник» — червоне попередження з обов'язковою позначкою
document.addEventListener('change', (e) => {
  if (e.target.id !== 'inv-role' && e.target.id !== 'm-role') return;
  const w = document.getElementById('owner-warn'); if (!w) return;
  w.hidden = !(e.target.value === 'owner' && e.target.dataset.was !== 'owner');
  const cb = document.getElementById('owner-ok'); if (cb && w.hidden) cb.checked = false;
});

return { subscriptionInfo, subscriptionBanner, settingsView };
})();

M.views_admin = (function () {

const { register, openModal, closeModal, toast, formError, busy, icon } = M.ui;

// Адмін-панель сервісу (для вас як продавця програми): магазини, підписки, оплати

  if (as.filter === 'soon') list = list.filter(s => left(s) > 0 && left(s) <= 7);
  if (as.filter === 'expired') list = list.filter(s => left(s) <= 0);
  const paying = alive.filter(s => s.paid_until && left(s) > 0).length;
  const trial = alive.filter(s => !s.paid_until && left(s) > 0).length;

  <section class="sheet">
    <div class="adm-cards">${list.map(s => `<div class="adm-card">
      <div class="row-between"><div><b>${esc(s.name)}</b><div class="small muted">${esc(s.owner_name || '')} · ${esc(s.owner_email || '')}</div></div>${chip(s)}</div>

        <span>доступ до <b>${fmtD(s.access_until)}</b></span>${s.paid_until ? '' : '<span>пробний</span>'}
        <span>активність ${s.last_activity ? fmtD(s.last_activity) : '—'}</span></div>
      <button class="btn sm ink" data-act="admin-extend" data-id="${esc(s.id)}">${s.deleted_at ? 'Відновити / видалити' : 'Оплата / продовжити'}</button>
    </div>`).join('') || '<div class="empty">Нічого не знайдено</div>'}</div>
    <div class="adm-table tbl-wrap"><table>
    <thead><tr><th>Магазин</th><th>Власник</th><th class="n">Людей</th><th class="n">Клієнтів</th><th class="n">Записів</th><th>Остання активність</th><th>Доступ до</th><th></th></tr></thead>
    <tbody>${list.map(s => `<tr>
      <td><b>${esc(s.name)}</b><div class="small muted">з ${fmtD(s.created_at)}</div></td>
      <td>${esc(s.owner_name || '')}<div class="small muted">${esc(s.owner_email || '')}</div></td>
      <td class="n">${s.members}</td><td class="n">${s.clients}</td><td class="n">${s.ops}</td>
      <td>${s.last_activity ? fmtD(s.last_activity) : '—'}</td>
      <td>${chip(s)}<div class="small muted">${fmtD(s.access_until)}${s.paid_until ? '' : ' · пробний'}</div></td>
      <td><button class="btn sm ink" data-act="admin-extend" data-id="${esc(s.id)}">${s.deleted_at ? 'Відновити' : 'Оплата'}</button></td>
    </tr>`).join('') || '<tr><td colspan="8" class="muted">Нічого не знайдено</td></tr>'}</tbody>

}

const purgeFrom = (s) => new Date(new Date(s.deleted_at).getTime() + PURGE_DAYS * DAY);

async function extendModal(id) {
  const s = as.shops.find(x => x.id === id); if (!s) return;
  if (s.deleted_at) return deletedModal(s);
  openModal(`<div class="stack"><form data-form="admin-extend" data-id="${esc(id)}" class="stack" novalidate>
    <h2>${esc(s.name)}</h2>
    <div class="small muted">${esc(s.owner_email || '')} · доступ до ${fmtD(s.access_until)}</div>

    <div class="err" role="alert"></div>

    </form>
    <div class="m-actions start"><button type="button" class="btn sm" data-act="admin-remind" data-id="${esc(id)}">Нагадати про оплату</button></div>
    <details><summary class="small">Історія оплат</summary><div id="ax-history" class="small muted">Завантаження…</div></details>
    <details><summary class="small txt-bad">Видалити магазин</summary>
      <div class="stack">
        <p class="small">Лише на письмовий запит власника. Магазин зникне в усіх працівників, але <b>${PURGE_DAYS} днів його можна відновити</b>. Остаточно — лише після цього.</p>
        <p class="small"><b>Крок 1.</b> Збережіть повну копію — її можна віддати власнику.</p>
        <button type="button" class="btn sm" data-act="admin-export" data-id="${esc(id)}">Вивантажити копію</button>
        <p class="small"><b>Крок 2.</b> Введіть точну назву магазину.</p>
        <label class="f">Назва магазину<input id="ax-del-name" autocomplete="off" disabled placeholder="спершу крок 1"></label>
        <button type="button" class="btn bad" data-act="admin-delete" data-id="${esc(id)}" disabled>Видалити (можна відновити ${PURGE_DAYS} днів)</button>
      </div>
    </details>
  </div>`);
  try {
    const pays = await api.rpc('admin_payments', { p_shop: id });
    const h = document.getElementById('ax-history');
    if (h) h.innerHTML = pays.length ? `<ul class="plain">${pays.map(p => `<li>${fmtD(p.created_at)}: +${p.days} дн., ${money(p.amount_kop)}${p.note ? ' — ' + esc(p.note) : ''} → до ${fmtD(p.paid_until_after)}</li>`).join('')}</ul>` : 'Оплат ще не було.';
  } catch { /* */ }
}

function deletedModal(s) {
  const from = purgeFrom(s);
  const canPurge = Date.now() >= from.getTime();
  openModal(`<div class="stack">
    <h2>${esc(s.name)}</h2>
    <div class="banner warn">Видалено ${fmtD(s.deleted_at)}. Працівники магазин не бачать, але дані на місці.</div>
    <div class="actions">
      <button class="btn ok" data-act="admin-restore" data-id="${esc(s.id)}">Відновити магазин</button>
      <button class="btn" data-act="admin-export" data-id="${esc(s.id)}">Вивантажити копію</button>
    </div>
    <details><summary class="small txt-bad">Видалити остаточно</summary>
      <div class="stack">
        ${canPurge ? '<p class="small">Незворотно: клієнти, борги й журнал зникнуть назавжди.</p>'
          : `<p class="small">Остаточно видалити можна з <b>${fmtD(from)}</b>. До того магазин можна відновити.</p>`}
        <label class="f">Назва магазину<input id="ax-purge-name" autocomplete="off" ${canPurge ? '' : 'disabled'}></label>
        <button type="button" class="btn bad" data-act="admin-purge" data-id="${esc(s.id)}" ${canPurge ? '' : 'disabled'}>Видалити назавжди</button>
      </div>
    </details>
    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div>
  </div>`);
}

function remindText(s) {
  const l = Math.ceil((new Date(s.access_until) - Date.now()) / DAY);
  const lines = [`Вітаю${s.owner_name ? ', ' + s.owner_name : ''}!`,
    l > 0 ? `Підписка «Зошит боржників» для магазину «${s.name}» закінчується ${fmtD(s.access_until)} — через ${days(l)}.`
          : `Підписка «Зошит боржників» для магазину «${s.name}» закінчилась ${fmtD(s.access_until)}. Дані збережені, записувати нові можна після оплати.`,
    `Вартість: ${CFG.priceMonth} грн на місяць або ${CFG.priceYear} грн на рік.`];
  if (CFG.payLink) lines.push(`Оплатити карткою: ${CFG.payLink}`);
  if (CFG.payCard) lines.push(`Картка: ${fmtCard(CFG.payCard)}${CFG.payRecipient ? ' (' + CFG.payRecipient + ')' : ''}`);
  if (CFG.payIban) lines.push(`IBAN: ${CFG.payIban}`);
  lines.push(`Призначення: Зошит боржників, магазин «${s.name}».`);
  return lines.join('\n');
}

register({
  'admin-reload': () => { as.shops = null; as.error = null; load(); },
  'admin-filter': (el) => { as.filter = el.dataset.v; view.rerender(); },
  'admin-extend': (el) => extendModal(el.dataset.id),

    const s = as.shops.find(x => x.id === el.dataset.id); if (!s) return;
    const body = remindText(s);
    openModal(`<div class="stack">
      <h2>Нагадування про оплату</h2>
      <div class="small muted">${esc(s.owner_email || '')}</div>
      <label class="f">Текст<textarea id="rem-text" rows="7">${esc(body)}</textarea></label>

        <button class="btn ink" data-act="copy-remind-admin">Копіювати</button>

      </div>
      <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div>
    </div>`);
  },
  'copy-remind-admin': async () => { toast(await copyText(document.getElementById('rem-text').value) ? 'Скопійовано' : 'Виділіть текст і скопіюйте'); },
  'admin-export': async (el) => {
    try {
      const data = await api.rpc('admin_export_shop', { p_shop: el.dataset.id });
      const slug = (data.shop?.name || 'magazyn').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 30);
      downloadFile(`kopiya-${slug}-${isoDate()}.json`, JSON.stringify(data, null, 1), 'application/json');
      toast('Копію збережено', 'ok');

    } catch (e) { toast(e.message, 'bad'); }
  },
  'admin-delete': async (el) => {
    const name = document.getElementById('ax-del-name').value;
    try {
      const r = await api.rpc('admin_delete_shop', { p_shop: el.dataset.id, p_confirm_name: name });
      closeModal(); toast(`Магазин сховано. Відновити можна до ${fmtD(r.purge_after)}`); as.shops = null; load();
    } catch (e) { toast(e.message, 'bad'); }
  },
  'admin-restore': async (el) => {
    try { await api.rpc('admin_restore_shop', { p_shop: el.dataset.id }); closeModal(); toast('Магазин відновлено', 'ok'); as.filter = 'all'; as.shops = null; load(); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'admin-purge': async (el) => {
    const name = document.getElementById('ax-purge-name').value;
    try { await api.rpc('admin_purge_shop', { p_shop: el.dataset.id, p_confirm_name: name }); closeModal(); toast('Магазин видалено остаточно'); as.shops = null; load(); }
    catch (e) { toast(e.message, 'bad'); }
  },
}, {
  async 'admin-extend'(form) {
    const d = parseInt(document.getElementById('ax-days').value, 10);
    const amount = parseMoney(document.getElementById('ax-amount').value || '0');
    if (!d) return formError(form, 'Вкажіть кількість днів.');
    if (!(amount >= 0)) return formError(form, 'Невірна сума.');
    await busy(form, async () => {
      try {
        const r = await api.rpc('admin_extend', { p_shop: form.dataset.id, p_days: d, p_amount_kop: amount, p_note: document.getElementById('ax-note').value });
        closeModal(); toast('Доступ до ' + fmtD(r.paid_until), 'ok'); as.shops = null; load();
      } catch (e) { formError(form, e.message); }
    });
  },
});
document.addEventListener('input', (e) => { if (e.target.id === 'adm-q') { as.q = e.target.value; view.rerender(); } });

return { as, load, ensureShops, adminView };
})();

    <div class="actions"><a class="btn" href="#/list">До застосунку</a><button class="btn ghost" data-act="adm-logout">Вийти</button></div>`);
  if (ad.locked || api.currentAal() !== 'aal2') {
    if (!ad.factors) { loadFactors(); return gate(ad.error ? `<div class="banner bad">${esc(ad.error)}</div>` : '<div class="loading">Перевірка…</div>'); }
    const verified = ad.factors.find(f => f.status === 'verified');
    return verified ? codeScreen(verified) : enrollScreen();
  }
  touch();
  return shell(section || '', sectionView(section || ''));
}

const gate = (inner) => `<div class="auth adm-gate"><div class="auth-card">
  <div class="adm-brand"><span class="adm-badge">АДМІН</span><b>Зошит боржників</b></div>${inner}</div></div>`;

function codeScreen(f) {
  return gate(`<form data-form="adm-code" data-factor="${esc(f.id)}" class="stack" novalidate>
    <h2>${ad.locked ? 'Сесію призупинено' : 'Код підтвердження'}</h2>
    <p class="small muted">${ad.locked ? `Ви не працювали понад ${IDLE_MIN} хв. ` : ''}Відкрийте Google Authenticator і введіть 6 цифр для «Зошит боржників».</p>
    <label class="f">Код<input id="adm-code" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required autofocus placeholder="000000"></label>
    <div class="err" role="alert"></div>
    <button class="btn ink big" type="submit">Увійти в адмінку</button>
    <button type="button" class="btn ghost" data-act="adm-logout">Вийти з акаунта</button>
  </form>`);
}

function enrollScreen() {
  if (!ad.enroll) {
    return gate(`<div class="stack">
      <h2>Захистіть адмінку кодом</h2>
      <p>Адмінка бачить усі магазини, тому вхід лише з паролем не дозволено. Потрібна безкоштовна програма <b>Google Authenticator</b> (або Microsoft Authenticator) на вашому телефоні.</p>
      <ol class="steps small"><li>Встановіть Google Authenticator з Play Market чи App Store.</li><li>Натисніть кнопку нижче — з’явиться QR-код.</li><li>У програмі натисніть <b>+</b> → «Сканувати QR-код».</li><li>Введіть 6 цифр, які покаже програма.</li></ol>
      <button class="btn ink big" data-act="adm-enroll">Показати QR-код</button>
      <button type="button" class="btn ghost" data-act="adm-logout">Вийти з акаунта</button>
    </div>`);
  }
  // коротка адреса для програми-автентифікатора (довга з сервера не влазить у QR-код)
  const uri = `otpauth://totp/Zoshyt:admin?secret=${ad.enroll.totp.secret}&issuer=Zoshyt`;
  let qr = ''; try { qr = qrSvg(uri, { size: 220 }); } catch { qr = ''; }
  const secret = ad.enroll.totp.secret.replace(/(.{4})/g, '$1 ').trim();
  return gate(`<form data-form="adm-enroll" class="stack" novalidate>
    <h2>Скануйте код</h2>
    ${qr ? `<div class="qr-box">${qr}</div>` : ''}
    <p class="small muted">Не виходить сканувати? У програмі оберіть «Ввести ключ» і вставте:</p>
    <div class="secret-key mono" id="adm-secret">${esc(secret)}</div>
    <label class="f">6 цифр з програми<input id="adm-code" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required placeholder="000000"></label>
    <div class="err" role="alert"></div>
    <button class="btn ink big" type="submit">Підтвердити</button>
    <p class="small muted">Порада: збережіть цей ключ на папері в надійному місці — з ним можна відновити доступ, якщо телефон загубиться.</p>
  </form>`);
}

// ---------------- оболонка ----------------
function shell(section, content) {
  const shops = (S.boot && S.boot.shops) || [];
  const email = S.user?.email || S.boot?.email || '';
  return `<div class="adm-app">

function sectionView(section) {
  switch (section) {
    case 'shops': return shopsSection();
    case 'payments': return paymentsView();
    case 'log': return logView();
    case 'settings': return settingsView();
    default: return overviewView();

// ---------------- Огляд ----------------
function overviewView() {
  ensureShops(); ensurePays();
  if (as.error) return `<div class="banner bad">${esc(as.error)}</div>`;
  if (!as.shops) return '<div class="empty">Завантаження…</div>';
  const now = Date.now();
  const alive = as.shops.filter(s => !s.deleted_at);
  const left = (s) => Math.ceil((new Date(s.access_until) - now) / DAY);
  const paying = alive.filter(s => s.paid_until && left(s) > 0);
  const trial = alive.filter(s => !s.paid_until && left(s) > 0);
  const expired = alive.filter(s => left(s) <= 0);
  const new30 = alive.filter(s => now - new Date(s.created_at) < 30 * DAY).length;
  const paid30 = (ad.pays || []).filter(p => now - new Date(p.created_at) < 30 * DAY).reduce((x, p) => x + (+p.amount_kop || 0), 0);
  const everPaid = new Set((ad.pays || []).filter(p => +p.amount_kop > 0).map(p => p.shop_id)).size;
  const conv = alive.length ? Math.round(everPaid / alive.length * 100) : 0;
  const soonTrial = trial.filter(s => left(s) <= 3).sort((a, b) => left(a) - left(b));
  const idleTrial = trial.filter(s => !s.last_activity ? now - new Date(s.created_at) > 5 * DAY : now - new Date(s.last_activity) > 5 * DAY);
  const card = (k, v, cls = '', hint = '') => `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${hint ? `<div class="small muted">${hint}</div>` : ''}</div>`;
  const shopRow = (s, note) => `<li class="row" data-act="admin-extend" data-id="${esc(s.id)}" tabindex="0">
      <div class="who"><div class="name">${esc(s.name)}</div><div class="meta"><span>${esc(s.owner_name || '')}</span><span>${esc(s.owner_email || '')}</span></div></div>
      <div class="sum"><span class="small">${note}</span>${s.owner_email ? `<a class="btn sm" href="mailto:${esc(s.owner_email)}" data-stop>Написати</a>` : ''}</div></li>`;
  return `<div class="row-between page-head"><h1>Огляд</h1><button class="icon-btn" data-act="adm-reload" aria-label="Оновити">${icon.refresh}</button></div>
  <section class="kpis">
    ${card('Платних магазинів', paying.length, 'ok')}
    ${card('На пробному', trial.length)}
    ${card('Прострочені', expired.length, expired.length ? 'bad' : '')}
    ${card('Нових за 30 днів', new30)}
    ${card('Отримано за 30 днів', money(paid30), 'ok')}
    ${card('Дохід на місяць', '≈ ' + money(paying.length * CFG.priceMonth * 100), '', `${paying.length} × ${CFG.priceMonth} грн`)}
    ${card('Оплатили хоч раз', conv + '%', '', 'з усіх магазинів')}
    ${card('Середній платіж', everPaid ? money(Math.round(paid30 / Math.max(1, (ad.pays || []).filter(p => now - new Date(p.created_at) < 30 * DAY && +p.amount_kop > 0).length))) : '—')}
  </section>
  <section class="sheet"><div class="pad pb0"><h2>Потребують уваги</h2></div>
    <div class="pad pt0 small muted">Пробний закінчується за 3 дні або менше</div>
    ${soonTrial.length ? `<ul class="rows">${soonTrial.map(s => shopRow(s, left(s) <= 0 ? 'закінчився' : 'ще ' + days(left(s)))).join('')}</ul>` : '<div class="empty small">Немає</div>'}
    <div class="pad pt0 small muted" style="margin-top:12px">На пробному й не заходять 5+ днів — варто подзвонити</div>
    ${idleTrial.length ? `<ul class="rows">${idleTrial.map(s => shopRow(s, s.last_activity ? 'остання дія ' + fmtD(s.last_activity) : 'жодного запису')).join('')}</ul>` : '<div class="empty small">Немає</div>'}
  </section>`;
}

}

const ACTIONS = { 'admin:extend': 'Продовжив доступ', 'admin:delete_shop': 'Видалив магазин (можна відновити)', 'admin:restore_shop': 'Відновив магазин',
  'admin:purge_shop': 'Остаточно видалив магазин', 'admin:export_shop': 'Вивантажив копію магазину', 'admin:platform': 'Змінив налаштування платформи' };
async function ensureLog(force = false) {

}
function logText(a) {
  const d = a.details || {};
  if (a.action === 'admin:extend') return `${d.days > 0 ? '+' : ''}${d.days} дн.${+d.amount_kop ? ', ' + money(+d.amount_kop) : ''} → до ${fmtD(d.paid_until)}${d.note ? ' · ' + d.note : ''}`;
  if (a.action === 'admin:platform') {
    const o = d.old || {}, n = d.new || {};
    const ch = [...new Set([...Object.keys(o), ...Object.keys(n)])].filter(k => JSON.stringify(o[k]) !== JSON.stringify(n[k]));
    return ch.length ? 'змінено: ' + ch.join(', ') : 'без змін';
  }
  return '';
}
function logView() {

// ---------------- Налаштування платформи ----------------

// ---------------- автовихід через 30 хв ----------------
let last = Date.now();
function touch() { last = Date.now(); lsSet('zoshyt.adminSeen', String(last)); }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (location.hash.startsWith('#/admin')) touch(); }, { passive: true }));
setInterval(async () => {
  if (!location.hash.startsWith('#/admin') || ad.locked || api.currentAal() !== 'aal2') return;
  const seen = Math.max(last, +(lsGet('zoshyt.adminSeen') || 0));
  if (Date.now() - seen < IDLE_MIN * 60000) return;
  // невідправлених записів магазину немає — виходимо повністю; інакше лише блокуємо адмінку
  if ((await pendingForLogout()) === 0) { await logout(); ad.factors = null; location.hash = '#/admin'; toast(`Вихід з адмінки: ${IDLE_MIN} хв без дій`); }
  else { ad.locked = true; view.rerender(); }
}, 30000);

// ---------------- дії ----------------
register({
  'adm-logout': async () => {
    if ((await pendingForLogout()) > 0) { toast('На цьому пристрої є невідправлені записи магазину — спершу підключіться до інтернету.', 'bad'); return; }
    await logout(); ad.factors = null; ad.enroll = null; ad.locked = false; location.hash = '#/admin';
  },
  'adm-enroll': async () => {
    try {
      // незавершені спроби підключення прибираємо, щоб не плодити їх
      for (const f of (ad.factors || []).filter(x => x.status !== 'verified')) await api.mfaUnenroll(f.id).catch(() => {});
      ad.enroll = await api.mfaEnroll(); view.rerender();
    } catch (e) { toast(e.message, 'bad'); }
  },
  'adm-reload': () => {
    as.shops = null; as.error = null; ad.pays = null; ad.log = null;
    ensureShops(); view.rerender();
  },
}, {
  async 'adm-code'(form) {
    const code = document.getElementById('adm-code').value;
    if (!/^\d{6}$/.test(code.replace(/\D/g, ''))) return formError(form, 'Введіть 6 цифр.');
    await busy(form, async () => {
      try { await api.mfaVerify(form.dataset.factor, code); ad.locked = false; touch(); await runSync({ forceBoot: true }); view.rerender(); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-enroll'(form) {
    const code = document.getElementById('adm-code').value;
    if (!/^\d{6}$/.test(code.replace(/\D/g, ''))) return formError(form, 'Введіть 6 цифр з програми.');
    await busy(form, async () => {
      try {
        await api.mfaVerify(ad.enroll.id, code);
        ad.enroll = null; ad.factors = null; touch();
        toast('Готово! Тепер вхід в адмінку — лише з кодом.', 'ok');
        await runSync({ forceBoot: true }); view.rerender();
      } catch (e) { formError(form, e.message); }
    });
  },
  async 'adm-platform'(form) {
    const v = (id) => document.getElementById('pl-' + id).value.trim();
    const data = {};
    for (const k of ['price_month', 'price_year', 'pay_card', 'pay_recipient', 'pay_iban', 'pay_link', 'support_tg', 'support_phone', 'support_viber', 'support_email', 'app_url']) data[k] = v(k);
    await busy(form, async () => {
      try {
        ad.platform = await api.rpc('admin_set_platform', { p_data: data });
        applyPlatform(ad.platform);
        if (S.boot) S.boot.platform = ad.platform;
        ad.log = null; toast('Збережено — власники побачать нові дані одразу', 'ok'); view.rerender();
      } catch (e) { formError(form, e.message); }
    });
  },
});

// посилання «Написати» всередині рядка не повинно відкривати вікно магазину
document.addEventListener('click', (e) => { if (e.target.closest('[data-stop]')) e.stopPropagation(); }, true);

return { adminScreen };
})();

        <label class="f">Код запрошення<input id="js-code" required maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="ABCD-EFGH" class="code-in" value="${esc(invitedCode())}"></label>
        <label class="f">Ваше ім’я<input id="js-me" required maxlength="60" value="${n}"></label>

    </div>
    <div class="center small actions" style="justify-content:center">
      ${S.boot && S.boot.is_admin ? '<a class="btn sm" href="#/admin">Адмін-панель сервісу</a>' : ''}
      <button class="btn sm ghost" data-act="logout">Вийти з акаунта</button></div>
  </div></div>`;
}

function overviewView() {
  const shops = (S.boot && S.boot.shops) || [];
  const owned = shops.filter(s => s.role === 'owner');
  const total = owned.reduce((s, x) => s + (x.total_debt || 0), 0);
  return `
  <section class="summary three">
    <div><div class="k">Загалом винні (усі магазини)</div><div class="v bad">${money(total)}</div></div>
    <div><div class="k">Боржників</div><div class="v">${owned.reduce((s, x) => s + (x.debtors || 0), 0)}</div></div>
    <div><div class="k">Магазинів</div><div class="v">${shops.length}</div></div>
  </section>
  <section class="sheet"><ul class="rows">
    ${shops.map(s => `<li class="row" data-act="pick-shop" data-id="${esc(s.id)}" tabindex="0">
      <div class="who"><div class="name">${esc(s.name)}</div><div class="meta"><span>${s.role === 'owner' ? 'власник' : 'продавець'}</span><span>${s.debtors || 0} боржників</span>${s.writable === false ? '<span class="chip bad">підписка закінчилась</span>' : ''}</div></div>
      <div class="sum"><span class="amt ${s.total_debt > 0 ? 'bad' : 'zero'}">${money(s.total_debt || 0)}</span></div></li>`).join('')}
  </ul></section>
  <div class="actions"><button class="btn" data-act="add-shop">+ Додати магазин</button><button class="btn" data-act="join-another">Приєднатися за кодом</button></div>
  <p class="small muted">Підсумки оновлюються, коли є інтернет${S.boot?.at ? ' · станом на ' + fmtDT(S.boot.at) : ''}.</p>`;
}

function installView() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  return `
  <section class="sheet pad stack">
    <h2>Встановити програму</h2>
    ${standalone ? '<div class="banner ok">Програму вже встановлено на цьому пристрої.</div>' : ''}
    ${installPrompt && !standalone ? '<button class="btn ink big" data-act="install">Встановити зараз</button>' : ''}
    <p>Після встановлення «Зошит» відкривається з іконки, як звичайна програма, і працює без інтернету.</p>
  </section>
  <div class="grid2">
    <section class="sheet pad stack"><h3>Android (Chrome)</h3><ol class="steps">
      <li>Відкрийте цю сторінку в <b>Chrome</b>.</li><li>Натисніть <b>⋮</b> (три крапки вгорі праворуч).</li><li>Оберіть <b>«Встановити застосунок»</b> або <b>«Додати на головний екран»</b>.</li></ol></section>
    <section class="sheet pad stack"><h3>iPhone (Safari)</h3><ol class="steps">
      <li>Відкрийте цю сторінку в <b>Safari</b>.</li><li>Натисніть <b>«Поділитися»</b> (квадрат зі стрілкою).</li><li>Оберіть <b>«На екран “Додому”»</b>.</li></ol></section>
    <section class="sheet pad stack"><h3>Windows (Chrome або Edge)</h3><ol class="steps">
      <li>Відкрийте сторінку в <b>Chrome</b> або <b>Edge</b>.</li><li>У рядку адреси праворуч натисніть значок <b>«Встановити»</b> (монітор зі стрілкою).</li><li>Підтвердьте. Іконка з’явиться в меню «Пуск» і на робочому столі.</li></ol></section>
    <section class="sheet pad stack"><h3>Порада</h3>
      <p class="small">Перший вхід потребує інтернету. Далі можна записувати борги без зв’язку — записи відправляться самі, щойно інтернет з’явиться. Значок угорі показує стан: <b>✓</b> — усе збережено на сервері.</p></section>
  </div>`;
}

function noticesModal() {
  openModal(`<div class="stack">
    <h2>Що не вдалося зберегти</h2>
    <p class="small muted">Сервер не прийняв ці дії. Відкрийте клієнта, щоб повторити або прибрати запис.</p>
    <ul class="plain notices">${S.notices.map(n => `<li><span class="small muted">${fmtDT(n.at)}</span> ${esc(n.text)}</li>`).join('')}</ul>
    <div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button><button class="btn ink" data-act="clear-notices">Зрозуміло, прибрати</button></div>
  </div>`);
}

// подія встановлення (Chrome/Edge/Android)
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; view.rerender && view.rerender(); });
window.addEventListener('appinstalled', () => { installPrompt = null; lsSet('zoshyt.installed', '1'); view.rerender && view.rerender(); });

const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/** Банер «Встановити на головний екран» (Android/Chrome — одна кнопка, iPhone — коротка підказка) */
function installBanner() {
  if (isStandalone() || lsGet('zoshyt.installed')) return '';
  const hid = +(lsGet('zoshyt.installHidden') || 0);
  if (hid && Date.now() - hid < 14 * 86400000) return '';
  const close = '<button class="icon-btn sm" data-act="install-hide" aria-label="Сховати">✕</button>';
  if (installPrompt) return `<div class="banner info install-bar"><span><b>Встановіть «Зошит» на телефон</b> — відкриватиметься з іконки й працюватиме без інтернету.</span>
    <span class="actions"><button class="btn sm ink" data-act="install">Встановити</button>${close}</span></div>`;
  if (isIos()) return `<div class="banner info install-bar"><span><b>Додайте «Зошит» на екран «Додому»:</b> натисніть <b>Поділитися</b> <span aria-hidden="true">⎋</span> унизу Safari → <b>«На екран “Додому”»</b>.</span>${close}</div>`;
  return '';
}

function shopForm(kind) {
  const n = esc(defaultName());
  openModal(kind === 'create' ? `<form data-form="create-shop" class="stack" novalidate>
      <h2>Новий магазин</h2>
      <label class="f">Назва магазину<input id="cs-name" required maxlength="100" autofocus></label>
      <label class="f">Ваше ім’я<input id="cs-me" required maxlength="60" value="${esc((S.members.find(m => m.user_id === S.user.id) || {}).display_name || n)}"></label>
      <p class="small muted">Кожен магазин має окремих клієнтів, працівників і підписку.</p>
      <div class="err" role="alert"></div>
      <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ink" type="submit">Створити</button></div></form>`
    : `<form data-form="join-shop" class="stack" novalidate>
      <h2>Приєднатися до магазину</h2>
      <label class="f">Код запрошення<input id="js-code" required maxlength="12" autofocus class="code-in" autocomplete="off" value="${esc(invitedCode())}"></label>
      <label class="f">Ваше ім’я<input id="js-me" required maxlength="60" value="${esc((S.members.find(m => m.user_id === S.user.id) || {}).display_name || n)}"></label>
      <div class="err" role="alert"></div>
      <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ink" type="submit">Приєднатися</button></div></form>`);
}

async function afterShop(shopId) {
  await runSync({ forceBoot: true });
  await selectShop(shopId);
  closeModal();
  go('#/list');
}

register({
  'pick-shop': async (el) => { await selectShop(el.dataset.id); go('#/list'); },
  'add-shop': () => shopForm('create'),
  'join-another': () => shopForm('join'),
  install: async () => { if (!installPrompt) return; installPrompt.prompt(); const r = await installPrompt.userChoice; installPrompt = null; if (r && r.outcome === 'accepted') lsSet('zoshyt.installed', '1'); view.rerender(); },
  'install-hide': () => { lsSet('zoshyt.installHidden', String(Date.now())); view.rerender(); },
  notices: () => noticesModal(),
  'clear-notices': async () => { await clearNotices(); closeModal(); },
}, {
  async 'create-shop'(form) {
    const name = document.getElementById('cs-name').value.trim(), me = document.getElementById('cs-me').value.trim();
    if (!name) return formError(form, 'Вкажіть назву магазину.');
    if (!me) return formError(form, 'Вкажіть ваше ім’я.');
    if (!navigator.onLine) return formError(form, 'Для створення магазину потрібен інтернет.');
    await busy(form, async () => {
      try { const s = await api.rpc('create_shop', { p_name: name, p_display_name: me }); toast('Магазин створено! 30 днів безкоштовно.', 'ok'); await afterShop(s.id); }
      catch (e) { formError(form, e.message); }
    });
  },
  async 'join-shop'(form) {
    const code = document.getElementById('js-code').value.trim(), me = document.getElementById('js-me').value.trim();
    if (!code) return formError(form, 'Введіть код.');
    if (!me) return formError(form, 'Вкажіть ваше ім’я.');
    if (!navigator.onLine) return formError(form, 'Для приєднання потрібен інтернет.');
    await busy(form, async () => {
      try {
        const r = await api.rpc('join_shop', { p_code: code, p_display_name: me });
        if (r && r.error) return formError(form, r.message);
        clearInvite();
        toast(`Ви приєдналися до «${r.name}»`, 'ok'); await afterShop(r.id);
      } catch (e) { formError(form, e.message); }
    });
  },
});

return { startView, overviewView, installView, noticesModal, installPrompt, installBanner };
})();

M.main = (function () {
const api = M.api;
const { $, esc, fmtTime, fmtDT } = M.util;
const { actions, forms, closeModal, modalOpen, toast, icon, register, confirmBox } = M.ui;
const { S, subscribe, start, foreignPending, requestSync, runSync, selectShop, isOwner } = M.store;
const { view, parse, go } = M.router;
const { applyPrefs } = M.prefs;
const { loginView, signupView, forgotView, resetView, setupView, reloginModal, setOnSignedIn } = M.views_auth;
const { listView, clientView, listState } = M.views_shop;
const { reportsView } = M.views_reports;
const { journalView } = M.views_journal;
const { settingsView, subscriptionBanner } = M.views_settings;
const { adminScreen } = M.views_admin_app;
const { startView, overviewView, installView, installBanner } = M.views_misc;
// Точка входу: запуск, маршрути, оболонка, обробка подій













window.ZOSHYT_VERSION = '1.3.0';
const root = $('#root');
let mode = 'loading';   // loading | setup | auth | reset | app
let reloginShown = false;

// ---------- рендер ----------
function render() {
  const focusId = document.activeElement && document.activeElement.id;
  const sel = focusId && document.activeElement.selectionStart;
  const scroll = window.scrollY;
  root.innerHTML = screen();
  if (focusId && !modalOpen()) {
    const el = document.getElementById(focusId);
    if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(sel, sel); } catch { /* */ } }
  }
  if (view.keepScroll) window.scrollTo(0, scroll);
  view.keepScroll = true;
  if (S.authExpired && !reloginShown && mode === 'app') { reloginShown = true; reloginModal(); }
  if (!S.authExpired) reloginShown = false;
}
view.rerender = render;

function screen() {
  const r = parse();
  if (mode === 'loading') return '<div class="auth"><div class="loading">Відкриваю зошит…</div></div>';
  if (mode === 'setup') return setupView();
  if (mode === 'reset') return resetView();
  if (mode === 'auth') return r.name === 'signup' ? signupView() : r.name === 'forgot' ? forgotView() : loginView({ admin: r.name === 'admin' });
  // mode === 'app'
  // адмін-платформа — окремий застосунок, магазин для неї не потрібен
  if (r.name === 'admin') { document.body.classList.add('is-admin'); return adminScreen(r.arg); }
  document.body.classList.remove('is-admin');
  if (!S.boot) return `<div class="auth"><div class="auth-card"><div class="loading">Завантаження…</div>${navigator.onLine ? '' : '<div class="banner warn">Немає інтернету. Перший запуск на цьому пристрої потребує з’єднання.</div>'}</div></div>`;
  if (!S.boot.shops.length) return startView();
  if (r.name === 'overview') return shell('overview', overviewView(), 'Усі магазини');
  if (!S.shop) return shell('overview', overviewView(), 'Усі магазини');
  view.name = r.name; view.clientId = r.name === 'client' ? r.arg : null;
  switch (r.name) {
    case 'client': return shell('list', clientView(r.arg));
    case 'reports': return isOwner() ? shell('reports', reportsView()) : shell('list', listView());
    case 'journal': return shell('journal', journalView());
    case 'settings': return shell('settings', settingsView());
    case 'install': return shell('settings', installView());
    default: return shell('list', listView());
  }
}

function syncChip() {
  const s = S.sync;
  if (!navigator.onLine || s.state === 'offline') return `<button class="sync off" data-act="sync-now" title="Немає інтернету. Записи зберігаються на пристрої.">${icon.off}<span>Офлайн${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (s.state === 'syncing') return `<button class="sync" data-act="sync-now">${icon.sync}<span>Синхронізація…</span></button>`;
  if (s.state === 'error') return `<button class="sync bad" data-act="sync-now" title="${esc(s.error || '')}">${icon.warn}<span>Помилка${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (S.outbox) return `<button class="sync" data-act="sync-now">${icon.cloud}<span>${S.outbox} чекають</span></button>`;
  return `<button class="sync ok" data-act="sync-now" title="Усе збережено на сервері">${icon.check}<span>${s.lastOk ? fmtTime(s.lastOk) : 'OK'}</span></button>`;
}

/** Понад добу без зв'язку, а записи чекають — окреме помітне попередження */
function longOffline() {
  const last = S.sync.lastOk;
  return S.outbox > 0 && last > 0 && Date.now() - last > 24 * 3600 * 1000 && S.sync.state !== 'syncing';
}

function shell(tab, content, title) {
  const shops = S.boot.shops;
  const owner = isOwner();
  const tabs = S.shop ? [['list', 'Боржники', '#/list', icon.debtors]]
    .concat(owner ? [['reports', 'Звіти', '#/reports', icon.reports]] : [])
    .concat([['journal', owner ? 'Журнал' : 'Мої записи', '#/journal', icon.journal], ['settings', 'Налаштування', '#/settings', icon.gear]]) : [];
  const showShopSwitch = shops.length > 1 || shops.some(s => s.role === 'owner');
  return `
  <header class="top"><div class="top-row">
    <a class="brand" href="#/list" aria-label="Зошит боржників — на головну"><img src="icon.svg" alt="" width="30" height="30"><span class="brand-name">Зошит</span></a>
    ${S.shop && showShopSwitch ? `<label class="shop-switch"><span class="sr">Магазин</span><select id="shop-select">
        ${shops.map(s => `<option value="${esc(s.id)}" ${s.id === S.shopId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        ${shops.length > 1 ? '<option value="__overview">— Усі магазини —</option>' : ''}
        ${shops.some(s => s.role === 'owner') ? '<option value="__add">+ Додати магазин…</option>' : ''}
        <option value="__join">Приєднатися за кодом…</option>
      </select></label>` : `<span class="shop-name">${esc(title || S.shop?.name || '')}</span>`}
    <div class="top-right">${syncChip()}</div>
  </div>
  ${tabs.length ? `<nav class="tabs" aria-label="Розділи">${tabs.map(([k, l, h, ic]) => `<a class="tab" href="${h}" ${tab === k ? 'aria-current="page"' : ''}>${ic || ''}<span>${l}</span></a>`).join('')}</nav>` : ''}
  </header>
  <main class="wrap">
    ${longOffline() ? `<div class="banner warn">Записи збережені на цьому телефоні. Підключіться до інтернету, щоб вони потрапили в хмару${S.sync.lastOk ? ` (востаннє — ${fmtDT(S.sync.lastOk)})` : ''}.</div>`
      : !navigator.onLine ? `<div class="banner info">Немає інтернету — працюємо офлайн. ${S.outbox ? `${S.outbox} ${S.outbox === 1 ? 'запис чекає' : 'записи чекають'} відправки.` : 'Нові записи збережуться на пристрої.'}</div>` : ''}
    ${S.sync.state === 'error' && S.sync.error ? `<div class="banner bad">${esc(S.sync.error)}</div>` : ''}
    ${S.notices.length ? `<div class="banner bad row-between"><span>${S.notices.length} ${S.notices.length === 1 ? 'дія не збережена' : 'дії не збережено'} на сервері.</span><button class="btn sm" data-act="notices">Переглянути</button></div>` : ''}
    ${tab !== 'admin' && tab !== 'overview' ? subscriptionBanner() : ''}
    ${tab === 'list' && !view.clientId ? installBanner() : ''}
    ${isOwner() && S.shop?.quarantine > 0 && tab !== 'settings' ? `<div class="banner warn row-between"><span>${S.shop.quarantine} ${S.shop.quarantine === 1 ? 'запис' : 'записи(ів)'} від вимкненого працівника чекають вашої перевірки.</span><a class="btn sm" href="#/settings">Переглянути</a></div>` : ''}
    ${content}
  </main>`;
}

// ---------- події ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOpen() && !S.authExpired) closeModal();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-act][tabindex]')) e.target.click();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { listState.q = e.target.value; render(); } });
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'shop-select') return;
  const v = e.target.value;
  if (v === '__overview') return go('#/overview');
  if (v === '__add') { e.target.value = S.shopId; return actions['add-shop'](); }
  if (v === '__join') { e.target.value = S.shopId; return actions['join-another'](); }
  await selectShop(v); go('#/list');
});
window.addEventListener('hashchange', () => {
  if (location.hash.includes('access_token=')) { boot(); return; }   // посилання з листа відкрили в уже відкритій вкладці
  const j = parse();
  if (j.name === 'join' && j.arg) { try { sessionStorage.setItem('zoshyt.invite', j.arg); } catch (e) {} location.hash = '#/list'; return; }
  view.keepScroll = false;
  const r = parse();
  if (mode === 'app' && ['login', 'signup', 'forgot'].includes(r.name)) { location.hash = '#/list'; return; }
  if (mode === 'auth' && !['login', 'signup', 'forgot', 'admin'].includes(r.name)) { location.hash = '#/login'; return; }
  closeModal(); render(); window.scrollTo(0, 0);
});
window.addEventListener('online', () => { render(); requestSync(100); });
window.addEventListener('offline', () => { S.sync.state = 'offline'; render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestSync(100); });
setInterval(() => {
  if (document.visibilityState !== 'visible' || mode !== 'app') return;
  // без магазину (напр. чекаємо, поки власник поверне доступ) — перевіряємо список магазинів
  if (!S.shop) runSync({ forceBoot: true }); else requestSync(0);
}, 30000);

register({
  close: () => closeModal(),
  'sync-now': () => { runSync({ forceBoot: true }).then(() => { if (S.sync.state === 'ok') toast('Синхронізовано'); else if (S.sync.state === 'offline') toast('Немає інтернету — записи збережені на пристрої'); }); },
});

subscribe(() => {
  // вийшли з акаунта (звідки завгодно) — назад до входу
  if (mode === 'app' && !S.user) {
    mode = 'auth';
    if (!['login', 'signup', 'forgot', 'admin'].includes(parse().name)) { location.hash = '#/login'; return; }
  }
  if (mode === 'app' || mode === 'auth') render();
});

// ---------- запуск ----------
async function signedIn(user) {
  const foreign = await foreignPending(user);
  if (foreign) {
    // не стираємо чужі невідправлені записи мовчки
    const ok = await confirmBox({ title: 'На пристрої є чужі невідправлені записи',
      text: `${foreign.count} записів користувача <b>${esc(foreign.email)}</b> ще не відправлено на сервер. Щоб їх зберегти, вийдіть і увійдіть як ${esc(foreign.email)}. Якщо продовжити, ці записи буде видалено з пристрою.`,
      ok: 'Видалити їх і продовжити', cancel: 'Вийти', danger: true });
    if (!ok) { await api.signOut(); mode = 'auth'; location.hash = '#/login'; return render(); }
  }
  mode = 'app';
  await start(user);
  if (['login', 'signup', 'forgot', ''].includes(parse().name) || !location.hash) location.hash = '#/list';
  render();
  await runSync({ forceBoot: true });
}
setOnSignedIn(signedIn);

async function boot() {
  applyPrefs();
  const inv = parse();
  if (inv.name === 'join' && inv.arg) { try { sessionStorage.setItem('zoshyt.invite', inv.arg); } catch (e) {} location.hash = '#/list'; }
  if (!api.configured()) { mode = 'setup'; return render(); }
  const back = api.takeSessionFromUrl();
  if (back && back.error) toast(back.error, 'bad');
  if (back && back.type === 'recovery') { mode = 'reset'; sessionStorage.setItem('zoshyt.recovery', '1'); return render(); }
  if (sessionStorage.getItem('zoshyt.recovery') && api.getSession()) { mode = 'reset'; return render(); }
  let session = api.getSession();
  if (session && !session.user) { try { await api.fetchUser(); session = api.getSession(); } catch { /* */ } }
  if (!session || !session.user) {
    mode = 'auth';
    if (!['login', 'signup', 'forgot', 'admin'].includes(parse().name)) location.hash = '#/login';
    return render();
  }
  await signedIn(session.user);
}

// ---------- оновлення програми (service worker) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => {
      const b = document.getElementById('update-bar');
      b.hidden = false;
      b.querySelector('button').onclick = () => { w.postMessage('skip-waiting'); };
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  // перезавантажуємо лише при ОНОВЛЕННІ програми, а не при першому встановленні
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}

boot().catch((e) => { console.error(e); root.innerHTML = `<div class="auth"><div class="auth-card"><div class="banner bad">Помилка запуску: ${esc(e.message)}</div><a class="btn" href="./">Перезавантажити</a></div></div>`; });

return {  };
})();
})();
</script>
