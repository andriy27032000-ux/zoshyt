});

return { reportsView, exportClients, exportOps, exportJson };
})();

M.views_journal = (function () {
const { esc, money, fmtDT, fmtD } = M.util;
const { register } = M.ui;
const { S, isOwner, memberName } = M.store;
const api = M.api;
const { view } = M.router;
// Журнал: хто, коли і що записав або змінив





const js = { who: 'all', kind: 'all', audit: null, auditShop: null, loading: false, error: null };

async function loadAudit() {
  if (js.loading || !isOwner()) return;
  js.loading = true; js.error = null;
  try { js.audit = await api.rpc('get_audit', { p_shop: S.shopId, p_limit: 500 }); js.auditShop = S.shopId; }
  catch (e) { js.error = e.network ? 'Зміни налаштувань і клієнтів підвантажуються з інтернету — зараз зв’язку немає.' : e.message; }
  finally { js.loading = false; view.rerender(); }
}

const FIELD = { name: 'ім’я', phone: 'телефон', address: 'адреса', note: 'примітка', limit_kop: 'ліміт', archived: 'архів',
  default_limit: 'стандартний ліміт', cancel_minutes: 'час на скасування', paid_until: 'підписка до', trial_until: 'пробний період до',
  role: 'роль', active: 'доступ', display_name: 'ім’я' };
function fmtVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'limit_kop' || k === 'default_limit') return money(+v);
  if (k === 'archived') return v ? 'так' : 'ні';
  if (k === 'active') return v ? 'увімкнено' : 'вимкнено';
  if (k === 'role') return v === 'owner' ? 'власник' : 'продавець';
  if (k === 'paid_until' || k === 'trial_until') return fmtD(v);
  if (k === 'cancel_minutes') return v + ' хв';
  return String(v);
}
function changes(d) {
  return Object.entries(d).filter(([k]) => FIELD[k]).map(([k, v]) => `${FIELD[k]}: ${fmtVal(k, v.old)} → ${fmtVal(k, v.new)}`).join('; ');
}
function describe(a) {
  const d = a.details || {};
  const cname = (id) => (S.clients.get(id) || {}).name || d.name?.new || d.name || 'клієнт';
  switch (a.action) {
    case 'insert:shops': return 'Створив магазин';
    case 'update:shops': return 'Змінив налаштування магазину: ' + changes(d);
    case 'insert:members': return `Новий працівник: ${d.display_name} (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:members': return `Змінено працівника ${memberName(a.entity_id)}: ${changes(d)}`;
    case 'insert:clients': return `Додав клієнта ${d.name}${d.limit_kop ? ', ліміт ' + money(d.limit_kop) : ''}`;
    case 'update:clients': return `Змінив клієнта ${cname(a.entity_id)}: ${changes(d)}`;
    case 'insert:invites': return `Створив код запрошення (${d.role === 'owner' ? 'власник' : 'продавець'})`;
    case 'update:invites': return d.used_by ? 'Код запрошення використано' : d.revoked_at ? 'Код запрошення скасовано' : 'Змінено запрошення';
    default: return null;
  }
}

function events() {
  const ev = [];
  for (const o of S.ops.values()) {
    if (o._failed) continue;
    const cn = (S.clients.get(o.client_id) || {}).name || '—';
    ev.push({ at: o.client_at, by: o.created_by, kind: o.type, text: `${o.type === 'debt' ? 'Записав борг' : 'Прийняв оплату'} ${money(o.amount)} · ${cn}${o.note ? ' · ' + o.note : ''}`, cid: o.client_id, pending: o._pending });
    if (o.cancelled_at) ev.push({ at: o.cancelled_at, by: o.cancelled_by, kind: 'cancel', text: `Скасував ${o.type === 'debt' ? 'борг' : 'оплату'} ${money(o.amount)} · ${cn} · причина: ${o.cancel_reason}`, cid: o.client_id, pending: o._pendingCancel });
  }
  if (isOwner() && js.audit && js.auditShop === S.shopId) {
    for (const a of js.audit) {
      if (a.action === 'update:ops') continue;
      const text = describe(a); if (!text) continue;
      ev.push({ at: a.at, by: a.user_id, kind: 'change', text, cid: a.action.endsWith(':clients') ? a.entity_id : null });
    }
  }
  return ev.sort((a, b) => new Date(b.at) - new Date(a.at));
}

function journalView() {
  if (isOwner() && (js.auditShop !== S.shopId || !js.audit) && !js.loading && !js.error && navigator.onLine) loadAudit();
  let ev = events();
  if (!isOwner()) ev = ev.filter(e => e.by === S.user.id);
  else if (js.who !== 'all') ev = ev.filter(e => e.by === js.who);
  if (js.kind !== 'all') ev = ev.filter(e => (js.kind === 'change' ? e.kind === 'change' : js.kind === 'cancel' ? e.kind === 'cancel' : e.kind === 'debt' || e.kind === 'pay'));
  const chip = (k) => k === 'debt' ? '<span class="chip bad">борг</span>' : k === 'pay' ? '<span class="chip ok">оплата</span>' : k === 'cancel' ? '<span class="chip warn">скасування</span>' : '<span class="chip ink">зміни</span>';
  return `
  ${isOwner() ? `<div class="toolbar">
      <label class="inline">Хто: <select id="j-who">${['all', ...S.members.map(m => m.user_id)].map(id => `<option value="${esc(id)}" ${js.who === id ? 'selected' : ''}>${id === 'all' ? 'Усі' : esc(memberName(id))}</option>`).join('')}</select></label>
      <label class="inline">Що: <select id="j-kind">${[['all', 'Усе'], ['ops', 'Борги й оплати'], ['cancel', 'Скасування'], ['change', 'Зміни клієнтів і налаштувань']].map(([k, l]) => `<option value="${k}" ${js.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${js.loading ? '<span class="small muted">Завантаження змін…</span>' : '<button class="btn sm ghost" data-act="reload-audit">Оновити</button>'}
    </div>
    ${js.error ? `<div class="banner warn">${esc(js.error)}</div>` : ''}
    <p class="small muted">Записи не видаляються: скасовані лишаються в журналі з причиною та іменем.</p>`
    : `<p class="small muted">Тут усе, що записали ви. Свій запис можна скасувати протягом ${S.shop?.cancel_minutes ?? 15} хв.</p>`}
  <section class="sheet">
    ${ev.length ? `<ul class="hist log">${ev.slice(0, 500).map(e => `<li ${e.cid && S.clients.has(e.cid) ? `class="click" data-act="open-client" data-id="${esc(e.cid)}"` : ''}><div class="d">${fmtDT(e.at)}</div><div class="t">${chip(e.kind)} ${esc(e.text)}<div class="by">${esc(memberName(e.by))}${e.pending ? ' · не відправлено' : ''}</div></div></li>`).join('')}</ul>${ev.length > 500 ? '<div class="empty small">Показано останні 500. Повний список — у вивантаженні Excel.</div>' : ''}`
      : '<div class="empty">Записів немає.</div>'}
  </section>`;
}

register({
  'reload-audit': () => { js.audit = null; js.error = null; loadAudit(); },
});
document.addEventListener('change', (e) => {

return { journalView };
})();

function subscriptionInfo(shop) {
  if (!shop) return null;
  const until = new Date(shop.access_until || shop.trial_until).getTime();
  const left = Math.ceil((until - Date.now()) / DAY);
  const trial = !shop.paid_until || new Date(shop.paid_until) <= new Date(shop.trial_until);
  return { until, left, trial, writable: shop.writable !== false };
}

function subscriptionBanner() {
  const i = subscriptionInfo(S.shop);
  if (!i) return '';
  if (!i.writable) return `<div class="banner bad"><b>Підписка закінчилась.</b> Дані можна переглядати й вивантажувати, але нові записи недоступні. ${isOwner() ? `<a href="#/settings">Як продовжити →</a>` : 'Зверніться до власника магазину.'}</div>`;
  if (i.left <= 0) return `<div class="banner warn">Підписка закінчилась ${fmtD(i.until)}. Ще кілька днів програма працює як звичайно. ${isOwner() ? '<a href="#/settings">Продовжити →</a>' : ''}</div>`;
  if (isOwner() && i.left <= 5) return `<div class="banner warn">${i.trial ? 'Пробний період' : 'Підписка'} закінчується через ${days(i.left)} (${fmtD(i.until)}). <a href="#/settings">Як продовжити →</a></div>`;
  return '';
}

  let items;
  try { items = await api.rpc('list_quarantine', { p_shop: S.shopId }); }
  catch (e) { openModal(`<div class="stack"><h2>Записи на перевірку</h2><div class="banner bad">${esc(e.message)}</div><div class="m-actions"><button class="btn ghost" data-act="close">Закрити</button></div></div>`); return; }
  const row = (q) => {

      : `${p.type === 'debt' ? 'Борг' : 'Оплата'} <b>${money(+p.amount)}</b> · ${esc(q.client_name || 'клієнт')}${p.note ? ' · ' + esc(p.note) : ''}`;
    return `<li class="row-between q-item"><span>${what}<br><span class="small muted">${esc(q.member_name || '')} · записано ${fmtD(p.client_at || q.received_at)}</span></span>

async function resolveQ(id, approve) {

  'new-invite': () => {

      <div class="err" role="alert"></div>

  async shop(form) {

  async myname(form) {
    const name = document.getElementById('my-name').value.trim();
    if (!name) return formError(form, 'Вкажіть ім’я.');
    await busy(form, async () => {
      try { await online('update_my_name', { p_shop: S.shopId, p_display_name: name }); closeModal(); toast('Збережено', 'ok'); }
      catch (e) { formError(form, e.message); }
    });
  },
  async password(form) {
    const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
    if (a.length < 6) return formError(form, 'Мінімум 6 символів.');
    if (a !== b) return formError(form, 'Паролі не збігаються.');
    await busy(form, async () => {
      try { await api.updatePassword(a); closeModal(); toast('Пароль змінено', 'ok'); }
      catch (e) { formError(form, e.message); }
    });
  },
});

return { subscriptionInfo, subscriptionBanner, settingsView };
})();

M.views_admin = (function () {
const { esc, money, parseMoney, fmtD, days, DAY } = M.util;
const { register, openModal, closeModal, toast, formError, busy } = M.ui;
const api = M.api;
const { view } = M.router;
// Адмін-панель сервісу (для вас як продавця програми): магазини, підписки, оплати




const as = { shops: null, loading: false, error: null, q: '', filter: 'all' };

async function load() {
  as.loading = true; as.error = null; view.rerender();
  try { as.shops = await api.rpc('admin_list_shops'); }
  catch (e) { as.error = e.message; }
  finally { as.loading = false; view.rerender(); }
}

function adminView() {
  if (!as.shops && !as.loading && !as.error) load();
  if (as.error) return `<div class="banner bad">${esc(as.error)}</div><button class="btn" data-act="admin-reload">Спробувати ще</button>`;
  if (!as.shops) return '<div class="empty">Завантаження…</div>';
  const now = Date.now();
  const q = as.q.trim().toLowerCase();
  let list = as.shops.filter(s => !q || s.name.toLowerCase().includes(q) || (s.owner_email || '').toLowerCase().includes(q) || (s.owner_name || '').toLowerCase().includes(q));
  const left = (s) => Math.ceil((new Date(s.access_until) - now) / DAY);
  if (as.filter === 'trial') list = list.filter(s => !s.paid_until && left(s) > 0);
  if (as.filter === 'paid') list = list.filter(s => s.paid_until && left(s) > 0);
  if (as.filter === 'soon') list = list.filter(s => left(s) > 0 && left(s) <= 7);
  if (as.filter === 'expired') list = list.filter(s => left(s) <= 0);
  const paying = as.shops.filter(s => s.paid_until && left(s) > 0).length;
  const trial = as.shops.filter(s => !s.paid_until && left(s) > 0).length;
  const active7 = as.shops.filter(s => s.last_activity && now - new Date(s.last_activity) < 7 * DAY).length;
  return `
  <section class="summary four">
    <div><div class="k">Магазинів</div><div class="v">${as.shops.length}</div></div>
    <div><div class="k">Платять</div><div class="v ok">${paying}</div></div>
    <div><div class="k">Пробний період</div><div class="v">${trial}</div></div>
    <div><div class="k">Активні за 7 днів</div><div class="v">${active7}</div></div>
  </section>
  <div class="toolbar">
    <input id="adm-q" class="search" type="search" placeholder="Пошук: магазин, email, ім’я" value="${esc(as.q)}">
    <div class="seg">${[['all', 'Усі'], ['trial', 'Пробні'], ['paid', 'Платні'], ['soon', 'Закінчуються'], ['expired', 'Прострочені']].map(([k, l]) => `<button data-act="admin-filter" data-v="${k}" aria-pressed="${as.filter === k}">${l}</button>`).join('')}</div>
    <button class="btn sm ghost" data-act="admin-reload">Оновити</button>
  </div>
  <section class="sheet"><div class="tbl-wrap"><table>
    <thead><tr><th>Магазин</th><th>Власник</th><th class="n">Людей</th><th class="n">Клієнтів</th><th class="n">Записів</th><th>Остання активність</th><th>Доступ до</th><th></th></tr></thead>
    <tbody>${list.map(s => { const l = left(s); return `<tr>
      <td><b>${esc(s.name)}</b><div class="small muted">з ${fmtD(s.created_at)}</div></td>
      <td>${esc(s.owner_name || '')}<div class="small muted">${esc(s.owner_email || '')}</div></td>
      <td class="n">${s.members}</td><td class="n">${s.clients}</td><td class="n">${s.ops}</td>
      <td>${s.last_activity ? fmtD(s.last_activity) : '—'}</td>
      <td><span class="chip ${l <= 0 ? 'bad' : l <= 7 ? 'warn' : s.paid_until ? 'ok' : ''}">${fmtD(s.access_until)}</span><div class="small muted">${l > 0 ? 'ще ' + days(l) : 'закінчився'}${s.paid_until ? '' : ' · пробний'}</div></td>
      <td><button class="btn sm ink" data-act="admin-extend" data-id="${esc(s.id)}">Оплата</button></td>
    </tr>`; }).join('') || '<tr><td colspan="8" class="muted">Нічого не знайдено</td></tr>'}</tbody>
  </table></div></section>
  <p class="small muted">Повне видалення магазину на прохання клієнта — у вікні «Оплата» внизу.</p>`;
}

async function extendModal(id) {
  const s = as.shops.find(x => x.id === id); if (!s) return;
  openModal(`<div class="stack"><form data-form="admin-extend" data-id="${esc(id)}" class="stack" novalidate>
    <h2>${esc(s.name)}</h2>
    <div class="small muted">${esc(s.owner_email || '')} · доступ до ${fmtD(s.access_until)}</div>
    <label class="f">Продовжити на днів<input id="ax-days" inputmode="numeric" value="30"></label>
    <div class="quick">${[30, 90, 180, 365].map(d => `<button type="button" data-act="ax-days" data-v="${d}">${d}</button>`).join('')}</div>
    <label class="f">Отримано, грн (для обліку)<input id="ax-amount" inputmode="decimal" value="0"></label>
    <label class="f">Примітка<input id="ax-note" maxlength="200" placeholder="Оплата за жовтень, картка"></label>
    <div class="err" role="alert"></div>
    <div class="m-actions"><button type="button" class="btn ghost" data-act="close">Скасувати</button><button class="btn ink" type="submit">Продовжити доступ</button></div>
    </form>
    <details><summary class="small">Історія оплат</summary><div id="ax-history" class="small muted">Завантаження…</div></details>
    <details><summary class="small txt-bad">Видалити магазин повністю</summary>
      <p class="small">Незворотно видаляє всі дані магазину (клієнтів, борги, журнал). Лише на письмовий запит власника. Спершу порадьте йому зберегти копію.</p>
      <label class="f">Введіть точну назву магазину<input id="ax-del-name" autocomplete="off"></label>
      <button type="button" class="btn bad" data-act="admin-delete" data-id="${esc(id)}">Видалити назавжди</button>
    </details>
  </div>`);
  try {
    const pays = await api.rpc('admin_payments', { p_shop: id });
    const h = document.getElementById('ax-history');
    if (h) h.innerHTML = pays.length ? `<ul class="plain">${pays.map(p => `<li>${fmtD(p.created_at)}: +${p.days} дн., ${money(p.amount_kop)}${p.note ? ' — ' + esc(p.note) : ''} → до ${fmtD(p.paid_until_after)}</li>`).join('')}</ul>` : 'Оплат ще не було.';
  } catch { /* */ }
}

register({
  'admin-reload': () => { as.shops = null; as.error = null; load(); },
  'admin-filter': (el) => { as.filter = el.dataset.v; view.rerender(); },
  'admin-extend': (el) => extendModal(el.dataset.id),
  'ax-days': (el) => { document.getElementById('ax-days').value = el.dataset.v; },
  'admin-delete': async (el) => {
    const name = document.getElementById('ax-del-name').value;
    try { await api.rpc('admin_delete_shop', { p_shop: el.dataset.id, p_confirm_name: name }); closeModal(); toast('Магазин видалено'); as.shops = null; load(); }
    catch (e) { toast(e.message, 'bad'); }
  },
}, {
  async 'admin-extend'(form) {
    const d = parseInt(document.getElementById('ax-days').value, 10);
    const amount = parseMoney(document.getElementById('ax-amount').value || '0');
    if (!d) return formError(form, 'Вкажіть кількість днів.');
    if (!(amount >= 0)) return formError(form, 'Невірна сума.');
    await busy(form, async () => {
      try {
        const r = await api.rpc('admin_extend', { p_shop: form.dataset.id, p_days: d, p_amount_kop: amount, p_note: document.getElementById('ax-note').value });
        closeModal(); toast('Доступ до ' + fmtD(r.paid_until), 'ok'); as.shops = null; load();
      } catch (e) { formError(form, e.message); }
    });
  },
});
document.addEventListener('input', (e) => { if (e.target.id === 'adm-q') { as.q = e.target.value; view.rerender(); } });

return { adminView };
})();

M.main = (function () {
const api = M.api;
const { $, esc, fmtTime } = M.util;
const { actions, forms, closeModal, modalOpen, toast, icon, register, confirmBox } = M.ui;
const { S, subscribe, start, foreignPending, requestSync, runSync, selectShop, isOwner } = M.store;
const { view, parse, go } = M.router;
const { loginView, signupView, forgotView, resetView, setupView, reloginModal, setOnSignedIn } = M.views_auth;
const { listView, clientView, listState } = M.views_shop;
const { reportsView } = M.views_reports;
const { journalView } = M.views_journal;
const { settingsView, subscriptionBanner } = M.views_settings;
const { adminView } = M.views_admin;
const { startView, overviewView, installView } = M.views_misc;
// Точка входу: запуск, маршрути, оболонка, обробка подій












window.ZOSHYT_VERSION = '1.0.0';
const root = $('#root');
let mode = 'loading';   // loading | setup | auth | reset | app
let reloginShown = false;

// ---------- рендер ----------
function render() {
  const focusId = document.activeElement && document.activeElement.id;
  const sel = focusId && document.activeElement.selectionStart;
  const scroll = window.scrollY;
  root.innerHTML = screen();
  if (focusId && !modalOpen()) {
    const el = document.getElementById(focusId);
    if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(sel, sel); } catch { /* */ } }
  }
  if (view.keepScroll) window.scrollTo(0, scroll);
  view.keepScroll = true;
  if (S.authExpired && !reloginShown && mode === 'app') { reloginShown = true; reloginModal(); }
  if (!S.authExpired) reloginShown = false;
}
view.rerender = render;

function screen() {
  const r = parse();
  if (mode === 'loading') return '<div class="auth"><div class="loading">Відкриваю зошит…</div></div>';
  if (mode === 'setup') return setupView();
  if (mode === 'reset') return resetView();
  if (mode === 'auth') return r.name === 'signup' ? signupView() : r.name === 'forgot' ? forgotView() : loginView();
  // mode === 'app'
  if (!S.boot) return `<div class="auth"><div class="auth-card"><div class="loading">Завантаження…</div>${navigator.onLine ? '' : '<div class="banner warn">Немає інтернету. Перший запуск на цьому пристрої потребує з’єднання.</div>'}</div></div>`;
  // адмін сервісу може не мати жодного магазину — панель має відкриватися й так
  if (r.name === 'admin' && S.boot.is_admin) return shell('admin', adminView(), 'Адмін-панель');
  if (!S.boot.shops.length) return startView();
  if (r.name === 'overview') return shell('overview', overviewView(), 'Усі магазини');
  if (!S.shop) return shell('overview', overviewView(), 'Усі магазини');
  view.name = r.name; view.clientId = r.name === 'client' ? r.arg : null;
  switch (r.name) {
    case 'client': return shell('list', clientView(r.arg));
    case 'reports': return isOwner() ? shell('reports', reportsView()) : shell('list', listView());
    case 'journal': return shell('journal', journalView());
    case 'settings': return shell('settings', settingsView());
    case 'install': return shell('settings', installView());
    default: return shell('list', listView());
  }
}

function syncChip() {
  const s = S.sync;
  if (!navigator.onLine || s.state === 'offline') return `<button class="sync off" data-act="sync-now" title="Немає інтернету. Записи зберігаються на пристрої.">${icon.off}<span>Офлайн${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (s.state === 'syncing') return `<button class="sync" data-act="sync-now">${icon.sync}<span>Синхронізація…</span></button>`;
  if (s.state === 'error') return `<button class="sync bad" data-act="sync-now" title="${esc(s.error || '')}">${icon.warn}<span>Помилка${S.outbox ? ' · ' + S.outbox + ' чекають' : ''}</span></button>`;
  if (S.outbox) return `<button class="sync" data-act="sync-now">${icon.cloud}<span>${S.outbox} чекають</span></button>`;
  return `<button class="sync ok" data-act="sync-now" title="Усе збережено на сервері">${icon.check}<span>${s.lastOk ? fmtTime(s.lastOk) : 'OK'}</span></button>`;
}

function shell(tab, content, title) {
  const shops = S.boot.shops;
  const owner = isOwner();
  const tabs = S.shop ? [['list', 'Боржники', '#/list']]
    .concat(owner ? [['reports', 'Звіти', '#/reports']] : [])
    .concat([['journal', owner ? 'Журнал' : 'Мої записи', '#/journal'], ['settings', 'Налаштування', '#/settings']]) : [];
  const showShopSwitch = shops.length > 1 || shops.some(s => s.role === 'owner');
  return `
  <header class="top"><div class="top-row">
    <a class="brand" href="#/list" aria-label="Зошит боржників — на головну"><img src="icon.svg" alt="" width="30" height="30"><span class="brand-name">Зошит</span></a>
    ${S.shop && showShopSwitch ? `<label class="shop-switch"><span class="sr">Магазин</span><select id="shop-select">
        ${shops.map(s => `<option value="${esc(s.id)}" ${s.id === S.shopId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        ${shops.length > 1 ? '<option value="__overview">— Усі магазини —</option>' : ''}
        ${shops.some(s => s.role === 'owner') ? '<option value="__add">+ Додати магазин…</option>' : ''}
        <option value="__join">Приєднатися за кодом…</option>
      </select></label>` : `<span class="shop-name">${esc(title || S.shop?.name || '')}</span>`}
    <div class="top-right">${syncChip()}${S.boot.is_admin ? `<a class="btn sm ghost" href="#/admin">Адмін</a>` : ''}</div>
  </div>
  ${tabs.length ? `<nav class="tabs" aria-label="Розділи">${tabs.map(([k, l, h]) => `<a class="tab" href="${h}" ${tab === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>` : ''}
  </header>
  <main class="wrap">
    ${!navigator.onLine ? `<div class="banner info">Немає інтернету — працюємо офлайн. ${S.outbox ? `${S.outbox} ${S.outbox === 1 ? 'запис чекає' : 'записи чекають'} відправки.` : 'Нові записи збережуться на пристрої.'}</div>` : ''}
    ${S.sync.state === 'error' && S.sync.error ? `<div class="banner bad">${esc(S.sync.error)}</div>` : ''}
    ${S.notices.length ? `<div class="banner bad row-between"><span>${S.notices.length} ${S.notices.length === 1 ? 'дія не збережена' : 'дії не збережено'} на сервері.</span><button class="btn sm" data-act="notices">Переглянути</button></div>` : ''}
    ${tab !== 'admin' && tab !== 'overview' ? subscriptionBanner() : ''}
    ${isOwner() && S.shop?.quarantine > 0 && tab !== 'settings' ? `<div class="banner warn row-between"><span>${S.shop.quarantine} ${S.shop.quarantine === 1 ? 'запис' : 'записи(ів)'} від вимкненого працівника чекають вашої перевірки.</span><a class="btn sm" href="#/settings">Переглянути</a></div>` : ''}
    ${content}
  </main>`;
}

// ---------- події ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOpen() && !S.authExpired) closeModal();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-act][tabindex]')) e.target.click();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { listState.q = e.target.value; render(); } });
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'shop-select') return;
  const v = e.target.value;
  if (v === '__overview') return go('#/overview');
  if (v === '__add') { e.target.value = S.shopId; return actions['add-shop'](); }
  if (v === '__join') { e.target.value = S.shopId; return actions['join-another'](); }
  await selectShop(v); go('#/list');
});
window.addEventListener('hashchange', () => {
  if (location.hash.includes('access_token=')) { boot(); return; }   // посилання з листа відкрили в уже відкритій вкладці
  view.keepScroll = false;
  const r = parse();
  if (mode === 'app' && ['login', 'signup', 'forgot'].includes(r.name)) { location.hash = '#/list'; return; }
  if (mode === 'auth' && !['login', 'signup', 'forgot'].includes(r.name)) { location.hash = '#/login'; return; }
  closeModal(); render(); window.scrollTo(0, 0);
});
window.addEventListener('online', () => { render(); requestSync(100); });
window.addEventListener('offline', () => { S.sync.state = 'offline'; render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestSync(100); });
setInterval(() => {
  if (document.visibilityState !== 'visible' || mode !== 'app') return;
  // без магазину (напр. чекаємо, поки власник поверне доступ) — перевіряємо список магазинів
  if (!S.shop) runSync({ forceBoot: true }); else requestSync(0);
}, 30000);

register({
  close: () => closeModal(),
  'sync-now': () => { runSync({ forceBoot: true }).then(() => { if (S.sync.state === 'ok') toast('Синхронізовано'); else if (S.sync.state === 'offline') toast('Немає інтернету — записи збережені на пристрої'); }); },
});

subscribe(() => { if (mode === 'app') render(); });

// ---------- запуск ----------
async function signedIn(user) {
  const foreign = await foreignPending(user);
  if (foreign) {
    // не стираємо чужі невідправлені записи мовчки
    const ok = await confirmBox({ title: 'На пристрої є чужі невідправлені записи',
      text: `${foreign.count} записів користувача <b>${esc(foreign.email)}</b> ще не відправлено на сервер. Щоб їх зберегти, вийдіть і увійдіть як ${esc(foreign.email)}. Якщо продовжити, ці записи буде видалено з пристрою.`,
      ok: 'Видалити їх і продовжити', cancel: 'Вийти', danger: true });
    if (!ok) { await api.signOut(); mode = 'auth'; location.hash = '#/login'; return render(); }
  }
  mode = 'app';
  await start(user);
  if (['login', 'signup', 'forgot', ''].includes(parse().name) || !location.hash) location.hash = '#/list';
  render();
  await runSync({ forceBoot: true });
}
setOnSignedIn(signedIn);

async function boot() {
  if (!api.configured()) { mode = 'setup'; return render(); }
  const rec = api.takeRecoveryFromUrl();
  if (rec && rec.error) toast(rec.error, 'bad');
  if (rec && rec.type === 'recovery') { mode = 'reset'; sessionStorage.setItem('zoshyt.recovery', '1'); return render(); }
  if (sessionStorage.getItem('zoshyt.recovery') && api.getSession()) { mode = 'reset'; return render(); }
  let session = api.getSession();
  if (session && !session.user) { try { await api.fetchUser(); session = api.getSession(); } catch { /* */ } }
  if (!session || !session.user) {
    mode = 'auth';
    if (!['login', 'signup', 'forgot'].includes(parse().name)) location.hash = '#/login';
    return render();
  }
  await signedIn(session.user);
}

// ---------- оновлення програми (service worker) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => {
      const b = document.getElementById('update-bar');
      b.hidden = false;
      b.querySelector('button').onclick = () => { w.postMessage('skip-waiting'); };
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  // перезавантажуємо лише при ОНОВЛЕННІ програми, а не при першому встановленні
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}

boot().catch((e) => { console.error(e); root.innerHTML = `<div class="auth"><div class="auth-card"><div class="banner bad">Помилка запуску: ${esc(e.message)}</div><a class="btn" href="./">Перезавантажити</a></div></div>`; });

return {  };
})();
})();
</script>
</body>
