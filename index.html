<style>
/* Зошит боржників — стилі. Мотив: зошит у клітинку, чорнильна ручка, червоне поле. */
:root {
  --paper: #f5f7fb; --grid: #e3e8f2; --surface: #ffffff; --surface-2: #eef2f9;
  --text: #18203a; --muted: #5a6582; --line: #d5dcea;
  --ink: #2140a8; --ink-soft: #e4eafc; --on-ink: #ffffff;
  --bad: #c2362b; --bad-soft: #fbe7e4; --ok: #1c7a4a; --ok-soft: #e1f3e9;
  --warn: #8f5b00; --warn-soft: #fdf0d3; --info-soft: #e7eefc; --margin: #e79a92;
  --on-solid: #ffffff;
  --shadow: 0 1px 2px rgba(24,32,58,.06), 0 6px 20px rgba(24,32,58,.06);
  --r: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131b; --grid: #171c28; --surface: #181d28; --surface-2: #212838;
    --text: #e7eaf3; --muted: #9aa4bc; --line: #2d3549;
    --ink: #8ea5ff; --ink-soft: #232c4a; --on-ink: #0e1320;
    --bad: #ff8478; --bad-soft: #3a1d1c; --ok: #62d49c; --ok-soft: #15301f;
    --warn: #f2bd55; --warn-soft: #352a12; --info-soft: #1c2640; --margin: #7a3a36;
    --on-solid: #10131b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
    --paper: #10131b; --grid: #171c28; --surface: #181d28; --surface-2: #212838;
    --text: #e7eaf3; --muted: #9aa4bc; --line: #2d3549;
    --ink: #8ea5ff; --ink-soft: #232c4a; --on-ink: #0e1320;
    --bad: #ff8478; --bad-soft: #3a1d1c; --ok: #62d49c; --ok-soft: #15301f;
    --warn: #f2bd55; --warn-soft: #352a12; --info-soft: #1c2640; --margin: #7a3a36;
    --on-solid: #10131b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
}

/* розмір шрифту: звичайний і великий (для налаштування «великий шрифт») */
html { font-size: 1rem; }
:root[data-size="big"] { font-size: 1.1875rem; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font: 1rem/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  padding: 0 16px calc(90px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.125rem; }
h3 { font-size: 0.7812rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
p { margin: 0; }
.wrap { max-width: 1000px; margin: 0 auto; }
.muted { color: var(--muted); } .small { font-size: 0.8125rem; } .center { text-align: center; }
.txt-bad { color: var(--bad); } .txt-ok { color: var(--ok); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.stack { display: grid; gap: 12px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- верхня панель ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; border-bottom: 3px double var(--margin); }
.top-row { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand-name { font-weight: 800; font-size: 1.1875rem; letter-spacing: -.01em; }
.shop-switch { min-width: 0; flex: 1 1 auto; }
.shop-switch select { width: 100%; max-width: 320px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-weight: 600; min-height: 38px; }
.shop-name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.sync { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 0.7812rem; color: var(--muted); min-height: 32px; white-space: nowrap; }
.sync.ok { color: var(--ok); } .sync.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; } .sync.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.tabs { display: flex; gap: 4px; max-width: 1000px; margin: 0 auto; }
.tab { padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); font-weight: 550; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.tab svg { width: 1.15em; height: 1.15em; flex: none; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
@media (max-width: 430px) {
  .sync span { display: none; }
  .sync { padding: 5px 8px; }
  .admin-label { display: none; }
}
@media (max-width: 720px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; max-width: none; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; z-index: 6; }
  .tab { border-radius: 10px; flex: 1; text-align: center; font-size: 0.75rem; padding: 7px 2px 6px; display: grid; justify-items: center; gap: 2px; line-height: 1.15; }
  .tab svg { width: 1.45em; height: 1.45em; }
  .tab[aria-current="page"] { background: var(--ink-soft); box-shadow: none; }
  .brand-name { display: none; }
  .sync span { max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
  .top-right .btn.sm { padding: 0.35em 0.55em; }
}

/* ---------- кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.7em 1em; font-weight: 550; min-height: 3em; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--ink); }
.btn.sm { min-height: 2.4em; padding: 0.35em 0.8em; font-size: 0.8125rem; border-radius: 8px; }
.btn.big { min-height: 3.4em; font-size: 1rem; }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--on-solid); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.btn.bad-outline { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn[disabled] { opacity: .5; cursor: progress; }

/* ---------- блоки ---------- */
main { padding-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px; } .pb0 { padding-bottom: 6px; } .pt0 { padding-top: 0; }
.banner { border-radius: 10px; padding: 10px 14px; font-size: 0.8438rem; background: var(--info-soft); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.info { background: var(--info-soft); color: var(--text); }
.banner a { color: inherit; font-weight: 650; }
.note-box { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.8438rem; margin-top: 8px; white-space: pre-wrap; }

.summary { display: grid; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.summary.three { grid-template-columns: repeat(3, 1fr); }
.summary.four { grid-template-columns: repeat(4, 1fr); }
.summary > div { background: var(--surface); padding: 12px 16px; min-width: 0; }
.summary .k { font-size: 0.75rem; color: var(--muted); }
.summary .v { font-size: 1.375rem; font-weight: 750; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v.bad { color: var(--bad); } .v.ok { color: var(--ok); } .v.warn { color: var(--warn); }
@media (max-width: 720px) {
  .summary > div { padding: 10px 10px; }
  .summary .v { font-size: 1.125rem; }
  .summary.four { grid-template-columns: repeat(2, 1fr); }
  .summary.three { grid-template-columns: repeat(2, 1fr); }
  .summary.three > div:first-child { grid-column: 1 / -1; }
  .summary.three > div:first-child .v { font-size: 1.5rem; }
}

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar.between { justify-content: space-between; }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.7em 1em; min-height: 3em; font-size: 1rem; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 0.8125rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
label.inline { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
label.inline select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 36px; }

/* ---------- список (рядки зошита з полем перед сумою) ---------- */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--line); cursor: pointer; }
@media (max-width: 480px) { .row .sum { padding: 12px 12px; } .row .amt { font-size: 1rem; } }
.rows > .row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .who { padding: 12px 14px 12px 16px; min-width: 0; }
.row .name { font-weight: 650; overflow-wrap: anywhere; }
.row .meta { font-size: 0.7812rem; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .sum { padding: 12px 16px; text-align: right; align-items: flex-end; display: flex; flex-direction: column; justify-content: center; }
.amt { font-weight: 750; font-size: 1.0625rem; white-space: nowrap; }
.amt.sm { font-size: 0.9375rem; }
.amt.bad { color: var(--bad); } .amt.ok { color: var(--ok); } .amt.zero { color: var(--muted); font-weight: 500; }
.meter { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); }
.meter i.over { background: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7188rem; font-weight: 650; border-radius: 999px; padding: 2px 8px; white-space: nowrap; background: var(--surface-2); color: var(--muted); vertical-align: middle; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ink { background: var(--ink-soft); color: var(--ink); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- картка клієнта ---------- */
.client-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.client-name { overflow-wrap: anywhere; }
.balance-box { text-align: right; display: grid; gap: 3px; min-width: 180px; }
.big { font-size: 2.125rem; font-weight: 800; line-height: 1.1; }
.big.bad { color: var(--bad); } .big.ok { color: var(--ok); } .big.zero { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8438rem; color: var(--muted); margin-top: 6px; }
.facts a { display: inline-flex; align-items: center; gap: 4px; }
.sheet .actions { margin-top: 16px; }
@media (max-width: 560px) { .client-head { grid-template-columns: 1fr; } .balance-box { text-align: left; } .sheet .actions .btn { flex: 1 1 45%; } }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; }
.hist .d { font-size: 0.7812rem; color: var(--muted); }
.hist .t { min-width: 0; overflow-wrap: anywhere; }
.hist .t b { font-weight: 650; }
.hist .by { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.hist .x { text-align: right; }
.hist li.cancel .amt, .hist li.cancel .t > b { text-decoration: line-through; opacity: .55; }
.hist li.failed { background: var(--bad-soft); }
.hist.log li { grid-template-columns: 82px minmax(0, 1fr); }
.hist li.click, tr.click { cursor: pointer; }
.hist li.click:hover, tr.click:hover { background: var(--surface-2); }
@media (max-width: 480px) { .hist li { grid-template-columns: minmax(0, 1fr) auto; } .hist .d { grid-column: 1 / -1; } .hist.log li { grid-template-columns: 1fr; } }

/* ---------- таблиці, звіти ---------- */
.tbl-wrap { overflow-x: auto; margin: 8px -16px -16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; color: var(--muted); font-weight: 650; border-top: 0; }
td.n, th.n { text-align: right; }
.sheet > .tbl-wrap { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.buckets { margin-top: 8px; display: grid; gap: 4px; }
.bucket { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.875rem; }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; }
.t-ok { background: var(--ok); } .t-ink { background: var(--ink); } .t-warn { background: var(--warn); } .t-bad { background: var(--bad); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 0.875rem; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 550; }
@media (max-width: 520px) { dl.kv { grid-template-columns: 1fr; } dl.kv dd { margin-bottom: 6px; } }
ul.plain { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }

/* ---------- вхід / перший запуск ---------- */
.auth { min-height: 88vh; display: grid; place-items: center; padding-block: 28px; }
.auth-card { width: 100%; max-width: 420px; display: grid; gap: 16px; }
.auth-card.wide { max-width: 820px; }
.auth-card > form, .auth-card > .banner { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.auth-brand { display: flex; gap: 14px; align-items: center; }
.auth-brand h1 { color: var(--ink); font-size: 1.625rem; font-weight: 800; }
.legal { font-size: 0.75rem; }
.loading { color: var(--ink); font-size: 1.125rem; font-weight: 600; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.h-start { color: var(--ink); font-size: 1.75rem; }
.code-in { text-transform: uppercase; letter-spacing: .15em; font-family: ui-monospace, Consolas, monospace; font-size: 1.25rem !important; }
.invite-code { font-family: ui-monospace, Consolas, monospace; font-size: 2.375rem; font-weight: 800; letter-spacing: .18em; text-align: center; color: var(--ink); background: var(--ink-soft); border-radius: 12px; padding: 14px; }

/* ---------- вікна ---------- */
.overlay.opaque { background: var(--paper); }
.overlay { position: fixed; inset: 0; background: rgba(10,14,25,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: calc(100% - 12px); overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); margin-bottom: env(safe-area-inset-bottom, 0px); }
.modal.wide { max-width: 720px; }
.modal h2 { font-size: 1.25rem; }
label.f { display: grid; gap: 5px; font-size: 0.8125rem; color: var(--muted); }
label.f input, label.f select, label.f textarea, .modal textarea { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 0.65em 0.8em; font-size: 1rem; min-height: 3em; width: 100%; color: var(--text); }
label.f input[readonly] { opacity: .7; }
.money-in { font-size: 1.875rem !important; font-weight: 750; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 0.8438rem; min-height: 34px; }
.m-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.m-actions.start { justify-content: flex-start; margin-top: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.875rem; }
.check input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.err { color: var(--bad); font-size: 0.8438rem; min-height: 0; }
.err:empty { display: none; }
details summary { cursor: pointer; padding: 6px 0; }
.notices li { border-top: 1px solid var(--line); padding-top: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--paper); padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 0.875rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: var(--on-solid); }
.update-bar { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 8px 8px 14px; display: flex; gap: 10px; align-items: center; font-size: 0.875rem; max-width: calc(100% - 24px); }
.q-item { border-top: 1px solid var(--line); padding-top: 8px; align-items: flex-start; }

/* ---------- адмін-панель ---------- */
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; min-width: 0; flex: 1 1 12rem; scrollbar-width: none; }
.seg.scroll::-webkit-scrollbar { display: none; }
.seg.scroll button { white-space: nowrap; }
.adm-cards { display: none; }
@media (max-width: 760px) {
  .adm-table { display: none; }
  .adm-cards { display: grid; gap: 1px; background: var(--line); }
  .adm-card { background: var(--surface); padding: 12px 14px; display: grid; gap: 8px; }
  .adm-card .row-between { align-items: flex-start; }
  .adm-card .nums { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 0.8125rem; color: var(--muted); }
  .adm-card .nums b { color: var(--text); font-weight: 650; }
}

/* ---------- QR-код запрошення, вхід через Google ---------- */
.qr-box { display: grid; justify-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.qr-box svg { max-width: 100%; height: auto; }
.qr-box p { text-align: center; color: #5a6582; }
.btn.wide-btn { width: 100%; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.8125rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sheet.highlight, form.highlight { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- Фаза 1: нові елементи ---------- */
.page-head h1 { font-size: 1.25rem; }
.icon-btn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 0; }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn.sm { min-width: 36px; min-height: 36px; border-color: transparent; background: transparent; color: var(--muted); }
/* фільтри-чіпи: переносяться на новий рядок, текст ніколи не обрізається */
.seg.chips { flex-wrap: wrap; background: none; padding: 0; gap: 6px; }
.seg.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; min-height: 38px; white-space: nowrap; }
.seg.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); box-shadow: none; }
/* давність боргу: до 7 днів сірий, 8–30 жовтий, 31+ червоний */
.age { display: inline-block; font-size: 0.75rem; font-weight: 650; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.age.mute { background: var(--surface-2); color: var(--muted); }
.age.warn { background: var(--warn-soft); color: var(--warn); }
.age.bad { background: var(--bad-soft); color: var(--bad); }
/* кроки підтвердження у вікні запису */
.confirm-box { border-radius: 10px; padding: 10px 12px; font-size: 0.9375rem; display: grid; gap: 8px; }
.confirm-box.warn { background: var(--warn-soft); color: var(--text); border: 1px solid var(--warn); }
.confirm-box.info { background: var(--info-soft); color: var(--text); border: 1px solid var(--ink); }
.confirm-box.bad { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); }
.confirm-box.ok-box { background: var(--ok-soft); color: var(--text); border: 1px solid var(--ok); }
.claim-box .btn { justify-self: start; }
.confirm-box .check { font-weight: 600; }
/* підписка: компактно, реквізити з кнопкою копіювання */
.sub-box { gap: 8px; }
.price-line { font-size: 0.9375rem; }
.pay-rows { display: grid; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 4px 4px 4px 12px; }
.pay-row { display: grid; grid-template-columns: 5.4em minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.875rem; min-height: 40px; }
.pay-row > span:nth-child(2) { min-width: 0; }
.pay-row b { overflow-wrap: anywhere; font-weight: 650; }
.pay-row small { display: block; font-size: 0.75rem; }
.pay-row .icon-btn.copy { color: var(--ink); min-width: 40px; min-height: 40px; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.actions.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(9em, 1fr)); gap: 8px; }
.contact-line a { font-weight: 600; }
/* повідомлення з кнопкою «Скасувати» */
.toast { display: flex; align-items: center; gap: 12px; }
.toast-act { border: 0; background: transparent; color: inherit; font-weight: 750; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; min-height: 36px; cursor: pointer; white-space: nowrap; }
/* журнал: службові події — сірим і дрібніше */
.hist li.tech .t { color: var(--muted); font-size: 0.8125rem; }
.hist li.tech .chip { opacity: .7; }
/* банер встановлення */
.install-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.install-bar .actions { display: flex; align-items: center; gap: 6px; }

/* головні дії: «Новий борг» і «Прийняти оплату» — великі, на всю ширину */
.main-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.main-actions .btn { font-size: 1.0625rem; font-weight: 700; min-height: 3.4em; }
/* пошук з кнопкою «за номером» */
.search-box { position: relative; display: flex; flex: 1 1 220px; min-width: 0; }
.search-box .search { flex: 1 1 auto; padding-right: 52px; }
.search-box .phone-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-width: 40px; min-height: 40px; border-color: transparent; background: transparent; color: var(--muted); }
.search-box .phone-toggle.on { background: var(--ink); color: var(--on-ink); }
.search-box .phone-toggle svg { width: 20px; height: 20px; }
/* телефон: незмінне «+38» і поле для 10 цифр */
.phone-in { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; margin-top: 4px; }
.phone-in:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
.phone-in .pfx { display: grid; place-items: center; padding: 0 10px 0 12px; background: var(--surface-2); color: var(--text); font-weight: 650; border-right: 1px solid var(--line); }
.phone-in input { border: 0 !important; outline: none; background: transparent !important; flex: 1; min-width: 0; margin: 0 !important; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
/* вибір клієнта */
.pick .rows { max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.pick h3 { margin-top: 2px; }

/* звіти людською мовою */
.story { display: grid; gap: 8px; }
.story p { font-size: 1rem; }
.hero-sum { white-space: nowrap; font-size: clamp(1.7rem, 9vw, 2.2rem); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.mid-sum { font-size: clamp(1.1rem, 5.5vw, 1.5rem); font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-sum.bad, .mid-sum.bad { color: var(--bad); } .mid-sum.ok { color: var(--ok); }
.two-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
ul.days li, ul.staff li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
ul.days li:first-child, ul.staff li:first-child { border-top: 0; }
ul.staff li { display: block; }
/* повідомлення внизу: ширина за текстом, а не половина екрана */
.toast { left: 16px; right: 16px; transform: none; margin: 0 auto; width: fit-content; max-width: min(520px, calc(100% - 32px)); }

/* ================= Адмін-платформа — окремий вигляд ================= */
:root { --adm: #2a2340; --adm-2: #3a3157; --adm-accent: #b9a8ff; }
body.is-admin { background-image: none; background-color: #f3f2f7; padding: 0; }
:root[data-theme="dark"] body.is-admin { background-color: #121018; }
.adm-badge { display: inline-block; background: var(--adm-accent); color: var(--adm); font-weight: 800; font-size: 0.75rem; letter-spacing: .12em; padding: 3px 8px; border-radius: 6px; }
.adm-gate .adm-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.adm-gate .auth-card { border-top: 5px solid var(--adm); }
.secret-key { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 1rem; word-break: break-all; user-select: all; }
.adm-app { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "top top" "nav main"; }
.adm-top { grid-area: top; position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--adm); color: #fff;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
.adm-title { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-spacer { flex: 1; }
.adm-ghost { background: transparent !important; border-color: rgba(255,255,255,.35) !important; color: #fff !important; }
.adm-nav { grid-area: nav; background: var(--surface); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 56px; height: calc(100vh - 56px); }
.adm-nav a { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 600; }
.adm-nav a:hover { background: var(--surface-2); }
.adm-nav a[aria-current="page"] { background: var(--adm); color: #fff; }
.adm-nav a { position: relative; }
.nav-badge { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--bad); color: #fff; font-size: 0.75rem; font-weight: 800; display: inline-grid; place-items: center; }
.claim-sheet { border: 2px solid var(--ok); }
.claim-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.adm-main { grid-area: main; padding: 16px 20px 40px; display: grid; gap: 14px; align-content: start; max-width: 1100px; width: 100%; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .k { font-size: 0.8125rem; color: var(--muted); }
.kpi .v { font-size: 1.5rem; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .v.ok { color: var(--ok); } .kpi .v.bad { color: var(--bad); }
@media (max-width: 860px) {
  .adm-app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
  .adm-main { padding: 14px 16px calc(90px + env(safe-area-inset-bottom, 0px)); }
  .adm-nav { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; z-index: 6;
    border-right: 0; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .adm-nav a { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 0.6875rem; text-align: center; }
  .adm-title { display: none; }
  .nav-badge { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; min-width: 18px; height: 18px; font-size: 0.6875rem; }
}

/* номер/ім’я у пошуку: підписана кнопка замість незрозумілої трубки */
.search-box .phone-toggle { font-weight: 800; font-size: 0.8125rem; letter-spacing: .02em; min-width: 46px; border: 1px solid var(--line) !important; background: var(--surface-2); color: var(--text); }
.search-box .search { padding-right: 58px; }
.row .sum .meter { width: 7rem; }
.chip.owner-code { background: var(--bad-soft); color: var(--bad); }
.quick button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.edit-btn { display: inline-flex; align-items: center; gap: 6px; }
.contact-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pay-row b.mono { white-space: nowrap; }
.pay-row b.iban { white-space: normal; word-break: break-all; }
.sub-box .actions.two .btn { padding: 0.6em 0.6em; line-height: 1.2; }
.contact-line { gap: 6px; }
.contact-line .btn { flex: 1 1 0; }

/* ---- адмінка, фаза B ---- */
.mob-only { display: none; }
.more-btn { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.more-btn.on { background: var(--adm); color: #fff; }
@media (max-width: 860px) {
  .adm-nav .desk-only { display: none; }
  .adm-nav .mob-only { display: flex; flex: 1; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 0.6875rem; border-radius: 10px; }
}
.more-list li { margin-bottom: 6px; }
.more-list .btn { justify-content: flex-start; gap: 10px; }
.shop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.shop-head h1 { font-size: 1.35rem; }
.shop-head-st { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs-h { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -2px; }
.tabs-h::-webkit-scrollbar { display: none; }
.tabs-h a { white-space: nowrap; padding: 10px 12px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tabs-h a[aria-current="page"] { color: var(--text); border-bottom-color: var(--adm); }
.act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 8px; }
.act-form { border: 2px solid var(--adm); }
.chip-radio { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; min-height: 38px; background: var(--surface); cursor: pointer; font-size: 0.875rem; }
.chip-radio:has(input:checked) { background: var(--adm); border-color: var(--adm); color: #fff; }
.chip-radio input { accent-color: var(--adm); }
.calm { font-size: 1.05rem; color: var(--ok); font-weight: 650; margin-top: 6px; }
.note-form { display: flex; gap: 8px; align-items: center; }
.note-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 0.6em 0.8em; min-height: 2.8em; background: var(--paper); color: var(--text); font: inherit; }
ul.notes li { padding: 8px 0; border-top: 1px solid var(--line); }
ul.notes li:first-child { border-top: 0; }
.chip.lbl-vip { background: #f5e6b8; color: #6b4e00; } .chip.lbl-partner { background: var(--ink-soft); color: var(--ink); }
.chip.lbl-test { background: var(--surface-2); color: var(--muted); } .chip.lbl-problem { background: var(--bad-soft); color: var(--bad); }
/* графік записів по днях: одна серія, тонкі стовпчики з проміжком, заокруглений верх */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 120px; padding-top: 6px; border-bottom: 1px solid var(--line); }
.spark .bar { flex: 1; background: var(--adm); border-radius: 4px 4px 0 0; min-width: 3px; position: relative; }
.spark .bar:hover { background: var(--ink); }
:root[data-theme="dark"] .spark .bar { background: var(--adm-accent); }
s { text-decoration-thickness: 1px; }
.promo-link { justify-self: start; padding-left: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
ul.hist-mini li { padding: 4px 0; }
/* банер iPhone: 2 рядки, хрестик угорі праворуч */
.ios-bar { position: relative; padding-right: 44px; line-height: 1.45; }
.ios-bar .x { position: absolute; top: 4px; right: 4px; }
.ios-share { display: inline-block; width: 1.05em; height: 1.2em; vertical-align: -0.2em; color: var(--ink); }

/* ---- Відвідування: списки зі смужками ---- */
.meters { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.meters .m-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.meters .row-between { gap: 10px; }
.meters .meter { height: 6px; border-radius: 3px; display: block; }
.meters .meter i { background: var(--adm); border-radius: 3px; }
:root[data-theme="dark"] .meters .meter i { background: var(--adm-accent); }
.funnel .meter { height: 10px; border-radius: 5px; }

/* ---- виписка клієнта ---- */
.stmt-wrap { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); max-height: 46vh; overflow: auto; }
.stmt header { display: grid; gap: 2px; margin-bottom: 10px; }
.stmt h2 { margin: 2px 0; font-size: 1.15rem; }
.stmt-shop { font-size: .8125rem; color: var(--muted); font-weight: 600; }
.stmt table { width: 100%; border-collapse: collapse; font-size: .875rem; font-variant-numeric: tabular-nums; }
.stmt th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.stmt td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stmt td:first-child { white-space: nowrap; color: var(--muted); }
.stmt .n { text-align: right; white-space: nowrap; }
.stmt .bad { color: var(--bad); font-weight: 700; } .stmt .ok { color: var(--ok); font-weight: 700; }
.stmt tr.open td { color: var(--muted); font-style: italic; }
.stmt-total { font-size: 1.15rem; font-weight: 800; margin: 12px 0 2px; }
.stmt-total.bad { color: var(--bad); } .stmt-total.ok { color: var(--ok); }
.stmt-actions .btn { flex: 1 1 auto; }
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing { background: #fff !important; }
  body.printing #print-area { display: block; color: #000; background: #fff; font-size: 12pt; padding: 0; }
  body.printing #print-area .stmt td, body.printing #print-area .stmt th { border-color: #999; }
  body.printing #print-area .muted, body.printing #print-area .stmt-shop, body.printing #print-area th { color: #444; }
  body.printing #print-area .bad { color: #000; } body.printing #print-area .ok { color: #000; }
  body.printing #print-area .stmt-foot { margin-top: 16px; }
  @page { margin: 14mm; }
}
.stmt td:nth-child(2) { white-space: normal; overflow-wrap: anywhere; }
@media screen and (max-width: 480px) { .stmt-wrap .stmt th:nth-child(4), .stmt-wrap .stmt td:nth-child(4) { display: none; } .stmt-wrap { padding: 10px; } }
.stmt table { table-layout: fixed; }
.stmt th:nth-child(1) { width: 3.4rem; } .stmt th:nth-child(3) { width: 6.6rem; } .stmt th:nth-child(4) { width: 7.4rem; }

/* ---- сторінка «Підписка» (#/billing) ---- */
.back-link { justify-self: start; }
.bill-hero { display: grid; gap: 8px; background: linear-gradient(135deg, var(--ink-soft), var(--surface) 70%); }
.bill-hero.bad { background: linear-gradient(135deg, var(--bad-soft), var(--surface) 70%); }
.bill-hero.warn { background: linear-gradient(135deg, var(--warn-soft), var(--surface) 70%); }
.bill-hero.ok { background: linear-gradient(135deg, var(--ok-soft), var(--surface) 70%); }
.bill-hero h1 { margin: 0; font-size: 1.375rem; }
.bill-hero p { margin: 0; }
.hero-main { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.hero-main b { font-size: 3rem; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }

M.idb = (function () {

// Мінімальна обгортка над IndexedDB — локальна копія даних для роботи без інтернету.
const DB_NAME = 'zoshyt';
const VERSION = 1;
let dbp = null;

function open() {
  if (dbp) return dbp;
  dbp = new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, VERSION);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('clients')) db.createObjectStore('clients', { keyPath: 'id' }).createIndex('shop', 'shop_id');
      if (!db.objectStoreNames.contains('ops')) db.createObjectStore('ops', { keyPath: 'id' }).createIndex('shop', 'shop_id');
      if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath: 'seq', autoIncrement: true });
    };
    r.onsuccess = () => {
      const db = r.result;
      db.onversionchange = () => { db.close(); dbp = null; };
      resolve(db);
    };
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error('База зайнята іншою вкладкою. Закрийте інші вкладки з програмою.'));
  });
  return dbp;
}

const wrap = (req) => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
const done = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort')); });

async function get(store, key) {
  const db = await open();
  return wrap(db.transaction(store).objectStore(store).get(key));
}
async function put(store, value, key) {
  const db = await open();
  const tx = db.transaction(store, 'readwrite');
  const r = key === undefined ? tx.objectStore(store).put(value) : tx.objectStore(store).put(value, key);
  const k = await wrap(r); await done(tx); return k;
}
async function putMany(store, values) {
  if (!values.length) return;
  const db = await open();
  const tx = db.transaction(store, 'readwrite');
  const os = tx.objectStore(store);
  for (const v of values) os.put(v);
  await done(tx);
}
async function del(store, key) {
  const db = await open();
  const tx = db.transaction(store, 'readwrite');
  tx.objectStore(store).delete(key);
  await done(tx);
}
async function all(store) {
  const db = await open();
  return wrap(db.transaction(store).objectStore(store).getAll());
}
async function byShop(store, shopId) {
  const db = await open();
  return wrap(db.transaction(store).objectStore(store).index('shop').getAll(shopId));
}
async function clearAll() {
  const db = await open();
  const names = ['kv', 'clients', 'ops', 'outbox'];
  const tx = db.transaction(names, 'readwrite');
  names.forEach(n => tx.objectStore(n).clear());
  await done(tx);
}

const kv = {
  get: (k) => get('kv', k),
  set: (k, v) => put('kv', v, k),
  del: (k) => del('kv', k),
};

/** Попросити браузер не видаляти локальні дані при нестачі місця */
async function persist() {

function encodeData(bytes, ver) {
  const bits = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(0b0100, 4);              // режим "байти"
  push(bytes.length, 8);        // довжина (версії 1–9 — 8 біт)
  bytes.forEach(b => push(b, 8));
  const cap = ver.data * 8;
  if (bits.length > cap) return null;
  for (let i = 0; i < 4 && bits.length < cap; i++) bits.push(0);   // термінатор
  while (bits.length % 8) bits.push(0);
  const out = [];
  for (let i = 0; i < bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8).join(''), 2));
  const PAD = [0xec, 0x11];
  for (let i = 0; out.length < ver.data; i++) out.push(PAD[i % 2]);
  return out;
}

function interleave(data, ver) {
  const per = ver.data / ver.blocks;
  const blocks = [], eccs = [];
  for (let i = 0; i < ver.blocks; i++) {
    const b = data.slice(i * per, (i + 1) * per);
    blocks.push(b);
    eccs.push(eccBytes(b, ver.ecc));
  }
  const out = [];
  for (let i = 0; i < per; i++) for (const b of blocks) out.push(b[i]);
  for (let i = 0; i < ver.ecc; i++) for (const e of eccs) out.push(e[i]);
  return out;
}

// ---------- матриця ----------
function emptyMatrix(size) {
  return { m: Array.from({ length: size }, () => new Array(size).fill(null)), size };
}
function placeFinder(M, r, c) {
  for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) {
    const y = r + i, x = c + j;
    if (y < 0 || x < 0 || y >= M.size || x >= M.size) continue;
    const inRing = (i >= 0 && i <= 6 && (j === 0 || j === 6)) || (j >= 0 && j <= 6 && (i === 0 || i === 6));
    const inCore = i >= 2 && i <= 4 && j >= 2 && j <= 4;
    M.m[y][x] = inRing || inCore;
  }
}
function placeAlignment(M, ver) {
  const pos = ver.align;
  for (const r of pos) for (const c of pos) {
    if ((r <= 8 && c <= 8) || (r <= 8 && c >= M.size - 9) || (r >= M.size - 9 && c <= 8)) continue;
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      M.m[r + i][c + j] = Math.max(Math.abs(i), Math.abs(j)) !== 1;
    }
  }
}
function reserveFormat(M) {
  const s = M.size;
  for (let i = 0; i <= 8; i++) {
    if (M.m[8][i] === null) M.m[8][i] = false;
    if (M.m[i][8] === null) M.m[i][8] = false;
  }
  for (let i = 0; i < 8; i++) {
    if (M.m[8][s - 1 - i] === null) M.m[8][s - 1 - i] = false;
    if (M.m[s - 1 - i][8] === null) M.m[s - 1 - i][8] = false;
  }
  M.m[s - 8][8] = true;   // завжди темний модуль
}
function skeleton(ver) {
  const M = emptyMatrix(ver.size);
  placeFinder(M, 0, 0); placeFinder(M, 0, ver.size - 7); placeFinder(M, ver.size - 7, 0);
  placeAlignment(M, ver);
  for (let i = 8; i < ver.size - 8; i++) {   // синхродоріжки
    M.m[6][i] = i % 2 === 0;
    M.m[i][6] = i % 2 === 0;
  }
  reserveFormat(M);
  return M;
}

const MASKS = [
  (r, c) => (r + c) % 2 === 0,
  (r) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

function placeData(base, codewords, maskIdx) {
  const size = base.size;
  const m = base.m.map(row => row.slice());
  const bits = [];
  codewords.forEach(b => { for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1); });
  let bi = 0, up = true;
  for (let col = size - 1; col > 0; col -= 2) {
    if (col === 6) col--;                      // стовпець синхродоріжки пропускаємо
    for (let k = 0; k < size; k++) {
      const row = up ? size - 1 - k : k;
      for (const c of [col, col - 1]) {
        if (m[row][c] !== null) continue;
        let bit = bi < bits.length ? bits[bi++] : 0;
        if (MASKS[maskIdx](row, c)) bit ^= 1;
        m[row][c] = bit === 1;
      }
    }
    up = !up;
  }
  return { m, size };
}

function putFormat(M, maskIdx) {
  const fmt = 0b00 << 3 | maskIdx;            // рівень M = 00
  let rem = fmt << 10;
  for (let i = 4; i >= 0; i--) if (rem & (1 << (i + 10))) rem ^= 0b10100110111 << i;
  const bits = ((fmt << 10) | rem) ^ 0b101010000010010;
  const get = (i) => ((bits >> i) & 1) === 1;
  const s = M.size;
  const set = (r, c, v) => { M.m[r][c] = v; };
  // Копія 1: біти 0–5 — стовпець 8 згори вниз, далі кут, далі рядок 8 справа наліво.
  for (let i = 0; i <= 5; i++) set(i, 8, get(i));
  set(7, 8, get(6)); set(8, 8, get(7)); set(8, 7, get(8));
  for (let i = 9; i <= 14; i++) set(8, 14 - i, get(i));
  // Копія 2: біти 0–7 — рядок 8 біля правого шукача, біти 8–14 — стовпець 8 знизу.
  for (let i = 0; i <= 7; i++) set(8, s - 1 - i, get(i));
  for (let i = 8; i <= 14; i++) set(s - 15 + i, 8, get(i));
  set(s - 8, 8, true);   // завжди темний модуль
}

// ---------- оцінка масок (як у стандарті) ----------
function penalty(M) {
  const s = M.size, g = (r, c) => M.m[r][c] === true;
  let p = 0;
  for (let r = 0; r < s; r++) for (const dir of [0, 1]) {
    let run = 1;
    for (let c = 1; c < s; c++) {
      const a = dir ? g(c, r) : g(r, c), b = dir ? g(c - 1, r) : g(r, c - 1);
      if (a === b) { run++; if (run === 5) p += 3; else if (run > 5) p += 1; }
      else run = 1;
    }
  }
  for (let r = 0; r < s - 1; r++) for (let c = 0; c < s - 1; c++) {
    const v = g(r, c);
    if (v === g(r, c + 1) && v === g(r + 1, c) && v === g(r + 1, c + 1)) p += 3;
  }
  const pat = [true, false, true, true, true, false, true, false, false, false, false];
  const rev = pat.slice().reverse();
  const match = (arr, i, pattern) => pattern.every((v, k) => arr[i + k] === v);
  for (let r = 0; r < s; r++) {
    const row = [], col = [];
    for (let c = 0; c < s; c++) { row.push(g(r, c)); col.push(g(c, r)); }
    for (let i = 0; i + 11 <= s; i++) {
      if (match(row, i, pat) || match(row, i, rev)) p += 40;
      if (match(col, i, pat) || match(col, i, rev)) p += 40;
    }
  }
  let dark = 0;
  for (let r = 0; r < s; r++) for (let c = 0; c < s; c++) if (g(r, c)) dark++;
  p += Math.floor(Math.abs(dark * 100 / (s * s) - 50) / 5) * 10;
  return p;
}

/** Матриця QR-коду для тексту (true = темний модуль) */
function qrMatrix(text) {
  const bytes = [...new TextEncoder().encode(text)];
  const ver = VERSIONS.find(v => encodeData(bytes, v));
  if (!ver) throw new Error('Текст задовгий для QR-коду');
  const codewords = interleave(encodeData(bytes, ver), ver);
  const base = skeleton(ver);
  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const M = placeData(base, codewords, mask);
    putFormat(M, mask);
    const p = penalty(M);
    if (!best || p < best.p) best = { M, p, mask };
  }
  return best.M.m.map(row => row.map(v => v === true));
}

/** Готовий SVG з QR-кодом (з білим полем навколо, як вимагає стандарт) */
function qrSvg(text, { size = 240, quiet = 4 } = {}) {
  const m = qrMatrix(text);
  const n = m.length + quiet * 2;
  let path = '';
  m.forEach((row, r) => row.forEach((v, c) => { if (v) path += `M${c + quiet} ${r + quiet}h1v1h-1z`; }));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${size}" height="${size}" role="img" aria-label="QR-код запрошення" shape-rendering="crispEdges">
    <rect width="${n}" height="${n}" fill="#ffffff"/><path d="${path}" fill="#000000"/></svg>`;
}

return { qrMatrix, qrSvg };
})();

M.api = (function () {
const { lsGet, lsSet } = M.util;
// Зв'язок із Supabase: вхід/реєстрація (Auth) і виклики функцій бази (RPC).
// Без сторонніх бібліотек — лише fetch.

const CFG = window.ZOSHYT_CONFIG || {};
const BASE = String(CFG.supabaseUrl || '').replace(/\/+$/, '');
const KEY = CFG.supabaseAnonKey || '';
const SESSION_KEY = 'zoshyt.session';
const TIMEOUT = 20000;

const configured = () => !!(BASE && KEY && !BASE.includes('YOUR-PROJECT'));

/** Помилка з кодом, який розуміє застосунок */
class ApiError extends Error {
  constructor(message, { code = 'error', status = 0, network = false, auth = false } = {}) {
    super(message);
    this.code = code; this.status = status; this.network = network; this.auth = auth;
  }
}

// ---------- сесія ----------
function getSession() {
  try { return JSON.parse(lsGet(SESSION_KEY) || 'null'); } catch { return null; }
}
function saveSession(s) {
  const expires_at = s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
  const v = { access_token: s.access_token, refresh_token: s.refresh_token, expires_at, user: s.user };
  lsSet(SESSION_KEY, JSON.stringify(v));
  return v;
}
function clearSession() { lsSet(SESSION_KEY, null); }

const listeners = new Set();
/** Подія: сесія стала недійсною (напр. змінили пароль на іншому пристрої) */
const onAuthExpired = (fn) => listeners.add(fn);
const emitExpired = () => listeners.forEach(fn => { try { fn(); } catch { /* */ } });

// ---------- низькорівневий запит ----------
async function request(path, { method = 'POST', body, token } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
  let res;
  try {
    res = await fetch(BASE + path, {
      method,
      headers: token ? { apikey: KEY, 'content-type': 'application/json', authorization: 'Bearer ' + token } : { apikey: KEY, 'content-type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl.signal,
      cache: 'no-store',
    });
  } catch (e) {
    throw new ApiError('Немає зв’язку з сервером. Перевірте інтернет.', { code: 'network', network: true });
  } finally { clearTimeout(timer); }
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { message: text }; }
  if (!res.ok) {
    if (res.status >= 500 || res.status === 429) {
      throw new ApiError(res.status === 429 ? 'Забагато запитів. Спробуйте за хвилину.' : 'Сервер тимчасово недоступний.', { code: res.status === 429 ? 'rate_limited' : 'server', status: res.status, network: true });
    }
    const code = (data && (data.hint || data.error_code || data.error || data.code)) || 'error';
    const msg = (data && (data.hint ? data.message : (data.msg || data.error_description || data.message))) || 'Помилка запиту.';
    throw new ApiError(msg, { code: String(code), status: res.status, auth: res.status === 401 });
  }
  return data;
}

// ---------- Auth ----------
const AUTH_ERRORS = {
  invalid_credentials: 'Невірний email або пароль.',
  invalid_grant: 'Невірний email або пароль.',
  email_not_confirmed: 'Email ще не підтверджено. Відкрийте лист від нас і натисніть посилання.',
  user_already_exists: 'Такий email уже зареєстровано. Увійдіть або відновіть пароль.',
  weak_password: 'Пароль закороткий — мінімум 8 символів.',
  validation_failed: 'Перевірте правильність email.',
  over_email_send_rate_limit: 'Забагато листів за короткий час. Спробуйте пізніше.',
  over_request_rate_limit: 'Забагато спроб. Спробуйте за кілька хвилин.',
  same_password: 'Новий пароль має відрізнятися від старого.',
};
function authErr(e) {
  if (e instanceof ApiError && AUTH_ERRORS[e.code]) e.message = AUTH_ERRORS[e.code];
  return e;
}

async function signUp(email, password, name) {
  try {
    const r = await request('/auth/v1/signup', { body: { email: email.trim(), password, data: { name } } });
    if (r && r.access_token) return { session: saveSession(r) };
    return { needsConfirm: true };   // у Supabase увімкнено підтвердження email
  } catch (e) { throw authErr(e); }
}

async function signIn(email, password) {
  try {
    const r = await request('/auth/v1/token?grant_type=password', { body: { email: email.trim(), password } });
    return saveSession(r);
  } catch (e) { throw authErr(e); }
}

/** Вийти лише на ЦЬОМУ пристрої (scope=local). Без scope Supabase виходить з усіх пристроїв акаунта. */
async function signOut() {
  const s = getSession();
  clearSession();
  if (s) { try { await request('/auth/v1/logout?scope=local', { token: s.access_token }); } catch { /* офлайн — не страшно */ } }
}

// ---------- вхід кодом з пошти (для iPhone: посилання з листа відкрилося б у Safari, а не в програмі) ----------
async function sendEmailCode(email) {
  try { await request('/auth/v1/otp', { body: { email: email.trim(), create_user: false } }); }
  catch (e) {
    if (e.code === 'otp_disabled' || e.code === 'user_not_found') e.message = 'Акаунта з таким email немає. Зареєструйтесь або перевірте адресу.';
    throw authErr(e);
  }
}
async function verifyEmailCode(email, code) {
  try {
    const r = await request('/auth/v1/verify', { body: { type: 'email', email: email.trim(), token: String(code).replace(/\D/g, '') } });
    return saveSession(r);
  } catch (e) {
    if (e.status === 403 || e.status === 400 || e.code === 'otp_expired') e.message = 'Код невірний або застарів. Надішліть новий.';
    throw e;
  }
}
/** Кнопка зі сторінки #/confirm (посилання з нашого листа): одноразовий token_hash → сесія */
async function verifyTokenHash(type, tokenHash) {
  try {
    const r = await request('/auth/v1/verify', { body: { type, token_hash: tokenHash } });
    return r && r.access_token ? saveSession(r) : { message: (r && (r.msg || r.message)) || '' };
  } catch (e) {
    if (e.status === 403 || e.status === 400 || e.code === 'otp_expired') e.message = 'Посилання вже використане або застаріло. Запросіть новий лист.';
    throw e;
  }
}

async function recoverPassword(email) {
  const back = location.origin + location.pathname;
  try { await request('/auth/v1/recover?redirect_to=' + encodeURIComponent(back), { body: { email: email.trim() } }); }
  catch (e) { throw authErr(e); }
}

/** Перехід до входу через Google (повертає на цю саму сторінку) */
function googleSignInUrl() {
  const back = location.origin + location.pathname;
  return `${BASE}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(back)}`;
}

/** Повернення з листа або від Google приходить у вигляді #access_token=...&type=... */
function takeSessionFromUrl() {
  const h = location.hash.replace(/^#/, '');
  if (!h.includes('access_token=')) return false;
  const p = new URLSearchParams(h);
  if (p.get('error_description')) return { error: p.get('error_description') };
  saveSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, user: null });
  history.replaceState(null, '', location.pathname + location.search);
  return { type: p.get('type') || 'magiclink' };
}

/** Новий пароль. Після зміни — вихід на всіх ІНШИХ пристроях (якщо пароль хтось знав, його сесії закриваються). */
async function updatePassword(password) {
  const token = await accessToken();
  let r;
  try { r = await request('/auth/v1/user', { method: 'PUT', body: { password }, token }); }
  catch (e) { throw authErr(e); }
  try { await request('/auth/v1/logout?scope=others', { token: await accessToken() }); } catch { /* не критично */ }
  return r;
}

async function fetchUser() {
  const token = await accessToken();
  const u = await request('/auth/v1/user', { method: 'GET', token });
  const s = getSession();
  if (s) { s.user = u; lsSet(SESSION_KEY, JSON.stringify(s)); }
  return u;
}

let refreshing = null;
async function doRefresh() {
  const run = async () => {
    const s = getSession();            // читаємо заново: інша вкладка могла вже оновити
    if (!s) throw new ApiError('Потрібно увійти.', { code: 'not_authenticated', auth: true });
    if (s.expires_at - Date.now() / 1000 > 60) return s;
    try {
      const r = await request('/auth/v1/token?grant_type=refresh_token', { body: { refresh_token: s.refresh_token } });
      return saveSession({ ...r, user: r.user || s.user });
    } catch (e) {
      if (e.network) throw e;
      // сервер відмовив в оновленні сесії (400/401) — треба увійти знову; черга записів зберігається
      clearSession(); emitExpired();
      throw new ApiError('Сесія закінчилась — увійдіть знову.', { code: 'not_authenticated', auth: true, status: e.status });
    }
  };
  if (navigator.locks && navigator.locks.request) return navigator.locks.request('zoshyt-auth-refresh', run);
  return run();
}

/** Дійсний токен доступу (оновлює, якщо скоро спливає). Офлайн повертає старий. */
async function accessToken() {
  const s = getSession();
  if (!s) throw new ApiError('Потрібно увійти.', { code: 'not_authenticated', auth: true });
  if (s.expires_at - Date.now() / 1000 > 60) return s.access_token;
  if (!refreshing) refreshing = doRefresh().finally(() => { refreshing = null; });
  try { return (await refreshing).access_token; }
  catch (e) { if (e.network) return s.access_token; throw e; }
}

// ---------- RPC ----------
const mfaListeners = new Set();
/** Подія: сервер просить код 2FA (напр. довірений пристрій відкликали) — адмінка покаже екран коду */
const onMfaRequired = (fn) => mfaListeners.add(fn);
async function rpc(fn, args = {}) {
  let token = await accessToken();
  try {
    return await request('/rest/v1/rpc/' + fn, { body: args, token });
  } catch (e) {
    if (e.status === 401 && !e.network) {
      // токен прострочено — одна спроба з оновленим
      const s = getSession(); if (s) { s.expires_at = 0; lsSet(SESSION_KEY, JSON.stringify(s)); }
      token = await accessToken();
      return await request('/rest/v1/rpc/' + fn, { body: args, token });
    }
    if (e.code === 'mfa_required') mfaListeners.forEach(f => { try { f(); } catch { /* */ } });
    throw e;
  }
}

/** Поля токена входу (без перевірки підпису — лише для інтерфейсу) */
function claims() {
  const s = getSession();
  try { return JSON.parse(atob(s.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return {}; }
}
/** Ідентифікатор сесії входу: однаковий, доки людина не вийшла (оновлення токена його не змінює) */
const sessionId = () => claims().session_id || null;

// ---------- двофакторний вхід (TOTP, Google Authenticator) ----------
/** Рівень входу поточної сесії: 'aal1' — лише пароль, 'aal2' — пароль + код */
function currentAal() { return claims().aal || 'aal1'; }
async function mfaFactors() {
  const u = await fetchUser();
  return (u && u.factors) || [];
}
async function mfaEnroll() {
  const token = await accessToken();
  return request('/auth/v1/factors', { body: { factor_type: 'totp', friendly_name: 'Зошит адмін ' + new Date().toISOString().slice(0, 16), issuer: 'Зошит боржників' }, token });
}
async function mfaUnenroll(id) {
  const token = await accessToken();
  return request('/auth/v1/factors/' + id, { method: 'DELETE', token });
}
/** Перевірити код: при успіху сесія стає aal2 */
async function mfaVerify(factorId, code) {
  const token = await accessToken();
  const ch = await request(`/auth/v1/factors/${factorId}/challenge`, { body: {}, token });
  try {
    const r = await request(`/auth/v1/factors/${factorId}/verify`, { body: { challenge_id: ch.id, code: String(code).replace(/\D/g, '') }, token });
    return saveSession({ ...r, user: r.user || (getSession() || {}).user });
  } catch (e) {
    if (e.status === 422 || e.status === 400) e.message = 'Невірний код. Перевірте, що час на телефоні правильний, і введіть новий код.';
    throw e;
  }
}

// ---------- лічильник відвідувань (без cookies, без сторонніх сервісів) ----------
const SRC_KEY = 'zoshyt.utm';
const deviceType = () => /iPad|Tablet/i.test(navigator.userAgent) ? 'tablet' : /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

/** Звідки людина прийшла вперше (UTM-мітки / сайт-джерело) — пам'ятаємо 60 днів */
function firstSource() {
  let s = null;
  try { s = JSON.parse(lsGet(SRC_KEY) || 'null'); } catch { s = null; }
  if (s && s.at && Date.now() - s.at > 60 * 864e5) s = null;
  if (!s) {
    const q = new URLSearchParams(location.search);
    const ref = document.referrer && !document.referrer.startsWith(location.origin) ? document.referrer : '';
    const n = {};
    for (const k of ['utm_source', 'utm_medium', 'utm_campaign']) if (q.get(k)) n[k] = q.get(k).slice(0, 60);
    if (ref) { try { n.ref = new URL(ref).hostname; } catch { /* */ } }
    if (Object.keys(n).length) { s = { ...n, at: Date.now() }; lsSet(SRC_KEY, JSON.stringify(s)); }
  }
  return s;
}
/** Джерело для create_shop: лише дозволені поля */
function sourceForSignup() {
  const s = firstSource();
  if (!s) return null;
  const o = {};
  for (const k of ['utm_source', 'utm_medium', 'utm_campaign', 'ref']) if (s[k]) o[k] = s[k];
  if (s.landing) o.landing = true;
  return Object.keys(o).length ? o : null;
}
/** Публічні налаштування (без входу): чи увімкнено вхід кодом з пошти, бот підтримки. Кеш на пристрої. */
let pubInfo = null;
async function publicInfo() {
  if (pubInfo) return pubInfo;
  try { pubInfo = JSON.parse(lsGet('zoshyt.pub') || 'null'); } catch { pubInfo = null; }
  try {
    const fresh = await request('/rest/v1/rpc/public_info', { body: {} });
    if (fresh) { pubInfo = fresh; lsSet('zoshyt.pub', JSON.stringify(fresh)); }
  } catch { /* офлайн — беремо збережене */ }
  return pubInfo || {};
}
const tracked = new Set();
/** Одна позначка «переглянуто» на сторінку за відкриття застосунку. Помилки ігноруються. */
function trackView(page) {
  if (!configured() || tracked.has(page)) return;
  tracked.add(page);
  const s = firstSource();
  const utm = s ? { utm_source: s.utm_source, utm_medium: s.utm_medium, utm_campaign: s.utm_campaign } : null;
  try {
    fetch(BASE + '/rest/v1/rpc/track_visit', { method: 'POST', keepalive: true, cache: 'no-store',
      headers: { apikey: KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ p_event: 'view', p_page: page, p_ref: s && s.ref ? 'https://' + s.ref : null, p_utm: utm, p_device: deviceType() }) }).catch(() => {});
  } catch { /* */ }
}

return { configured, ApiError, getSession, clearSession, onAuthExpired, signUp, signIn, signOut, sendEmailCode, verifyEmailCode, verifyTokenHash, recoverPassword, googleSignInUrl, takeSessionFromUrl, updatePassword, fetchUser, accessToken, onMfaRequired, rpc, sessionId, currentAal, mfaFactors, mfaEnroll, mfaUnenroll, mfaVerify, firstSource, sourceForSignup, publicInfo, trackView };
})();

let modalClose = null;
function openModal(html, { onClose, wide = false, opaque = false } = {}) {
  const m = $('#modal');
  m.classList.toggle('opaque', opaque);
  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  document.body.classList.add('modal-open');
  modalClose = onClose || null;
  const f = m.querySelector('[autofocus]') || m.querySelector('input,select,textarea,button');
  if (f) f.focus();   // одразу, в межах дотику — інакше на iPhone не з’являється клавіатура
}
function closeModal() {
  const m = $('#modal');
  if (m.hidden) return;
  m.hidden = true; m.innerHTML = '';
  document.body.classList.remove('modal-open');
  const cb = modalClose; modalClose = null;
  if (cb) cb();
}
const modalOpen = () => !$('#modal').hidden;

/** Коротке повідомлення внизу. action: {label, fn} — кнопка (напр. «Скасувати»), ms — скільки показувати */
function toast(msg, tone = '', { action = null, ms = 3200 } = {}) {
  const t = $('#toast');
  t.className = 'toast ' + tone; t.hidden = false;
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="toast-act">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.hidden = true; clearTimeout(toast.t); action.fn(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, action ? Math.max(ms, 5000) : ms);
}

/** Показати помилку у формі (елемент .err усередині) */
function formError(form, msg) {
  const e = form.querySelector('.err');
  if (e) { e.textContent = msg || ''; if (msg) e.scrollIntoView({ block: 'nearest' }); }
  // помилка — введене не збережено, тож фонове оновлення екрана має його зберегти
  if (msg) for (const el of form.querySelectorAll('input, textarea, select')) {
    if (el._orig === undefined) continue;
    if (el.type === 'checkbox') el.defaultChecked = el._orig;
    else if (el.tagName === 'SELECT') [...el.options].forEach(o => { o.defaultSelected = o.value === el._orig; });
    else el.defaultValue = el._orig;
    el._orig = undefined;
  }
  else if (msg) toast(msg, 'bad');
}

/** Кнопка "зайнята" на час асинхронної дії */
async function busy(form, fn) {
  const btn = form.querySelector('[type=submit]');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'Зачекайте…'; }
  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
}

function confirmBox({ title, text, ok = 'Так', cancel = 'Скасувати', danger = false }) {
  return new Promise(resolve => {
    openModal(`<div class="stack">
      <h2>${esc(title)}</h2>
      ${text ? `<p class="muted">${text}</p>` : ''}
      <div class="m-actions">
        <button type="button" class="btn ghost" data-act="confirm-no">${esc(cancel)}</button>
        <button type="button" class="btn ${danger ? 'bad' : 'ink'}" data-act="confirm-yes">${esc(ok)}</button>
      </div></div>`, { onClose: () => resolve(false) });
    actions['confirm-yes'] = () => { modalClose = null; closeModal(); resolve(true); };
    actions['confirm-no'] = () => { closeModal(); };
  });
}
